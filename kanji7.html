<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>漢字7回｜予習シリーズ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Kaisei+HarunoUmi:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--surface:#161b27;--card:#1e2535;--border:rgba(255,255,255,0.08);--accent:#4a9eff;--accent2:#2a6aaa;--green:#3dd68c;--red:#f05a5a;--gold:#f0c040;--text:#e8eaf0;--muted:rgba(232,234,240,0.45);--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{max-width:600px;margin:0 auto;padding:0 16px 60px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;}
.header-title{font-family:'Kaisei HarunoUmi',serif;font-size:1.3rem;color:var(--accent);}
.header-sub{font-size:0.68rem;color:var(--muted);margin-top:2px;}
.reset-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:0.7rem;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;}
.reset-btn:hover{border-color:var(--red);color:var(--red);}
.tab-bar{display:flex;gap:8px;margin-bottom:20px;}
.tab-btn{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;text-align:center;}
.tab-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(74,158,255,0.08);}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.summary-label{font-size:0.7rem;color:var(--muted);letter-spacing:0.12em;margin-bottom:12px;}
.mastery-bar-wrap{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin-bottom:10px;}
.mastery-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px;transition:width 0.6s;}
.mastery-stats{display:flex;gap:20px;}
.stat-item{display:flex;flex-direction:column;gap:2px;}
.stat-num{font-family:'Kaisei HarunoUmi',serif;font-size:1.5rem;line-height:1;color:var(--accent);}
.stat-label{font-size:0.65rem;color:var(--muted);}
.section-label{font-size:0.7rem;color:var(--muted);letter-spacing:0.12em;margin:20px 0 10px;}
.question-list{display:flex;flex-direction:column;gap:6px;margin-bottom:100px;}
.q-item{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;gap:12px;}
.q-status{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:900;flex-shrink:0;}
.q-status.mastered{background:rgba(61,214,140,0.15);color:var(--green);border:1.5px solid var(--green);}
.q-status.learning{background:rgba(74,158,255,0.12);color:var(--accent);border:1.5px solid rgba(74,158,255,0.4);}
.q-status.new{background:rgba(255,255,255,0.04);color:var(--muted);border:1.5px solid var(--border);}
.q-info{flex:1;}
.q-kanji{font-size:1.1rem;font-weight:700;}
.q-reading{font-size:0.7rem;color:var(--muted);margin-top:1px;}
.q-count{font-size:0.68rem;color:var(--muted);}
.mastery-badge{display:inline-block;font-size:0.62rem;padding:2px 7px;border-radius:10px;margin-left:8px;vertical-align:middle;font-weight:700;}
.badge-new{background:rgba(240,192,64,0.15);color:var(--gold);}
.badge-learning{background:rgba(74,158,255,0.15);color:var(--accent);}
.badge-mastered{background:rgba(61,214,140,0.15);color:var(--green);}
.home-btns{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;padding:12px 16px 20px;background:linear-gradient(to top,var(--bg) 80%,transparent);display:flex;flex-direction:column;gap:8px;}
.study-btn{width:100%;background:linear-gradient(135deg,#1a3a5a,#0e2540);border:1.5px solid var(--accent);border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.study-btn:active{transform:scale(0.98);}
.start-row{display:flex;gap:8px;}
.start-btn{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;padding:14px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;}
.start-btn:active{transform:scale(0.98);}
.weak-btn{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;}
.weak-btn:disabled{opacity:0.35;cursor:default;}
#study-screen{display:none;}
.study-nav{display:flex;align-items:center;gap:12px;padding:16px 0 12px;}
.back-icon{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 8px 4px 0;}
.study-progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.study-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:2px;transition:width 0.4s;}
.study-progress-text{font-size:0.75rem;color:var(--muted);}
.kanji-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 24px;margin-bottom:16px;position:relative;overflow:hidden;}
.kanji-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(74,158,255,0.06),transparent 70%);pointer-events:none;}
.kanji-big{font-family:'Kaisei HarunoUmi',serif;font-size:5rem;color:var(--accent);text-align:center;line-height:1;margin-bottom:16px;text-shadow:0 0 40px rgba(74,158,255,0.3);}
.kanji-readings{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.reading-badge{background:rgba(74,158,255,0.1);border:1px solid rgba(74,158,255,0.25);border-radius:20px;padding:4px 14px;font-size:0.78rem;}
.reading-label{font-size:0.6rem;color:var(--muted);margin-right:4px;}
.reading-val{color:var(--accent);font-weight:700;}
.kanji-meanings{margin-bottom:20px;}
.meaning-title{font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:8px;}
.meaning-item{background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 14px;margin-bottom:6px;font-size:0.88rem;line-height:1.6;}
.meaning-num{color:var(--accent);font-weight:700;margin-right:6px;font-size:0.75rem;}
.kanji-examples{margin-bottom:8px;}
.example-title{font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:8px;}
.example-list{display:flex;flex-direction:column;gap:6px;}
.example-item{display:flex;align-items:baseline;gap:8px;font-size:0.85rem;}
.example-word{font-weight:700;color:var(--text);min-width:80px;}
.example-meaning{color:var(--muted);font-size:0.8rem;line-height:1.5;}
.card-nav-row{display:flex;gap:10px;align-items:center;}
.prev-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;cursor:pointer;}
.next-card-btn{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.next-card-btn:active{transform:scale(0.98);}
.study-complete{background:var(--card);border:1px solid rgba(61,214,140,0.3);border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;}
.complete-icon{font-size:2.5rem;margin-bottom:8px;}
.complete-msg{font-size:1rem;font-weight:700;color:var(--green);margin-bottom:4px;}
.complete-sub{font-size:0.8rem;color:var(--muted);}
.goto-quiz-row{display:flex;gap:8px;margin-top:16px;}
.goto-btn{flex:1;border:none;border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;}
.goto-renshu{background:linear-gradient(135deg,#e05a2b,#c04420);}
.goto-kakunin{background:linear-gradient(135deg,var(--accent),var(--accent2));}
#quiz-screen{display:none;}
.quiz-header{display:flex;align-items:center;gap:12px;padding:16px 0 12px;}
.quiz-progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:2px;transition:width 0.4s;}
.quiz-progress-text{font-size:0.75rem;color:var(--muted);}
.mode-tag{display:inline-block;font-size:0.62rem;background:rgba(74,158,255,0.12);color:var(--accent);border:1px solid rgba(74,158,255,0.25);padding:3px 10px;border-radius:20px;letter-spacing:0.1em;margin-bottom:14px;font-weight:700;}
.quiz-card-q{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px 20px;margin-bottom:16px;}
.quiz-q{font-size:1rem;line-height:1.85;font-weight:500;white-space:pre-wrap;}
.hint-btn{background:none;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:5px 14px;color:var(--muted);font-size:0.72rem;cursor:pointer;margin-top:12px;font-family:'Zen Kaku Gothic New',sans-serif;}
.hint-btn:hover{border-color:var(--accent);color:var(--accent);}
.quiz-hint{font-size:0.72rem;color:var(--accent);margin-top:8px;display:none;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:16px 10px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(74,158,255,0.07);}
.choice-btn.correct{background:rgba(61,214,140,0.12);border-color:var(--green);color:var(--green);}
.choice-btn.wrong{background:rgba(240,90,90,0.1);border-color:var(--red);color:var(--red);}
.choice-btn:disabled{cursor:default;}
.input-area{margin-bottom:12px;}
.kanji-input{width:100%;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:18px;color:white;font-size:1.5rem;font-family:'Kaisei HarunoUmi',serif;font-weight:700;text-align:center;outline:none;transition:border-color 0.2s;letter-spacing:0.15em;margin-bottom:8px;}
.kanji-input:focus{border-color:var(--accent);}
.kanji-input.correct{border-color:var(--green);}
.kanji-input.wrong{border-color:var(--red);}
.submit-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;padding:14px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.95rem;font-weight:900;cursor:pointer;}
.feedback{border-radius:14px;padding:14px 18px;margin-bottom:12px;font-size:0.85rem;line-height:1.75;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:rgba(61,214,140,0.1);border:1px solid rgba(61,214,140,0.3);}
.feedback.ng{background:rgba(240,90,90,0.08);border:1px solid rgba(240,90,90,0.25);}
.fb-title{font-weight:700;font-size:0.95rem;margin-bottom:4px;}
.feedback.ok .fb-title{color:var(--green);}
.feedback.ng .fb-title{color:var(--red);}
.next-btn{width:100%;background:var(--accent);border:none;border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;display:none;}
.next-btn.show{display:block;}
#result-screen{display:none;}
.result-wrap{padding:20px 0;}
.result-top{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:16px;}
.result-circle{width:90px;height:90px;border-radius:50%;border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;background:rgba(74,158,255,0.06);}
.result-num{font-family:'Kaisei HarunoUmi',serif;font-size:2rem;color:var(--accent);line-height:1;}
.result-denom{font-size:0.7rem;color:var(--muted);}
.result-msg{font-size:1rem;font-weight:700;line-height:1.6;}
.result-sub{font-size:0.8rem;color:var(--muted);margin-top:6px;line-height:1.6;}
.updated-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
.updated-title{font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;}
.updated-list{display:flex;flex-direction:column;gap:6px;}
.updated-item{display:flex;align-items:center;gap:10px;font-size:0.85rem;}
.updated-arrow{color:var(--muted);font-size:0.7rem;}
.updated-new{color:var(--green);font-weight:700;}
.review-section{background:var(--card);border:1px solid rgba(240,90,90,0.2);border-radius:16px;padding:16px;margin-bottom:20px;}
.review-title{font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;}
.review-item{border-bottom:1px solid var(--border);padding:8px 0;font-size:0.82rem;line-height:1.7;}
.review-item:last-child{border-bottom:none;}
.review-answer{font-weight:700;color:var(--gold);}
.result-btns{display:flex;flex-direction:column;gap:8px;}
.retry-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.home-btn-r{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;cursor:pointer;}
</style>
</head>
<body>
<div class="app">

<div id="home-screen">
  <div class="header">
    <div><div class="header-title">漢字 第7回</div><div class="header-sub">予習シリーズ ｜ 比・肥・非・費・備・評・貧・布・婦・武</div></div>
    <button class="reset-btn" onclick="confirmReset()">リセット</button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-renshu" onclick="switchTab('renshu')">練習問題<br><small>選択式</small></button>
    <button class="tab-btn" id="tab-kakunin" onclick="switchTab('kakunin')">確認問題<br><small>入力式</small></button>
  </div>
  <div class="summary-card">
    <div class="summary-label">OVERALL MASTERY</div>
    <div class="mastery-bar-wrap"><div class="mastery-bar-fill" id="home-bar" style="width:0%"></div></div>
    <div class="mastery-stats">
      <div class="stat-item"><div class="stat-num" id="stat-mastered">0</div><div class="stat-label">習得済み</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--muted)" id="stat-learning">0</div><div class="stat-label">練習中</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--muted)" id="stat-new">0</div><div class="stat-label">未挑戦</div></div>
      <div class="stat-item"><div class="stat-num" style="color:var(--text)" id="stat-total">0</div><div class="stat-label">合計</div></div>
    </div>
  </div>
  <div class="section-label">問題リスト（3回正解で習得）</div>
  <div class="question-list" id="question-list"></div>
  <div class="home-btns">
    <button class="study-btn" onclick="startStudy()">📖 まず漢字を学習する（10字カード）</button>
    <div class="start-row">
      <button class="start-btn" onclick="startQuiz('all')">📝 全問チャレンジ</button>
      <button class="weak-btn" id="weak-btn" onclick="startQuiz('weak')">⚡ 未習得のみ</button>
    </div>
  </div>
</div>

<div id="study-screen">
  <div class="study-nav">
    <button class="back-icon" onclick="goHome()">←</button>
    <div class="study-progress-bar"><div class="study-progress-fill" id="sp-fill" style="width:0%"></div></div>
    <div class="study-progress-text" id="sp-text">1 / 10</div>
  </div>
  <div id="kanji-card-area"></div>
  <div id="card-nav"></div>
</div>

<div id="quiz-screen">
  <div class="quiz-header">
    <button class="back-icon" onclick="goHome()">←</button>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="qp-fill" style="width:0%"></div></div>
    <div class="quiz-progress-text" id="qp-text">1/20</div>
  </div>
  <div class="mode-tag" id="mode-tag">練習問題</div>
  <div class="quiz-card-q">
    <div class="quiz-q" id="quiz-q"></div>
    <button class="hint-btn" id="hint-btn" onclick="showHint()">💡 読みのヒントを見る</button>
    <div class="quiz-hint" id="quiz-hint"></div>
  </div>
  <div id="choice-area" class="choices"></div>
  <div id="input-area" class="input-area" style="display:none">
    <input class="kanji-input" id="kanji-input" type="text" placeholder="漢字を入力" maxlength="6" autocomplete="off">
    <button class="submit-btn" onclick="checkInput()">決定する</button>
  </div>
  <div class="feedback" id="feedback"><div class="fb-title" id="fb-title"></div><div id="fb-body"></div></div>
  <button class="next-btn" id="next-btn" onclick="nextQ()">次の問題 →</button>
</div>

<div id="result-screen">
  <div class="result-wrap">
    <div class="quiz-header" style="padding-top:16px">
      <button class="back-icon" onclick="goHome()">←</button>
      <span style="font-size:0.85rem;color:var(--muted)">結果</span>
    </div>
    <div class="result-top">
      <div class="result-circle"><div class="result-num" id="r-score">0</div><div class="result-denom" id="r-total">/0問</div></div>
      <div><div class="result-msg" id="r-msg"></div><div class="result-sub" id="r-sub"></div></div>
    </div>
    <div class="updated-section" id="updated-section"></div>
    <div class="review-section" id="review-section" style="display:none"></div>
    <div class="result-btns">
      <button class="retry-btn" id="retry-btn">もう一度</button>
      <button class="home-btn-r" onclick="goHome()">ホームに戻る</button>
    </div>
  </div>
</div>

</div>
<script>
const KANJI_DATA=[
  {kanji:'比',on:'ヒ',kun:'くらべる',
   meanings:[{num:1,text:'くらべる。ならびひ。二つのものをならべてくらべること。'},{num:2,text:'比例…二つの数の間の割合。また一定の割合を保つこと。'},{num:3,text:'無比…くらべるものがないこと。'}],
   examples:[{word:'比例',reading:'ひれい',meaning:'一定の割合を保つこと'},{word:'対比',reading:'たいひ',meaning:'二つをくらべること'},{word:'比較',reading:'ひかく',meaning:'くらべること'},{word:'比率',reading:'ひりつ',meaning:'ある数と他の数の割合'}]},
  {kanji:'肥',on:'ヒ',kun:'こえる・こえ・こやす・こやし',
   meanings:[{num:1,text:'太ること。体が栄養を得て太ること。'},{num:2,text:'肥料…田畑の生産力を高めるために土地に施す物質。'},{num:3,text:'肥満…太って体が大きくなること。'}],
   examples:[{word:'肥料',reading:'ひりょう',meaning:'土地に施す栄養分'},{word:'肥満',reading:'ひまん',meaning:'太って体が大きくなること'},{word:'肥大',reading:'ひだい',meaning:'体が大きくなること'},{word:'肥沃',reading:'ひよく',meaning:'土地が豊かなこと'}]},
  {kanji:'非',on:'ヒ',kun:'あらず',
   meanings:[{num:1,text:'ふつうとはちがうこと。正しくないこと。よくないこと。'},{num:2,text:'非行…正しくない行い。よくない行い。'},{num:3,text:'非公開…多くの人に公開しないこと。'}],
   examples:[{word:'非行',reading:'ひこう',meaning:'正しくない行い'},{word:'非常',reading:'ひじょう',meaning:'ふつうとはちがうこと'},{word:'非公開',reading:'ひこうかい',meaning:'公開しないこと'},{word:'非礼',reading:'ひれい',meaning:'礼儀にかなわないこと'}]},
  {kanji:'費',on:'ヒ',kun:'ついやす・ついえる',

  {id:'k40',kanji:'費',reading:'ヒ',q:'「長い年月をツイヤして書いた作品」\nカタカナを漢字に直しなさい。',answer:'費やして',hint:'ついやして＝費やして',explain:'「費やす」はお金や時間などを使ってへらすこと。'},
];

const SK_R='kanji7-renshu',SK_K='kanji7-kakunin',MASTERY=3;
function lD(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):{};}catch(e){return{};}}
function sD(k,d){try{localStorage.setItem(k,JSON.stringify(d));}catch(e){}}
function getM(k,id){const d=lD(k);return d[id]||{correct:0,attempt:0};}
function recR(k,id,ok){const d=lD(k);if(!d[id])d[id]={correct:0,attempt:0};d[id].attempt++;if(ok)d[id].correct++;sD(k,d);}
function getLv(k,id){const m=getM(k,id);if(m.correct>=MASTERY)return'mastered';if(m.attempt>0)return'learning';return'new';}

let currentTab='renshu',quizQueue=[],quizIndex=0,quizScore=0,quizAnswered=false,quizMode='all',sessionResults=[],studyIndex=0;
function getCK(){return currentTab==='renshu'?SK_R:SK_K;}
function getCQ(){return currentTab==='renshu'?RENSHU:KAKUNIN;}

function switchTab(tab){
  currentTab=tab;
  document.getElementById('tab-renshu').className='tab-btn'+(tab==='renshu'?' active':'');
  document.getElementById('tab-kakunin').className='tab-btn'+(tab==='kakunin'?' active':'');
  buildHome();
}

function buildHome(){
  const key=getCK(),qs=getCQ();
  let mastered=0,learning=0,newQ=0;
  qs.forEach(q=>{const lv=getLv(key,q.id);if(lv==='mastered')mastered++;else if(lv==='learning')learning++;else newQ++;});
  const total=qs.length;
  document.getElementById('stat-mastered').textContent=mastered;
  document.getElementById('stat-learning').textContent=learning;
  document.getElementById('stat-new').textContent=newQ;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('home-bar').style.width=`${Math.round(mastered/total*100)}%`;
  const unmastered=qs.filter(q=>getLv(key,q.id)!=='mastered');
  const wb=document.getElementById('weak-btn');
  wb.disabled=unmastered.length===0;
  wb.textContent=`⚡ 未習得（${unmastered.length}）`;
  const list=document.getElementById('question-list');list.innerHTML='';
  qs.forEach(q=>{
    const lv=getLv(key,q.id),m=getM(key,q.id);
    const div=document.createElement('div');div.className='q-item';
    div.innerHTML=`<div class="q-status ${lv}">${lv==='mastered'?'✓':m.correct}</div><div class="q-info"><div class="q-kanji">${q.kanji}<span class="mastery-badge badge-${lv}">${lv==='mastered'?'習得済':lv==='learning'?'練習中':'未挑戦'}</span></div><div class="q-reading">${q.reading}</div></div><div class="q-count">${m.correct}/${MASTERY}</div>`;
    list.appendChild(div);
  });
}

function confirmReset(){if(confirm('習熟度をリセットしますか？')){localStorage.removeItem(SK_R);localStorage.removeItem(SK_K);buildHome();}}

function startStudy(){studyIndex=0;showScreen('study-screen');renderCard();}

function renderCard(){
  const k=KANJI_DATA[studyIndex],total=KANJI_DATA.length;
  document.getElementById('sp-fill').style.width=`${studyIndex/total*100}%`;
  document.getElementById('sp-text').textContent=`${studyIndex+1} / ${total}`;
  const meaningsHtml=k.meanings.map(m=>`<div class="meaning-item"><span class="meaning-num">●</span>${m.text}</div>`).join('');
  const examplesHtml=k.examples.map(e=>`<div class="example-item"><span class="example-word">${e.word}（${e.reading}）</span><span class="example-meaning">${e.meaning}</span></div>`).join('');
  document.getElementById('kanji-card-area').innerHTML=`
    <div class="kanji-card">
      <div class="kanji-big">${k.kanji}</div>
      <div class="kanji-readings">
        <div class="reading-badge"><span class="reading-label">音</span><span class="reading-val">${k.on}</span></div>
        <div class="reading-badge"><span class="reading-label">訓</span><span class="reading-val">${k.kun}</span></div>
      </div>
      <div class="kanji-meanings"><div class="meaning-title">意　味</div>${meaningsHtml}</div>
      <div class="kanji-examples"><div class="example-title">用　例</div><div class="example-list">${examplesHtml}</div></div>
    </div>`;
  const isLast=studyIndex===total-1;
  if(isLast){
    document.getElementById('card-nav').innerHTML=`
      <div class="study-complete">
        <div class="complete-icon">🎉</div>
        <div class="complete-msg">10字の学習完了！</div>
        <div class="complete-sub">次は問題にチャレンジしよう</div>
        <div class="goto-quiz-row">
          <button class="goto-btn goto-renshu" onclick="startFromStudy('renshu')">📝 練習問題へ</button>
          <button class="goto-btn goto-kakunin" onclick="startFromStudy('kakunin')">✏️ 確認問題へ</button>
        </div>
      </div>
      <div class="card-nav-row">
        <button class="prev-btn" onclick="prevCard()">← 前へ</button>
        <button class="next-card-btn" style="background:var(--card);border:1px solid var(--border);color:var(--muted);" disabled>最後のカードです</button>
      </div>`;
  }else{
    document.getElementById('card-nav').innerHTML=`
      <div class="card-nav-row">
        ${studyIndex>0?'<button class="prev-btn" onclick="prevCard()">← 前へ</button>':'<div></div>'}
        <button class="next-card-btn" onclick="nextCard()">次のカード →</button>
      </div>`;
  }
  window.scrollTo(0,0);
}

function nextCard(){if(studyIndex<KANJI_DATA.length-1){studyIndex++;renderCard();}}
function prevCard(){if(studyIndex>0){studyIndex--;renderCard();}}
function startFromStudy(tab){
  currentTab=tab;
  document.getElementById('tab-renshu').className='tab-btn'+(tab==='renshu'?' active':'');
  document.getElementById('tab-kakunin').className='tab-btn'+(tab==='kakunin'?' active':'');
  startQuiz('all');
}

function shuffle(arr){return[...arr].sort(()=>Math.random()-0.5);}
function startQuiz(mode){
  quizMode=mode;
  const key=getCK(),qs=getCQ();
  quizQueue=mode==='all'?shuffle(qs):shuffle(qs.filter(q=>getLv(key,q.id)!=='mastered'));
  quizIndex=0;quizScore=0;quizAnswered=false;sessionResults=[];
  showScreen('quiz-screen');renderQ();
}

function renderQ(){
  const q=quizQueue[quizIndex],total=quizQueue.length;
  document.getElementById('qp-fill').style.width=`${quizIndex/total*100}%`;
  document.getElementById('qp-text').textContent=`${quizIndex+1}/${total}`;
  document.getElementById('mode-tag').textContent=currentTab==='renshu'?'練習問題（選択式）':'確認問題（入力式）';
  document.getElementById('quiz-q').textContent=q.q;
  document.getElementById('quiz-hint').textContent=`ヒント：${q.hint}`;
  document.getElementById('quiz-hint').style.display='none';
  document.getElementById('hint-btn').style.display='inline-block';
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').className='next-btn';
  quizAnswered=false;
  if(currentTab==='renshu'){
    document.getElementById('choice-area').style.display='grid';
    document.getElementById('input-area').style.display='none';
    const area=document.getElementById('choice-area');area.innerHTML='';
    shuffle(q.choices).forEach(opt=>{
      const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=opt;
      btn.onclick=()=>selC(btn,opt,q);area.appendChild(btn);
    });
  }else{
    document.getElementById('choice-area').style.display='none';
    document.getElementById('input-area').style.display='block';
    const inp=document.getElementById('kanji-input');
    inp.value='';inp.className='kanji-input';inp.disabled=false;
    setTimeout(()=>inp.focus(),100);
  }
}

function selC(btn,opt,q){
  if(quizAnswered)return;quizAnswered=true;
  const key=getCK(),prev=getLv(key,q.id),ok=opt===q.answer;
  recR(key,q.id,ok);const newLv=getLv(key,q.id);
  sessionResults.push({q,wasCorrect:ok,prevLv:prev,newLv});
  if(ok){quizScore++;btn.classList.add('correct');}
  else{btn.classList.add('wrong');document.querySelectorAll('.choice-btn').forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct');});}
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  showFB(ok,q,newLv);
}

function checkInput(){
  if(quizAnswered)return;
  const inp=document.getElementById('kanji-input'),val=inp.value.trim();if(!val)return;
  const q=quizQueue[quizIndex];
  const norm=s=>s.replace(/[ぁ-んァ-ン]/g,'');
  const ok=val===q.answer||norm(val)===norm(q.answer);
  quizAnswered=true;inp.disabled=true;
  const key=getCK(),prev=getLv(key,q.id);
  recR(key,q.id,ok);const newLv=getLv(key,q.id);
  sessionResults.push({q,wasCorrect:ok,prevLv:prev,newLv});
  inp.className='kanji-input '+(ok?'correct':'wrong');
  if(ok)quizScore++;
  showFB(ok,q,newLv);
}

function showHint(){document.getElementById('quiz-hint').style.display='block';document.getElementById('hint-btn').style.display='none';}

function showFB(ok,q,newLv){
  const fb=document.getElementById('feedback');
  document.getElementById('fb-title').textContent=ok?'✓ 正解！'+(newLv==='mastered'?'　🎉 習得達成！':''):`✗ 不正解　正解：${q.answer}`;
  document.getElementById('fb-body').textContent=q.explain||'';
  fb.className='feedback show '+(ok?'ok':'ng');
  document.getElementById('next-btn').className='next-btn show';
}

function nextQ(){quizIndex++;if(quizIndex>=quizQueue.length)showResult();else{renderQ();window.scrollTo(0,0);}}

function showResult(){
  showScreen('result-screen');
  const total=quizQueue.length,pct=Math.round(quizScore/total*100);
  document.getElementById('r-score').textContent=quizScore;
  document.getElementById('r-total').textContent=`/${total}問`;
  const [msg,sub]=pct===100?['🎉 パーフェクト！','全問正解！すごい！']:pct>=80?['👏 よくできました！',`${total-quizScore}問ミス。復習しよう。`]:pct>=60?['🙆 まずまず！','間違いを確認してもう一度！']:['💪 もう一度！','間違えた問題を復習しよう。'];
  document.getElementById('r-msg').textContent=msg;document.getElementById('r-sub').textContent=sub;
  const upgraded=sessionResults.filter(r=>r.wasCorrect&&r.prevLv!==r.newLv);
  const us=document.getElementById('updated-section');
  if(upgraded.length>0){const ll={new:'未挑戦',learning:'練習中',mastered:'習得済み✓'};us.style.display='block';us.innerHTML=`<div class="updated-title">▲ 習熟度アップ！</div><div class="updated-list">`+upgraded.map(r=>`<div class="updated-item"><span>${r.q.answer}</span><span class="updated-arrow">→</span><span class="updated-new">${ll[r.newLv]}</span></div>`).join('')+'</div>';}else{us.style.display='none';}
  const wrong=sessionResults.filter(r=>!r.wasCorrect);
  const rs=document.getElementById('review-section');
  if(wrong.length>0){rs.style.display='block';rs.innerHTML=`<div class="review-title">▼ 間違えた問題</div>`+wrong.map(r=>`<div class="review-item"><span class="review-answer">正解：${r.q.answer}</span>（${r.q.hint}）<br>${r.q.q}</div>`).join('');}else{rs.style.display='none';}
  document.getElementById('retry-btn').onclick=()=>startQuiz(quizMode);
}

function showScreen(id){['home-screen','study-screen','quiz-screen','result-screen'].forEach(s=>{document.getElementById(s).style.display=s===id?'block':'none';});}
function goHome(){buildHome();showScreen('home-screen');}
document.getElementById('kanji-input').addEventListener('keydown',e=>{if(e.key==='Enter')checkInput();});
buildHome();showScreen('home-screen');
</script>
