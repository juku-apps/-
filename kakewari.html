<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1f2a44; --sub:#6b7691; --line:#dfe4ef;
  --main:#2f6fed; --main-d:#2457c2; --ok:#1f9d63; --ng:#d6455d; --warn:#e8a317; --lock:#aab2c5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:6px 0 2px}
.date{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.rule{background:#eef4ff;border-color:#c9dbff}
.rule b{color:var(--main-d)}
.lv{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.lv .no{width:42px;height:42px;border-radius:50%;background:var(--main);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.lv.locked .no{background:var(--lock)}
.lv.cleared .no{background:var(--ok)}
.lv .t{flex:1;min-width:0}
.lv .t div:first-child{font-weight:700}
.lv .t div:last-child{font-size:12px;color:var(--sub)}
button{font:inherit;cursor:pointer}
.btn{background:var(--main);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn:active{background:var(--main-d)}
.btn[disabled]{background:var(--lock);cursor:not-allowed}
.btn.sub{background:#fff;color:var(--main-d);border:1px solid var(--main)}
.btn.big{width:100%;padding:14px;font-size:17px;margin-top:8px}
.row{display:flex;gap:8px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ng)}
.prog{display:flex;gap:6px}
.dot{width:26px;height:8px;border-radius:4px;background:var(--line)}
.dot.done{background:var(--ok)}
.dot.now{background:var(--main)}
.prob{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 10px;text-align:center;font-size:30px;line-height:1.1;min-height:110px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.prob.small{font-size:24px}
.op{padding:0 4px;color:var(--sub)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.8em;line-height:1.15}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.fr>span:last-child{padding:0 4px}
.ans{margin:12px 0;border:2px solid var(--main);background:#fff;border-radius:12px;font-size:30px;font-weight:800;text-align:right;padding:10px 14px;min-height:62px;font-variant-numeric:tabular-nums}
.ans.shake{animation:sk .35s;border-color:var(--ng)}
@keyframes sk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 0;font-size:24px;font-weight:700;color:var(--ink)}
.pad button:active{background:#e9efff}
.pad .go{background:var(--main);color:#fff;border-color:var(--main)}
.pad .del{background:#fff3f5;color:var(--ng)}
.msg{min-height:24px;text-align:center;font-weight:700;margin:6px 0}
.msg.ng{color:var(--ng)} .msg.ok{color:var(--ok)}
.hint{background:#fffbe9;border:1px solid #f2e2a1;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.hint .fr{font-size:1em}
.res-title{font-size:24px;font-weight:800;margin:6px 0}
.res-title.ok{color:var(--ok)} .res-title.ng{color:var(--ng)}
.stat{display:flex;gap:8px}
.stat>div{flex:1;background:#f7f9ff;border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
.rv{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.rv:first-child{border-top:0}
.rv .q{font-size:18px;font-weight:700}
.rv .a{color:var(--ok);font-weight:700}
.rv .fr{font-size:.9em}
.small{font-size:12px;color:var(--sub)}
.star{color:var(--warn)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== GEN-START ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){const t=a%b;a=b;b=t}return a}
function R(n,d){if(d===undefined)d=1n;if(d<0n){n=-n;d=-d}const g=gcd(n,d)||1n;return{n:n/g,d:d/g}}
function tokR(s){
  if(s.indexOf('/')>=0){const p=s.split('/');return R(BigInt(p[0]),BigInt(p[1]))}
  if(s.indexOf('.')>=0){const p=s.split('.');return R(BigInt(p[0]+p[1]),10n**BigInt(p[1].length))}
  return R(BigInt(s))
}
function evalProb(tokens,ops){
  let v=tokR(tokens[0]);
  for(let i=0;i<ops.length;i++){
    const t=tokR(tokens[i+1]);
    v=ops[i]==='×'?R(v.n*t.n,v.d*t.d):R(v.n*t.d,v.d*t.n);
  }
  return v;
}
function isDec(s){return s.indexOf('.')>=0}
function isFrac(s){return s.indexOf('/')>=0}
const BIGI=['200','240','300','360','450','500','600','800','900','1200','1500','2400','3000','3200','4500','6000','7000','8100','12000','16000','25000','40000','90000','1000000','1200000','1800000','5000000'];
const L2A=['200','240','300','360','450','500','600','800','900','1200','1500','2400','3000','3200','4500','6000','7000','8100'];
const L2B=['1500','1800','2000','2500','3000','4000','4500','6000','12000','16000'];
const L2C=['4','5','6','8','250','600','800','2000','4000','5000','9000'];
const L2D=['1500','20000','40000','900000','1000000','1200000','1800000','2000000','5000000'];
const L1P=['12','15','18','24','25','30','36','40','45','48','50','60','72','75','80','100','120','150','200','240','300','400','500','600','900','1200','1500','2000'];
const L2P=L2A.concat(L2B,L2C,L2D);
function randOps(rng,m){
  for(;;){
    const o=[];for(let i=0;i<m;i++)o.push(rng()<0.5?'÷':'×');
    if(o.indexOf('÷')>=0&&o.indexOf('×')>=0)return o;
  }
}
function fracMid(tokens,ops){
  let v=tokR(tokens[0]);
  for(let i=0;i<ops.length;i++){
    const t=tokR(tokens[i+1]);
    v=ops[i]==='×'?R(v.n*t.n,v.d*t.d):R(v.n*t.d,v.d*t.n);
    if(i<ops.length-1&&v.d!==1n)return true;
  }
  return false;
}
const DECS=['0.2','0.25','0.3','0.4','0.5','0.6','0.8','1.2','1.5','2.4','3.6','0.12','0.15','0.045','0.04','0.006','0.02','0.05','0.75'];
const INTS3=['2','4','5','10','20','25','40','50','100','200','500'];
const FRS=['1/2','1/3','2/3','3/4','3/5','5/6','5/8','7/12','9/10','8/15','14/9','6/5','4/5','15/16','2/5','3/8','9/14','7/6','5/12','4/9'];
const DECS4=['0.2','0.25','0.4','0.5','0.75','1.2','1.5'];
const INTS4=['2','3','4','5','6','8','9','12','15','20'];
const DECS5=['0.04','0.05','0.25','0.5','0.8','1.2','0.12','0.6','1.5','0.002','0.008'];
const FALLBACK={
 1:[[['3600','1800','50'],'÷×'],[['4500','150','20'],'÷×'],[['2400','600','4','30'],'÷÷×'],[['7200','900','2','500'],'÷÷×'],[['800','1600','2000'],'÷×']],
 2:[[['900','4500','2000','1000000'],'÷÷×'],[['6000','2500','4','1500'],'÷÷×'],[['1200','3000','800','5000000'],'÷÷×'],[['7000','2100','50','900000'],'÷÷×'],[['450','1500','6','20000'],'÷÷×']],
 3:[[['0.6','0.4','50'],'÷×'],[['1.2','0.3','0.8','20'],'÷÷×'],[['0.25','0.5','0.1','40'],'÷÷×'],[['3.6','0.12','0.5'],'÷×'],[['0.045','0.15','200'],'÷×']],
 4:[[['3/4','9/10','6/5'],'÷×'],[['5/6','8/15','2/9'],'×÷'],[['7/12','14/9','3/8'],'÷÷'],[['1.5','3/4','2/5','0.2'],'÷×÷'],[['4/5','0.4','5/2'],'÷×']],
 5:[[['500','2500','9000','1800000'],'÷÷×'],[['3200','16000','4000','5000000'],'÷÷×'],[['8100','2700','600','1200000'],'÷÷×'],[['1500','6000','250','40000'],'÷÷×'],[['240','1200','0.04','15'],'÷÷×']]
};
function fallbackProb(l,i){
  const f=FALLBACK[l][i%5];
  return{tokens:f[0].slice(),ops:f[1].split('')};
}
function pick(rng,a){return a[Math.floor(rng()*a.length)]}
const CORES=[1,2,3,4,5,6,8,9,12,15,18,24,25,36,45];
function sig(s){let d=s.replace('.','').replace(/^0+/,'').replace(/0+$/,'');return d.length||1}
function roundTok(t){return isFrac(t)||sig(t)<=2}
function bigTok(rng){return String(pick(rng,CORES))+'0'.repeat(Math.floor(rng()*6))}
function genOne(l,rng){
  for(let k=0;k<30000;k++){
    let tokens,ops;
    if(l===1){
      tokens=[pick(rng,L1P),pick(rng,L1P),pick(rng,L1P)];
      ops=randOps(rng,2);
    }else if(l===2){
      tokens=[bigTok(rng),bigTok(rng),bigTok(rng),bigTok(rng)];
      ops=randOps(rng,3);
      if(ops[0]!=='÷')continue;
      if(tokens.join('').length>17)continue;
      if(!tokens.some(function(t){return t.length>=4}))continue;
      if(!fracMid(tokens,ops))continue;
    }else if(l===3){
      const n=3+Math.floor(rng()*2);tokens=[];let nd=0;
      for(let i=0;i<n;i++){if(rng()<0.65){tokens.push(pick(rng,DECS));nd++}else tokens.push(pick(rng,INTS3))}
      if(nd<2)continue;
      ops=randOps(rng,n-1);
    }else if(l===4){
      const n=3+Math.floor(rng()*2);tokens=[];let nf=0;
      for(let i=0;i<n;i++){const r=rng();if(r<0.6){tokens.push(pick(rng,FRS));nf++}else if(r<0.8)tokens.push(pick(rng,DECS4));else tokens.push(pick(rng,INTS4))}
      if(nf<2)continue;
      ops=randOps(rng,n-1);
    }else{
      tokens=[bigTok(rng),bigTok(rng),bigTok(rng),pick(rng,DECS5)];
      for(let i=3;i>0;i--){const j=Math.floor(rng()*(i+1));const t=tokens[i];tokens[i]=tokens[j];tokens[j]=t}
      ops=randOps(rng,3);
      if(ops[0]!=='÷')continue;
      if(isDec(tokens[0]))continue;
      if(tokens.join('').length>17)continue;
      if(!tokens.some(function(t){return t.length>=4&&!isDec(t)}))continue;
    }
    const v=evalProb(tokens,ops);
    if(v.d!==1n)continue;
    const a=Number(v.n);
    const lo=l===1?10:(l===2?10:(l===3?5:(l===4?2:10)));
    const hi=l===1?999:(l===2?9999:(l===3?2000:(l===4?100:9999)));
    if(a<lo||a>hi)continue;
    if(l!==4){
      if(!tokens.every(roundTok))continue;
      if(sig(String(a))>2)continue;
    }
    if(new Set(tokens).size<tokens.length)continue;
    if(tokens.some(function(t){return t==='1'}))continue;
    return{tokens:tokens,ops:ops,ans:a};
  }
  return null;
}
function genSet(l,seed){
  const rng=mulberry32(seed);const out=[];const seen={};
  let guard=0;
  while(out.length<3&&guard<200){
    guard++;
    const p=genOne(l,rng);if(!p)break;
    const key=p.tokens.join(',')+p.ops.join('');
    if(seen[key])continue;seen[key]=1;out.push(p);
  }
  let i=0;
  while(out.length<3){
    const f=fallbackProb(l,i++);
    f.ans=Number(evalProb(f.tokens,f.ops).n);
    out.push(f);
  }
  return out;
}
function hintParts(p){
  const num=[],den=[];
  for(let i=0;i<p.tokens.length;i++){
    const t=p.tokens[i];const op=i===0?'×':p.ops[i-1];
    if(isFrac(t)){
      const s=t.split('/');
      if(op==='×'){num.push(s[0]);den.push(s[1])}else{num.push(s[1]);den.push(s[0])}
    }else{
      if(op==='×')num.push(t);else den.push(t);
    }
  }
  return{num:num.length?num:['1'],den:den.length?den:['1']};
}

function fmt(sec){sec=Math.max(0,Math.ceil(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}

function streak(d){
  var n=0,dt=new Date();
  var today=d.days[dkey(dt)];
  if(!(today&&today.levels&&Object.keys(today.levels).length))dt.setDate(dt.getDate()-1);
  for(;;){
    var x=d.days[dkey(dt)];
    if(x&&x.levels&&Object.keys(x.levels).length){n++;dt.setDate(dt.getDate()-1)}else break;
  }
  return n;
}

function startLevel(l,practice){
  stop();
  S.level=l;S.practice=!!practice;
  var seed=practice?Math.floor(Math.random()*1e9):dseed()*10+l;
  S.set=genSet(l,seed);S.idx=0;S.input='';S.miss=0;S.hints=0;S.qMiss=0;S.hintOpen=false;S.missedQ={};

}
function stop(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function tick(){
  var r=LIMIT-(Date.now()-S.start)/1000;
  S.remain=r;

}

  quitArm=Date.now();

function key(k){
  if(S.screen!=='play')return;
  if(k==='del'){S.input=S.input.slice(0,-1)}
  else if(k==='go'){submit();return}
  else if(S.input.length<8){S.input+=k}
  var a=document.getElementById('ans');if(a)a.textContent=S.input;

function submit(){
  if(!S.input)return;
  var p=S.set[S.idx];
  if(Number(S.input)===p.ans){
    S.idx++;S.input='';S.hintOpen=false;S.qMiss=0;
    if(S.idx>=3){finish(true);return}
    render();
    var m=document.getElementById('msg');if(m){m.textContent='せいかい!';m.className='msg ok'}
  }else{
    S.miss++;S.qMiss++;S.missedQ[S.idx]=true;S.input='';
    if(S.qMiss>=2&&!S.hintOpen){S.hintOpen=true;S.hints++}
    render();
    var m=document.getElementById('msg');if(m){m.textContent='ざんねん。分数にならべて、約分してみよう。';m.className='msg ng'}

function finish(ok){
  stop();

  S.screen='result';
  if(ok&&!S.practice){
    var d=load();var k=dkey();
    if(!d.days[k])d.days[k]={levels:{}};
    var old=d.days[k].levels[S.level];
    var rec={time:Math.round(used),miss:S.miss,hints:S.hints};
    if(!old||rec.miss<old.miss||(rec.miss===old.miss&&rec.time<old.time))d.days[k].levels[S.level]=rec;
    var keys=Object.keys(d.days).sort();
