<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>読解トレーニング｜予習シリーズ</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--surface:#ffffff;--card:#f5f2ea;--border:rgba(0,0,0,0.08);--accent:#2c5f8a;--accent2:#c0392b;--green:#1e7e4a;--red:#c0392b;--text:#1a1a2e;--muted:rgba(26,26,46,0.45);--gold:#8b6914;--radius:14px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.app{max-width:640px;margin:0 auto;padding:0 16px 60px;}
.header{padding:24px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px;}
.header-title{font-family:'Shippori Mincho',serif;font-size:1.4rem;color:var(--accent);letter-spacing:0.08em;}
.header-sub{font-size:0.7rem;color:var(--muted);margin-top:4px;}
.home-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.home-card h2{font-family:'Shippori Mincho',serif;font-size:1.1rem;color:var(--accent);margin-bottom:12px;}
.set-structure{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.set-row{display:flex;align-items:center;gap:10px;font-size:0.85rem;padding:10px 14px;background:var(--card);border-radius:10px;}
.set-tag{display:inline-block;font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0;}
.tag-s{background:rgba(44,95,138,0.12);color:var(--accent);}
.tag-m{background:rgba(192,57,43,0.1);color:var(--accent2);}
.tag-z{background:rgba(139,105,20,0.12);color:var(--gold);}
.stats-row{display:flex;gap:16px;margin-bottom:20px;}
.stat-box{flex:1;text-align:center;background:var(--card);border-radius:10px;padding:12px 8px;}
.stat-n{font-family:'Shippori Mincho',serif;font-size:1.8rem;color:var(--accent);line-height:1;}
.stat-l{font-size:0.65rem;color:var(--muted);margin-top:4px;}
.set-counter{font-size:0.72rem;color:var(--muted);text-align:center;margin-bottom:16px;}
.start-btn{width:100%;background:var(--accent);border:none;border-radius:var(--radius);padding:18px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(44,95,138,0.3);}
#quiz-screen{display:none;}
.quiz-nav{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.nav-back{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;}
.qpbar{flex:1;height:4px;background:rgba(0,0,0,0.08);border-radius:2px;overflow:hidden;}
.qpfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width 0.4s;}
.qptext{font-size:0.75rem;color:var(--muted);}
.passage-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.ptag{display:inline-block;font-size:0.62rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:14px;}
.ptitle{font-family:'Shippori Mincho',serif;font-size:1rem;font-weight:700;margin-bottom:12px;}
.ptext{font-family:'Shippori Mincho',serif;font-size:0.92rem;line-height:2.1;}
.blank{display:inline-block;background:var(--accent);color:white;padding:0 6px;border-radius:4px;font-weight:700;min-width:28px;text-align:center;}
.qlabel{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;}
.qnum{width:26px;height:26px;background:var(--accent);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;margin-top:2px;}
.qnum.r{background:var(--accent2)}.qnum.g{background:var(--gold);}
.qtext{font-size:0.9rem;font-weight:700;line-height:1.6;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.88rem;cursor:pointer;text-align:left;line-height:1.6;transition:all 0.15s;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(44,95,138,0.04);}
.choice-btn.correct{background:rgba(30,126,74,0.08);border-color:var(--green);color:var(--green);}
.choice-btn.wrong{background:rgba(192,57,43,0.06);border-color:var(--red);color:var(--red);}
.choice-btn:disabled{cursor:default;}
.feedback{border-radius:12px;padding:14px 16px;margin-top:12px;font-size:0.85rem;line-height:1.75;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:rgba(30,126,74,0.08);border:1px solid rgba(30,126,74,0.25);}
.feedback.ng{background:rgba(192,57,43,0.06);border:1px solid rgba(192,57,43,0.2);}
.fbtitle{font-weight:700;font-size:0.9rem;margin-bottom:6px;}
.feedback.ok .fbtitle{color:var(--green);}
.feedback.ng .fbtitle{color:var(--red);}
.next-btn{width:100%;background:var(--accent);border:none;border-radius:var(--radius);padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;margin-top:16px;display:none;}
.next-btn.show{display:block;}
#result-screen{display:none;}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:20px 0 16px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.rcircle{width:100px;height:100px;border-radius:50%;border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;background:rgba(44,95,138,0.05);}
.rnum{font-family:'Shippori Mincho',serif;font-size:2.2rem;color:var(--accent);line-height:1;}
.rdenom{font-size:0.7rem;color:var(--muted);}
.rmsg{font-size:1.1rem;font-weight:700;margin-bottom:8px;}
.rsub{font-size:0.82rem;color:var(--muted);line-height:1.7;}
.review-card{background:var(--surface);border:1px solid rgba(192,57,43,0.2);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.rtitle{font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:12px;}
.ritem{border-bottom:1px solid var(--border);padding:10px 0;font-size:0.82rem;line-height:1.75;}
.ritem:last-child{border-bottom:none;}
.rq{color:var(--muted);margin-bottom:4px;font-size:0.78rem;}
.ra{color:var(--green);font-weight:700;}
.result-btns{display:flex;flex-direction:column;gap:8px;}
.retry-btn{width:100%;background:var(--accent);border:none;border-radius:var(--radius);padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.home-btn{width:100%;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
<div id="home-screen">
  <div class="header">
    <div class="header-title">読解トレーニング</div>
    <div class="header-sub">予習シリーズ ｜ 中学受験対応 ｜ 全10セット</div>
  </div>
  <div class="home-card">
    <h2>1セットの構成</h2>
    <div class="set-structure">
      <div class="set-row"><span class="set-tag tag-s">説明文</span>要約問題 ＋ 接続詞問題</div>
      <div class="set-row"><span class="set-tag tag-m">物語文</span>要約問題 ＋ 接続詞問題</div>
      <div class="set-row"><span class="set-tag tag-z">随筆文</span>要約問題 ＋ 接続詞問題</div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-n" id="stat-sets">0</div><div class="stat-l">累計セット数</div></div>
      <div class="stat-box"><div class="stat-n" id="stat-correct">0</div><div class="stat-l">累計正解数</div></div>
      <div class="stat-box"><div class="stat-n" id="stat-pct">—</div><div class="stat-l">正答率</div></div>
    </div>
    <div class="set-counter" id="set-counter"></div>
    <button class="start-btn" onclick="startSession()">📖 次のセットを始める</button>
  </div>
</div>

<div id="quiz-screen">
  <div class="quiz-nav">
    <button class="nav-back" onclick="confirmBack()">←</button>
    <div class="qpbar"><div class="qpfill" id="qpfill" style="width:0%"></div></div>
    <div class="qptext" id="qptext">1/6</div>
  </div>
  <div id="quiz-content"></div>
</div>

<div id="result-screen">
  <div class="header"><div class="header-title">読解トレーニング</div></div>
  <div class="result-card">
    <div class="rcircle"><div class="rnum" id="rscore">0</div><div class="rdenom">/6問</div></div>
    <div class="rmsg" id="rmsg"></div>
    <div class="rsub" id="rsub"></div>
  </div>
  <div class="review-card" id="review-card" style="display:none">
    <div class="rtitle">▼ 間違えた問題</div>
    <div id="review-list"></div>
  </div>
  <div class="result-btns">
    <button class="retry-btn" onclick="startSession()">📖 次のセットへ</button>
    <button class="home-btn" onclick="goHome()">ホームに戻る</button>
  </div>
</div>
</div>

<script>
const S=[
{p:[
{t:"説明文",ti:"言語と思考の深い関係",
tx:"言語は単なるコミュニケーションの道具ではない。私たちは言葉を通じて世界を認識し、思考そのものを形成している。これを「言語的相対性」と呼ぶ考え方がある。たとえば、日本語には「木漏れ日」という美しい表現がある。葉の間から差し込む光の様子を一語で言い表すこの言葉は、その概念を持たない言語の話者には容易に言語化できない体験を指している。同様に、ある北極圏の民族の言語には雪を表す言葉が数十種類存在するという。それぞれの雪の状態を細かく区別する必要のある生活環境が、豊かな語彙を生み出したのだ。___、言語の違いは世界の見え方の違いを生み出すと言えるかもしれない。多様な言語を学ぶことは、多様な視点を獲得することにつながるという示唆を、これらの事例は私たちに与えてくれる。",
q:[
{t:"要約",q:"この文章の内容として最も適切なものを次の中から選びなさい。",c:["言語はコミュニケーションの道具に過ぎず、思考や認識とは無関係である","言語は思考や世界認識と深く結びついており、言語の多様性は視点の多様性につながる","日本語と北極圏の言語は、世界で最も豊かな表現を持つ二つの言語だ","多くの言語を習得すれば、それだけ高い知能が得られることが科学的に証明されている"],a:1,e:"本文は「言語が思考を形成する」「言語の違いは世界の見え方の違いを生む」という言語的相対性の考えを、具体例を挙げて説明しています。「日本語と北極圏の言語が最も豊か」「知能が高まる」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","つまり","また","ところが"],a:1,e:"前の具体例（木漏れ日・雪の語彙）をまとめて「言語の違いは世界の見え方の違いを生む」と結論づけているので、まとめ・結論を示す「つまり」が適切です。"}
]},
{t:"物語文",ti:"桜の約束",
tx:"「また来年も咲くかな」と真帆はつぶやいた。校庭の隅に植えられた一本の桜の木は、今年もみごとに花をつけていた。去年の春、転校することになった親友の彩とここで最後の時間を過ごした。「来年もここで一緒に見よう」と小指を絡めて約束したのだ。あれから一年が過ぎた。___、彩からは一通のメッセージも届いていない。引っ越し先の住所も、新しい電話番号も、何も知らされないまま春が来てしまった。真帆はスマートフォンを取り出し、彩との古いトーク画面を長い間眺めてから、そっとポケットにしまった。来年、この桜が咲くとき、自分はここにいるだろうか。そして彩は、今どこで何を見ているのだろうか。",
q:[
{t:"要約",q:"この場面における真帆の気持ちとして最も適切なものを次の中から選びなさい。",c:["桜の美しさと季節の変わり目に純粋に感動し、来年も楽しみにしている","連絡のとれない親友との約束が果たされないかもしれないという深い寂しさと、先の見えない不安を感じている","自分から連絡しないまま一年を過ごした自分自身に怒りを感じている","来年も同じ学校の同じ場所で彩と会えると確信し、再会を心待ちにしている"],a:1,e:"「一通のメッセージも届いていない」「住所も番号も知らされない」「来年ここにいるか」「彩は今どこに」という描写から、約束が果たされないかもしれないという深い寂しさと不安が読み取れます。「怒り」「確信」の描写はありません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["そして","だから","しかし","なぜなら"],a:2,e:"「約束をした」という前の内容と「メッセージが届いていない」という後の内容は、期待と現実の落差を示す逆接の関係です。「しかし」が適切です。"}
]},
{t:"随筆文",ti:"祖父の手が語るもの",
tx:"祖父の手は節くれだっていて、まるで長い年月を経た古い木の根のようだった。子どものころ、その大きくごつごつした手に引かれて神社の参道を歩いた感触を、私はいまだに覚えている。祖父は口数の少ない人だった。自分の若いころのことも、戦争中のことも、ほとんど語らなかった。何度か聞こうとしたが、いつも「昔のことはいい」と短く答えるだけだった。___、手だけは正直だった。その手を見れば、どれほど多くのことを経験し、乗り越えてきたかが、言葉以上に伝わってくる気がした。人は言葉だけで語るのではない、と私は祖父の手を思い出すたびに感じる。そして、もっと早くその手のことを聞いておけばよかったと、今も後悔している。",
q:[
{t:"要約",q:"この文章で筆者が最も伝えたいことは何ですか。最も適切なものを次の中から選びなさい。",c:["祖父は無口な人だったため、一緒にいても楽しくなかった","言葉を使わなくても人の経験や思いは伝わることがあり、もっと早く向き合えばよかったという後悔も感じている","祖父の手は木の根のように美しく、その造形に深く感動した","子どものころの記憶は鮮明なものであり、大人になっても大切にすべきだ"],a:1,e:"「人は言葉だけで語るのではない」という主題に加え、「もっと早く聞いておけばよかった」という後悔も末尾に示されています。祖父を「楽しくなかった」とは書いていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","だから","また","つまり"],a:0,e:"「口数が少なく、過去を語らなかった」という内容と「手だけは正直だった（手から伝わった）」という内容は対比・逆接の関係です。「しかし」が適切です。"}
]}
]},
{p:[
{t:"説明文",ti:"海洋プラスチック汚染の現在",
tx:"近年、海洋プラスチック汚染が国際的に深刻な問題として認識されるようになっている。現在、毎年約800万トンものプラスチックが海に流れ込んでいると推計されており、海洋生物の生態系に計り知れないダメージを与えている。クジラやウミガメが大量のプラスチックを誤飲して死亡する事例が後を絶たない。特に深刻なのが、マイクロプラスチックと呼ばれる直径5ミリメートル以下の微細な粒子だ。これは紫外線や波によって大きなプラスチックが砕けたもので、魚や貝類の体内に蓄積される。___、それを食べる私たち人間の体内にも取り込まれている可能性が指摘されており、健康への影響も無視できない段階に来ている。この問題を解決するためには、個人レベルでのプラスチック使用量の削減とともに、企業や政府による規制や代替素材の開発が急務となっている。",
q:[
{t:"要約",q:"この文章の内容として最も適切なものを次の中から選びなさい。",c:["プラスチック製品はすべて今すぐ使用を禁止しなければならない","海洋プラスチック汚染は生態系と人間の健康にまで影響し、個人・企業・政府の多層的な対策が必要だ","マイクロプラスチックは海底にしか存在せず、人間への影響はほとんどない","プラスチック汚染は主に発展途上国が引き起こしている問題であり、先進国には責任がない"],a:1,e:"汚染の規模・生態系への影響・マイクロプラスチックの問題・人間への影響・解決策が述べられています。「即座に禁止」「海底にしか存在しない」「先進国には責任がない」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","ところが","さらに","なぜなら"],a:2,e:"「魚や貝類の体内に蓄積される」という内容に加えて、「人間の体内にも取り込まれている」という問題をさらに広げているので、「さらに」が適切です。"}
]},
{t:"物語文",ti:"引退前夜",
tx:"引退試合の前日の夕方、キャプテンの健は一人グラウンドに残った。部員が帰ったあとのグラウンドは静かで、自分の素振りの音だけが夕暮れの空に響いた。三年間、雨の日も台風の翌日も、ここで打ち続けた。骨折した右腕が完治するまでの二ヶ月間も、左腕だけで素振りを続けた。明日で終わる。___、不思議と悲しくはなかった。むしろ胸の奥に、言葉にならない静かな満足感が満ちていく。バットを握る手のひらのたこを見ながら、健は初めてユニフォームを着た中学一年の春の日のことを思い出した。緊張で手が震えていたあの日の自分が、今は遠くて懐かしい。",
q:[
{t:"要約",q:"この場面における健の気持ちとして最も適切なものを次の中から選びなさい。",c:["引退することへの強い悲しみと、もっと続けたかったという後悔に押しつぶされそうになっている","三年間の努力をやり遂げた深い充実感と、最初の日への懐かしさを静かに感じている","明日の試合の結果がどうなるか不安で、落ち着かない気持ちでいっぱいだ","骨折の経験があるため、本当は引退試合に出たくないと内心思っている"],a:1,e:"「言葉にならない静かな満足感」「初めてユニフォームを着た日を懐かしむ」という描写から、充実感と懐かしさが読み取れます。「悲しくはなかった」と明記されており、「後悔」や「不安」「出たくない」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["だから","しかし","また","つまり"],a:1,e:"「明日で終わる」という事実から、普通は悲しいと予想されます。しかし「不思議と悲しくはなかった」と、予想に反する内容が続くので、逆接の「しかし」が適切です。"}
]},
{t:"随筆文",ti:"眠れない夜の台所",
tx:"眠れない夜、私はよく台所に立つ。喉が渇いたわけでも、お腹が空いたわけでもない。冷蔵庫を開けるわけでもなく、ただそこに立ってぼんやりしているだけだ。台所は昼間とはまったく違う顔をしている。昼間は騒々しく、誰かの笑い声や鍋の音が絶えないこの場所が、深夜には別の空間になる。静寂の中で、水道の蛇口からかすかに水が滴る音だけが聞こえる。外の街灯の光が窓ガラスに反射して、床に細い影を落としている。___、不思議と心が落ち着いてくる。昼間にどれだけ悩んでいたことも、この静けさの中では少しだけ遠くなる気がする。日常の場所が、夜だけは別の何かになる。そういう深夜の台所の時間を、私は密かに大切にしている。",
q:[
{t:"要約",q:"この文章で筆者が伝えたいことは何ですか。最も適切なものを次の中から選びなさい。",c:["台所は昼間よりも夜の方が使いやすく、夜中の料理は格別においしい","眠れない夜に日常の場所が別の雰囲気をもち、そこに心の安らぎを見出している","眠れないときはすぐに医者に相談し、睡眠薬を処方してもらうべきだ","深夜に一人でいることの孤独と、それに対する強い不安を感じている"],a:1,e:"「台所が夜は別の顔をする」「心が落ち着く」「悩みが遠くなる」「その時間を大切にしている」が主題です。「料理がおいしい」「医者に相談すべき」「孤独で不安」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","だから","すると","ところが"],a:2,e:"「静寂の中で水の音だけが聞こえ、街灯の光が影を落としている」という静かな情景描写の後に、「心が落ち着いてくる」という結果が続くので、動作・状況の結果を示す「すると」が適切です。"}
]}
]},
{p:[
{t:"説明文",ti:"読書がもたらす多様な効果",
tx:"読書は語彙力や読解力を高めるだけでなく、共感能力の向上にも深く関わっているとされている。物語の中の登場人物の視点に立ち、その感情や思考をたどることで、自分とは異なる立場や境遇にある人の気持ちを理解する練習ができるからだ。実際に、読書量と他者への共感能力には正の相関関係があるという研究結果が複数存在する。___、読書には集中力や想像力を鍛える効果もあるとされており、たった六分間の読書でストレスが約68パーセント軽減されたという研究報告まである。現代においてスマートフォンやゲームによるスクリーンタイムが急増する中、活字を読み、文章の流れを追うという行為は、脳に対して独特の刺激を与える。読書の習慣を大切にすることは、学力向上だけでなく、心の健康を守ることにもつながると言えるだろう。",
q:[
{t:"要約",q:"この文章の内容として最も適切なものを次の中から選びなさい。",c:["読書は語彙力だけを高める効果があり、他の効果は科学的に証明されていない","読書には語彙・共感能力・集中力・ストレス軽減など多様な効果があり、現代においてとくに重要だ","スマートフォンやゲームは読書と同等の学習効果があるため、どちらでもよい","読書量が多い子どもは必ず学力が高くなることが証明されている"],a:1,e:"本文は読書の多様な効果（語彙・共感・集中・ストレス軽減）を研究結果とともに述べ、現代における重要性を説いています。「語彙だけ」「必ず学力が高くなる」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","または","また","ところが"],a:2,e:"「共感能力の向上」という効果を述べた後に、「集中力・ストレス軽減」という別の効果を付け加えているので、追加を示す「また」が適切です。"}
]},
{t:"物語文",ti:"おばあちゃんのレシピノート",
tx:"祖母が残したノートには、びっしりと料理のレシピが書き込まれていた。文字は小さく、時々読めないほど癖のあるものもある。余白には「塩は少なめに」「火加減が肝心」といったメモが鉛筆で書き足されている。母は涙をこらえながらゆっくりとページをめくっている。「この肉じゃが、お正月によく作ってもらったね」と母がつぶやいた。___、そのレシピの右端には小さな文字で「孫たちが好きな味に」とメモが添えられていた。私はその文字を見て、胸が詰まった。祖母はいつも、食卓に並ぶ料理を通じて、誰かのことを思い続けていたのだ。料理はただの食事ではなく、愛情そのものだったのだと、今になって気がついた。",
q:[
{t:"要約",q:"この場面から読み取れることとして最も適切なものを次の中から選びなさい。",c:["祖母のレシピノートは文字が読みにくく、実際にはあまり役に立たなかった","祖母は料理を通じて常に家族のことを思っており、そのことが「私」にも伝わり深く感動している","母は祖母のレシピを見て、料理の腕前が未熟だったと批判している","「私」は料理に関心がなく、ノートを見ても何も感じなかった"],a:1,e:"「孫たちが好きな味に」というメモから、祖母が常に家族のことを思って料理していたことが伝わり、「私」は胸が詰まり「愛情そのもの」と気づいています。「役立たない」「批判」「何も感じなかった」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","すると","そして","なぜなら"],a:2,e:"「母が煮物のことをつぶやく」という行動の後に、「レシピのメモが見つかった」という新たな発見が続く流れなので、「そして」が自然です。"}
]},
{t:"随筆文",ti:"雨の日が好きな理由",
tx:"雨が降ると、世界全体のテンポが少し遅くなる気がする。傘を差してゆっくり歩く人々、軒下で雨宿りをしながらじっと空を眺める猫、水たまりに映る商店街の灯り。こういったものは、晴れた日には決して見えない風景だ。急ぎ足で通り過ぎていた道が、雨の日には全然違って見える。___、私は雨が嫌いではない。むしろ、日常の裏側をそっと見せてくれる雨の日が、どこか好きだとさえ思っている。傘が邪魔で荷物が重くて、靴が濡れるのは確かに面倒だ。それでも、雨の日には晴れの日には持てない、静かな時間の感覚がある。雨音はノイズではなく、世界がふと立ち止まる合図なのかもしれない。",
q:[
{t:"要約",q:"この文章で筆者が最も伝えたいことは何ですか。最も適切なものを次の中から選びなさい。",c:["雨の日は傘や濡れた靴が面倒なので、できれば外出を避けるべきだ","雨の日には晴れの日とは違う世界の姿が見え、不便さを認めつつもそこに独特の価値を感じている","雨の日の猫の様子を観察することが特に面白い趣味だ","雨音は騒音であり、集中力を妨げるという問題がある"],a:1,e:"「日常の裏側を見せてくれる」「世界がふと立ち止まる合図」が主題です。「面倒」と認めつつも「好きだとさえ思う」という構造が重要です。「猫の観察が趣味」「騒音」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","だから","つまり","それでも"],a:1,e:"「晴れの日には見えない風景がある」という内容を受けて「雨が嫌いではない」という気持ちが来るので、理由・根拠を受けた結論を示す「だから」が適切です。"}
]}
]},
{p:[
{t:"説明文",ti:"睡眠と記憶定着の科学",
tx:"睡眠は単なる休息ではない。学習した内容を記憶として脳に定着させる、非常に重要な生理的プロセスである。人間の脳は睡眠中に、その日に経験・学習した情報を整理・統合し、短期記憶から長期記憶へと変換する作業を行っている。特にノンレム睡眠と呼ばれる深い眠りの段階で、記憶の固定化が促進されることが明らかになっている。___、試験前夜に徹夜で勉強することは、かえって逆効果になることが多い。睡眠不足は集中力・判断力・記憶力をすべて低下させるからだ。十分な睡眠をとることで学習効率が高まるだけでなく、創造的な問題解決能力も促進されるという研究もある。規則正しい睡眠習慣を維持することは、単に健康のためだけでなく、学業成績の向上という観点からも非常に重要だと言えるだろう。",
q:[
{t:"要約",q:"この文章の内容として最も適切なものを次の中から選びなさい。",c:["睡眠は健康維持のためだけにあり、学習効率とは直接関係がない","睡眠中に記憶が整理・定着するため、十分な睡眠が学習効率や創造性を高め、学業にも重要だ","試験前には必ず8時間以上の睡眠をとることが科学的に証明されている唯一の正解だ","徹夜で勉強すると必ず成績が下がることが、すべての人に当てはまる"],a:1,e:"本文の主題は「睡眠が記憶定着に不可欠」「十分な睡眠が学習・創造性を高める」です。「必ず8時間」「すべての人に当てはまる」という断定は本文にありません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["また","しかし","そのため","ところが"],a:2,e:"「睡眠中に記憶が短期から長期に変換される」という前文の内容を受けて、「徹夜は逆効果」という結果が導かれるので、「そのため」（原因・理由を受けた結果）が適切です。"}
]},
{t:"物語文",ti:"百点の重さ",
tx:"テストが返ってきた。赤ペンで大きく書かれた「100」という数字が目に飛び込んできた。隣の席の優斗が「すごいじゃん」と言い、後ろの席の美咲も「さすが颯太」と声をかけてくれた。___、颯太の胸は少しも弾まなかった。問題を解いているとき、答えがわかって書いたのは三割ほどで、残りはなんとなく書いたら合っていただけだった。とくに大問三の記述問題は、自分でも何を書いたか覚えていない。本当に理解できていた問題は、半分にも満たなかったと颯太は思う。百点という数字よりも、自分がわかっていないことの広さを、颯太は初めて真剣に考えた。点数は結果に過ぎない。大切なのは、その中身だ。",
q:[
{t:"要約",q:"颯太の気持ちとして最も適切なものを次の中から選びなさい。",c:["百点をとれたことを心から喜んでおり、自分の実力に自信を持った","友人にほめてもらえたことで、百点の喜びがさらに大きくなった","点数という結果よりも、本当に理解できているかどうかが大切だと気づき、自分の理解不足に向き合っている","テストの点数は自分の実力を正確に示すものではないと開き直り、もう勉強しなくてよいと思っている"],a:2,e:"「胸は弾まなかった」「なんとなく書いたら合っていただけ」「理解できた問題は半分にも満たない」「点数は結果に過ぎない、大切なのは中身」から、点数より理解を重視する深い気づきが読み取れます。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["だから","しかし","そして","実際に"],a:1,e:"「友人にほめてもらえた」という状況から普通は喜びが生まれるはずが、「胸は少しも弾まなかった」という予想外の内容が続くので、逆接の「しかし」が適切です。"}
]},
{t:"随筆文",ti:"川がなくなった夏",
tx:"子どものころ、夏になると毎日のように近所の川で遊んだ。大人に怒られながらも飛び込みをしたり、透き通った水の底で光る小石を素潜りで拾ったり、ザリガニを捕まえては観察してからまた逃がしたりした。水は冷たく、底は滑らかな砂だった。今そこに行くと、川はコンクリートで三面護岸され、水量もわずかで魚の姿も見えない。あの夏の川は、もうどこにもない。___、大人になってからその川沿いの道を歩くたびに、言葉にならない喪失感を覚える。それは単なる「懐かしさ」とは少し違う。失われた風景は、失われた時間そのものであり、二度と取り戻せない何かを象徴しているのだと思う。",
q:[
{t:"要約",q:"この文章で筆者が最も伝えたいことは何ですか。最も適切なものを次の中から選びなさい。",c:["川のコンクリート護岸工事は環境破壊であり、法律で厳しく規制すべきだ","子ども時代の鮮明な記憶と、変わり果てた風景を見て、取り戻せないものへの深い喪失感を感じている","ザリガニ捕りや川遊びは危険なので、現代の子どもにやらせるべきではない","川の近くで育つことは情操教育として優れており、都市部の子どもが可哀想だ"],a:1,e:"「言葉にならない喪失感」「懐かしさとは少し違う」「失われた時間そのもの」「二度と取り戻せない」が主題です。法律論、危険論、都市批判は本文にありません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","だから","そして","なぜなら"],a:2,e:"「あの夏の川はもうどこにもない」という事実に続けて、「大人になってから喪失感を覚える」という別の事実を加えているので、「そして」が適切です。"}
]}
]},
{p:[
{t:"説明文",ti:"方言が映す文化の多様性",
tx:"方言は、その地域に生きた人々の歴史・文化・自然環境が長い時間をかけて凝縮された、言語の宝庫である。明治以降の標準語教育の普及と、テレビ・インターネットの浸透により、今日では多くの方言が急速に消滅の危機に瀕している。しかし、方言には標準語では決して表現しきれないニュアンスや概念が数多く含まれている。___、ある地方の言葉には「いびつな形をしているのにどこか愛らしい状態」を指す一語が存在し、それを標準語で表現しようとすると一文が必要になる。また、各地の方言に残る古語や独自の文法は、日本語の歴史を解き明かすための重要な手がかりでもある。方言を守ることは、単に「古い言葉」を残すことではなく、その地域に生きた人々の感性と精神的な遺産を次世代に伝えることにほかならない。",
q:[
{t:"要約",q:"この文章の内容として最も適切なものを次の中から選びなさい。",c:["方言はすべて標準語に統一することで、コミュニケーションが円滑になる","方言は地域の文化・感性・歴史を反映した言語遺産であり、その消滅は文化の喪失を意味する","方言は古くて使いにくいので、特に若者は積極的に使うべきではない","標準語は人工的に作られた言語であり、方言よりも表現力が豊かだ"],a:1,e:"「方言は言語の宝庫」「標準語では表現できないニュアンス」「精神的な遺産を伝えること」が主題です。「統一すべき」「使うべきでない」とは正反対です。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","たとえば","だから","つまり"],a:1,e:"前文で「方言には標準語では表現しきれないニュアンスが含まれている」と述べ、その具体例を示しているので、「たとえば」が適切です。"}
]},
{t:"物語文",ti:"田舎の夏の豊かさ",
tx:"田舎の祖父母の家で過ごした夏休みを、沙羅は今も忘れられない。縁側でスイカを食べながら聞くセミの声、蚊取り線香の煙が夕暮れの空に溶けていく様子、遠くの神社から聞こえてくる祭りの太鼓の音。そのどれもが、都会では絶対に体験できないものだった。祖父はよく「何もないところじゃが、ゆっくりしていきんさい」と笑いながら言った。___、あのころの沙羅には、その「何もなさ」の中にある本物の豊かさが、まったく見えていなかった。スマートフォンも、ショッピングモールも、友達も、そういうものがないと退屈だと思っていたのだ。大人になった今、あの縁側に戻りたいと切に思う。あのゆっくりとした時間こそが、失われていく何か大切なものを宿していたと、今はわかる。",
q:[
{t:"要約",q:"この文章で最も伝えたいことは何ですか。最も適切なものを次の中から選びなさい。",c:["田舎は都会に比べて不便であり、現代の若者が住むには向いていない","子どものときには「何もない」と感じていた田舎の生活の豊かさを、大人になって初めて理解し、懐かしんでいる","祭りや自然豊かな田舎の暮らしは都会の生活より絶対的に優れている","祖父の言葉は子どもには難しすぎて、まったく意味が理解できなかった"],a:1,e:"「何もなさの豊かさがまったく見えていなかった」→「あの縁側に戻りたい」「大切なものを宿していた」という大人になってからの気づきが主題です。「田舎が絶対に優れている」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["だから","しかし","また","つまり"],a:1,e:"「祖父がゆっくりしていきなさいと言った」という内容に対して「豊かさがまったく見えていなかった」という逆の反応が来るので、「しかし」が適切です。"}
]},
{t:"随筆文",ti:"見知らぬ人の傘",
tx:"雨の日に傘を忘れた。駅の改札を出た瞬間に気づいたが、家に取りに戻る時間はなかった。しかたなく、駅前の書店の軒下で雨宿りをすることにした。五分ほど経ったとき、隣に立っていた老婦人がふと「よかったら一緒に入りませんか」と傘を差し出してくれた。慌てて遠慮しようとすると「若い人が濡れると風邪をひきますよ」と言って、くしゃっと笑った。その笑顔は皺だらけで、でもどこまでも温かかった。___、その笑顔がずっと頭を離れない。世の中には、こんな言葉をさらりと言える人がいる。そのことが、今も私を勇気づける。見知らぬ人の小さな親切が、何年も経った今も心の中で生き続けている。",
q:[
{t:"要約",q:"この文章で筆者が最も伝えたいことは何ですか。最も適切なものを次の中から選びなさい。",c:["雨の日は必ず傘を持参すべきであり、忘れた自分が悪かった","見知らぬ人のさりげない親切が、何年も経っても心の支えであり続けることがある","老婦人の行動は見知らぬ人への接触であり、安全上問題がある","雨宿りをするときは書店の軒下が最も適している"],a:1,e:"「笑顔がずっと頭を離れない」「今も私を勇気づける」「何年も経った今も心の中で生き続けている」が主題です。「自分が悪かった」「安全上問題」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを次の中から選びなさい。",c:["しかし","だから","そして","つまり"],a:2,e:"「老婦人がくしゃっと笑った」という出来事の後に、「その笑顔が今も頭を離れない」という感想・結果が続くので、「そして」が自然な流れです。"}
]}
]},
{p:[
{t:"説明文",ti:"食の記憶と文化のつながり",

const SK='dokkai-stats-v3',PK='dokkai-progress-v3';
function lS(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{sets:0,correct:0,total:0};}catch(e){return{sets:0,correct:0,total:0};}}
function sS(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}
function lP(){try{const r=localStorage.getItem(PK);return r?JSON.parse(r):{nextSet:0};}catch(e){return{nextSet:0};}}
function sP(p){try{localStorage.setItem(PK,JSON.stringify(p));}catch(e){}}

function updateDisp(){
  const s=lS(),p=lP(),total=S.length;
  document.getElementById('stat-sets').textContent=s.sets;
  document.getElementById('stat-correct').textContent=s.correct;
  document.getElementById('stat-pct').textContent=s.total>0?Math.round(s.correct/s.total*100)+'%':'—';
  document.getElementById('set-counter').textContent=`セット ${p.nextSet+1} / ${total}`;
}

let cSD=null,cQ=0,sScore=0,sRes=[],answered=false;

function startSession(){
  const p=lP(),idx=p.nextSet%S.length;
  cSD=S[idx];cQ=0;sScore=0;sRes=[];answered=false;
  showScreen('quiz-screen');renderQ();
}

function renderQ(){
  const pi=Math.floor(cQ/2),qi=cQ%2,pas=cSD.p[pi],q=pas.q[qi];
  document.getElementById('qpfill').style.width=`${cQ/6*100}%`;
  document.getElementById('qptext').textContent=`${cQ+1}/6`;
  answered=false;
  const tc={'説明文':'tag-s','物語文':'tag-m','随筆文':'tag-z'};
  const nc={'説明文':'','物語文':'r','随筆文':'g'};
  const lb=['ア','イ','ウ','エ'];
  let tx=pas.tx;
  if(q.t==='接続詞')tx=pas.tx.replace(/___/g,'<span class="blank">　　</span>');
  const html=`
    ${qi===0?`<div class="passage-card"><span class="ptag ${tc[pas.t]}">${pas.t}</span><div class="ptitle">『${pas.ti}』</div><div class="ptext">${tx}</div></div>`
    :`<div class="passage-card" style="background:var(--card);border-style:dashed;"><span class="ptag ${tc[pas.t]}">${pas.t}（続き）</span><div class="ptext">${tx}</div></div>`}
    <div class="question-section">
      <div class="qlabel"><div class="qnum ${nc[pas.t]}">${cQ+1}</div><div class="qtext">${q.q}</div></div>
      <div class="choices" id="choices">${q.c.map((c,i)=>`<button class="choice-btn" onclick="selA(${i})"><strong>${lb[i]}</strong>　${c}</button>`).join('')}</div>
      <div class="feedback" id="feedback"><div class="fbtitle" id="fbtitle"></div><div id="fbbody"></div></div>
      <button class="next-btn" id="nxtbtn" onclick="nextQ()">${cQ<5?'次の問題 →':'結果を見る'}</button>
    </div>`;
  document.getElementById('quiz-content').innerHTML=html;
  window.scrollTo(0,0);
}

function selA(idx){
  if(answered)return;answered=true;
  const pi=Math.floor(cQ/2),qi=cQ%2,q=cSD.p[pi].q[qi];
  const ok=idx===q.a;const lb=['ア','イ','ウ','エ'];
  if(ok)sScore++;
  sRes.push({pt:cSD.p[pi].t,qt:q.t,ca:lb[q.a]+'　'+q.c[q.a],ok,e:q.e});
  document.querySelectorAll('.choice-btn').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');else if(i===idx&&!ok)b.classList.add('wrong');});
  document.getElementById('fbtitle').textContent=ok?'✓ 正解！':`✗ 不正解　正解：${lb[q.a]}`;
  document.getElementById('fbbody').textContent=q.e;
  document.getElementById('feedback').className='feedback show '+(ok?'ok':'ng');
  document.getElementById('nxtbtn').className='next-btn show';
}

function nextQ(){cQ++;if(cQ>=6)showResult();else renderQ();}

function showResult(){
  showScreen('result-screen');
  const pct=Math.round(sScore/6*100);
  document.getElementById('rscore').textContent=sScore;
  let msg,sub;
  if(pct===100){msg='🎉 パーフェクト！';sub='全問正解！素晴らしい読解力です。';}
  else if(pct>=83){msg='👏 よくできました！';sub='1問ミス。もう少しで完璧です。';}
  else if(pct>=67){msg='🙆 まずまず！';sub='間違えた問題の解説をよく読みましょう。';}
  else{msg='💪 もう一セット！';sub='「文章にないことは選ばない」を意識して。';}
  document.getElementById('rmsg').textContent=msg;
  document.getElementById('rsub').textContent=sub;
  const s=lS();s.sets++;s.correct+=sScore;s.total+=6;sS(s);
  const p=lP();p.nextSet=(p.nextSet+1)%S.length;sP(p);
  const wrong=sRes.filter(r=>!r.ok);
  const rc=document.getElementById('review-card');
  if(wrong.length>0){
    rc.style.display='block';
    document.getElementById('review-list').innerHTML=wrong.map(r=>`<div class="ritem"><div class="rq">[${r.pt}・${r.qt}]</div><div class="ra">正解：${r.ca}</div><div style="font-size:0.8rem;color:var(--muted);margin-top:4px;">${r.e}</div></div>`).join('');
  }else rc.style.display='none';
}

function showScreen(id){['home-screen','quiz-screen','result-screen'].forEach(s=>{document.getElementById(s).style.display=s===id?'block':'none';});}
function goHome(){updateDisp();showScreen('home-screen');}
function confirmBack(){if(confirm('ホームに戻りますか？'))goHome();}

updateDisp();showScreen('home-screen');
</script>
