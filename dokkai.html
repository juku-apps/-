<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>読解トレーニング｜予習シリーズ</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--surface:#ffffff;--card:#f5f2ea;--border:rgba(0,0,0,0.08);--accent:#2c5f8a;--accent2:#c0392b;--green:#1e7e4a;--red:#c0392b;--text:#1a1a2e;--muted:rgba(26,26,46,0.45);--gold:#8b6914;--radius:14px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.app{max-width:640px;margin:0 auto;padding:0 16px 60px;}
.header{padding:24px 0 20px;border-bottom:1px solid var(--border);margin-bottom:24px;}
.header-title{font-family:'Shippori Mincho',serif;font-size:1.4rem;color:var(--accent);letter-spacing:0.08em;}
.header-sub{font-size:0.7rem;color:var(--muted);margin-top:4px;}
.home-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.home-card h2{font-family:'Shippori Mincho',serif;font-size:1.1rem;color:var(--accent);margin-bottom:12px;}
.set-structure{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.set-row{display:flex;align-items:center;gap:10px;font-size:0.85rem;padding:10px 14px;background:var(--card);border-radius:10px;}
.set-tag{display:inline-block;font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0;}
.tag-s{background:rgba(44,95,138,0.12);color:var(--accent);}
.tag-m{background:rgba(192,57,43,0.1);color:var(--accent2);}
.tag-z{background:rgba(139,105,20,0.12);color:var(--gold);}
.stats-row{display:flex;gap:16px;margin-bottom:20px;}
.stat-box{flex:1;text-align:center;background:var(--card);border-radius:10px;padding:12px 8px;}
.stat-n{font-family:'Shippori Mincho',serif;font-size:1.8rem;color:var(--accent);line-height:1;}
.stat-l{font-size:0.65rem;color:var(--muted);margin-top:4px;}
.set-counter{font-size:0.72rem;color:var(--muted);text-align:center;margin-bottom:16px;}
.start-btn{width:100%;background:var(--accent);border:none;border-radius:var(--radius);padding:18px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(44,95,138,0.3);}
#quiz-screen{display:none;}
.quiz-nav{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.nav-back{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;}
.qpbar{flex:1;height:4px;background:rgba(0,0,0,0.08);border-radius:2px;overflow:hidden;}
.qpfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width 0.4s;}
.qptext{font-size:0.75rem;color:var(--muted);}
.passage-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.ptag{display:inline-block;font-size:0.62rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:14px;}
.ptitle{font-family:'Shippori Mincho',serif;font-size:1rem;font-weight:700;margin-bottom:12px;}
.ptext{font-family:'Shippori Mincho',serif;font-size:0.92rem;line-height:2;}
.blank{display:inline-block;background:var(--accent);color:white;padding:0 6px;border-radius:4px;font-weight:700;min-width:28px;text-align:center;}
.qlabel{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;}
.qnum{width:26px;height:26px;background:var(--accent);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;margin-top:2px;}
.qnum.r{background:var(--accent2)}.qnum.g{background:var(--gold);}
.qtext{font-size:0.9rem;font-weight:700;line-height:1.6;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.88rem;cursor:pointer;text-align:left;line-height:1.6;transition:all 0.15s;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(44,95,138,0.04);}
.choice-btn.correct{background:rgba(30,126,74,0.08);border-color:var(--green);color:var(--green);}
.choice-btn.wrong{background:rgba(192,57,43,0.06);border-color:var(--red);color:var(--red);}
.choice-btn:disabled{cursor:default;}
.feedback{border-radius:12px;padding:14px 16px;margin-top:12px;font-size:0.85rem;line-height:1.75;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:rgba(30,126,74,0.08);border:1px solid rgba(30,126,74,0.25);}
.feedback.ng{background:rgba(192,57,43,0.06);border:1px solid rgba(192,57,43,0.2);}
.fbtitle{font-weight:700;font-size:0.9rem;margin-bottom:6px;}
.feedback.ok .fbtitle{color:var(--green);}
.feedback.ng .fbtitle{color:var(--red);}
.next-btn{width:100%;background:var(--accent);border:none;border-radius:var(--radius);padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;margin-top:16px;display:none;}
.next-btn.show{display:block;}
#result-screen{display:none;}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:20px 0 16px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.rcircle{width:100px;height:100px;border-radius:50%;border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;background:rgba(44,95,138,0.05);}
.rnum{font-family:'Shippori Mincho',serif;font-size:2.2rem;color:var(--accent);line-height:1;}
.rdenom{font-size:0.7rem;color:var(--muted);}
.rmsg{font-size:1.1rem;font-weight:700;margin-bottom:8px;}
.rsub{font-size:0.82rem;color:var(--muted);line-height:1.7;}
.review-card{background:var(--surface);border:1px solid rgba(192,57,43,0.2);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.rtitle{font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:12px;}
.ritem{border-bottom:1px solid var(--border);padding:10px 0;font-size:0.82rem;line-height:1.75;}
.ritem:last-child{border-bottom:none;}
.rq{color:var(--muted);margin-bottom:4px;font-size:0.78rem;}
.ra{color:var(--green);font-weight:700;}
.result-btns{display:flex;flex-direction:column;gap:8px;}
.retry-btn{width:100%;background:var(--accent);border:none;border-radius:var(--radius);padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.home-btn{width:100%;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
<div id="home-screen">
  <div class="header">
    <div class="header-title">読解トレーニング</div>
    <div class="header-sub">予習シリーズ ｜ 中学受験対応 ｜ 全10セット</div>
  </div>
  <div class="home-card">
    <h2>1セットの構成</h2>
    <div class="set-structure">
      <div class="set-row"><span class="set-tag tag-s">説明文</span>要約問題 ＋ 接続詞問題</div>
      <div class="set-row"><span class="set-tag tag-m">物語文</span>要約問題 ＋ 接続詞問題</div>
      <div class="set-row"><span class="set-tag tag-z">随筆文</span>要約問題 ＋ 接続詞問題</div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-n" id="stat-sets">0</div><div class="stat-l">累計セット数</div></div>
      <div class="stat-box"><div class="stat-n" id="stat-correct">0</div><div class="stat-l">累計正解数</div></div>
      <div class="stat-box"><div class="stat-n" id="stat-pct">—</div><div class="stat-l">正答率</div></div>
    </div>
    <div class="set-counter" id="set-counter"></div>
    <button class="start-btn" onclick="startSession()">📖 次のセットを始める</button>
  </div>
</div>

<div id="quiz-screen">
  <div class="quiz-nav">
    <button class="nav-back" onclick="confirmBack()">←</button>
    <div class="qpbar"><div class="qpfill" id="qpfill" style="width:0%"></div></div>
    <div class="qptext" id="qptext">1/6</div>
  </div>
  <div id="quiz-content"></div>
</div>

<div id="result-screen">
  <div class="header"><div class="header-title">読解トレーニング</div></div>
  <div class="result-card">
    <div class="rcircle"><div class="rnum" id="rscore">0</div><div class="rdenom">/6問</div></div>
    <div class="rmsg" id="rmsg"></div>
    <div class="rsub" id="rsub"></div>
  </div>
  <div class="review-card" id="review-card" style="display:none">
    <div class="rtitle">▼ 間違えた問題</div>
    <div id="review-list"></div>
  </div>
  <div class="result-btns">
    <button class="retry-btn" onclick="startSession()">📖 次のセットへ</button>
    <button class="home-btn" onclick="goHome()">ホームに戻る</button>
  </div>
</div>
</div>

<script>
const S=[
{p:[
{t:"説明文",ti:"言語と思考の関係",tx:"言語は単なるコミュニケーションの道具ではない。私たちは言葉を通じて世界を認識し、思考を形成する。たとえば、「木漏れ日」という日本語の表現は、葉の間から差し込む光の様子を一語で表すが、この概念を持たない言語話者には同じ体験を言語化することが難しい。___、言語の違いは世界の見え方の違いを生み出すと言えるかもしれない。このことは、多様な言語を学ぶことが、多様な視点を獲得することにつながるという示唆を与えてくれる。",
q:[{t:"要約",q:"この文章の内容として最も適切なものを選びなさい。",c:["言語はコミュニケーションの道具に過ぎず、思考とは無関係である","言語は世界の認識や思考の形成に深く関わり、言語の多様性は視点の多様性につながる","日本語は世界で最も豊かな表現を持つ言語である","多くの言語を学ぶことで、より高い知能が得られる"],a:1,e:"本文は「言語は思考を形成する」「言語の違いは世界の見え方の違いを生む」という内容です。「日本語が最も豊か」や「知能が高まる」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","つまり","また","ところが"],a:1,e:"前の内容（木漏れ日の例）をまとめて「言語の違いは世界の見え方の違いを生む」と結論づけているので「つまり」が適切です。"}]},
{t:"物語文",ti:"春の約束",tx:"「また来年も咲くかな」と真帆はつぶやいた。校庭の隅の桜の木は、今年もみごとに花をつけていた。去年の春、転校する親友の彩と「来年もここで一緒に見よう」と約束したのだ。___、彩からは一通のメッセージも届いていない。真帆はスマートフォンを取り出し、長い間眺めてから、そっとポケットにしまった。来年この桜が咲くとき、自分はここにいるだろうか。",
q:[{t:"要約",q:"この場面における真帆の気持ちとして最も適切なものを選びなさい。",c:["桜の美しさに純粋に感動している","親友との約束が果たされないかもしれないという寂しさや不安を感じている","来年も同じ学校にいられることを確信している","彩が連絡をくれないことに強く怒っている"],a:1,e:"メッセージが届かないこと、来年もここにいるかわからないという描写から、約束が果たされないかもしれないという寂しさ・不安が読み取れます。「怒り」の描写はありません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["そして","だから","しかし","なぜなら"],a:2,e:"「約束した」という前の内容と「メッセージが届いていない」という後の内容は逆接の関係です。「しかし」が適切です。"}]},
{t:"随筆文",ti:"祖父の手",tx:"祖父の手は節くれだっていて、まるで古い木の根のようだった。子どものころ、その手に引かれて歩いた道の感触を、私はまだ覚えている。祖父は口数の少ない人で、自分の過去をほとんど語らなかった。___、手を見れば、どれほど多くのことを経験してきたかが伝わってきた。人は言葉だけで語るのではない、と私は今になって思う。",
q:[{t:"要約",q:"この文章で筆者が最も伝えたいことは何ですか。最も適切なものを選びなさい。",c:["祖父は無口だったので、一緒にいても楽しくなかった","言葉を使わなくても、人の経験や思いは伝わることがある","祖父の手は木の根のように美しかった","子どものころの記憶は大人になっても役に立つ"],a:1,e:"「人は言葉だけで語るのではない」という最後の一文が主題です。祖父の無口さを「楽しくなかった」とは書いていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","だから","また","つまり"],a:0,e:"「口数が少なく過去を語らなかった」という内容と「手を見れば経験が伝わってきた」という内容は対比・逆接の関係です。「しかし」が適切です。"}]}
]},
{p:[
{t:"説明文",ti:"プラスチックと海洋汚染",tx:"近年、海洋プラスチック汚染が深刻な問題となっている。毎年約800万トンものプラスチックが海に流れ込み、海洋生物の生態系に大きなダメージを与えている。特に問題なのがマイクロプラスチックと呼ばれる5ミリメートル以下の微細な粒子で、魚や貝類の体内に蓄積される。___、それを食べる人間への影響も無視できない。この問題を解決するためには、プラスチックの使用量を減らすとともに、適切な廃棄処理を徹底することが求められる。",
q:[{t:"要約",q:"この文章の内容として最も適切なものを選びなさい。",c:["プラスチックはすべて即座に使用禁止にすべきだ","海洋プラスチック汚染は生態系だけでなく人間にも影響し、使用削減と適切な処理が必要だ","マイクロプラスチックは海の深いところにしか存在しない","プラスチック汚染は先進国だけの問題だ"],a:1,e:"汚染の現状・マイクロプラスチックの問題・解決策を述べています。「即座に禁止」「深いところだけ」「先進国だけ」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","ところが","さらに","なぜなら"],a:2,e:"「魚や貝類の体内に蓄積される」という内容に加えて「人間への影響も」と話を広げているので「さらに」が適切です。"}]},
{t:"物語文",ti:"最後の練習",tx:"引退試合の前日、キャプテンの健は一人グラウンドに残った。三年間、雨の日も風の日も、ここで打ち続けた。明日で終わる。___、不思議と悲しくはなかった。むしろ胸の中に静かな満足感が広がっていく。バットを素振りしながら、健は初めてユニフォームを着た日のことを思い出した。あの日の緊張と興奮が、今は懐かしい。",
q:[{t:"要約",q:"健の気持ちとして最も適切なものを選びなさい。",c:["引退することに強い悲しみを感じている","三年間やり遂げた充実感と思い出への懐かしさを感じている","明日の試合に勝てるか不安でいっぱいだ","もっと練習を続けたいと後悔している"],a:1,e:"「静かな満足感」「初めてユニフォームを着た日を懐かしむ」という描写から充実感と懐かしさが読み取れます。「悲しくはなかった」と明記されています。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["だから","しかし","また","つまり"],a:1,e:"「明日で終わる」という事実から普通は悲しいと予想されますが「不思議と悲しくはなかった」と続くので、逆接の「しかし」が適切です。"}]},
{t:"随筆文",ti:"夜の台所",tx:"眠れない夜、私はよく台所に立つ。冷蔵庫を開けるわけでもなく、ただそこに立っているだけだ。台所は昼間とはまったく違う顔をしている。静寂の中で、水道の蛇口からかすかに水が滴る音だけが聞こえる。___、不思議と心が落ち着いてくる。日常の場所が、夜だけは別の何かになる。そういう瞬間を、私は密かに大切にしている。",
q:[{t:"要約",q:"この文章で筆者が伝えたいことは何ですか。最も適切なものを選びなさい。",c:["台所は昼間より夜の方が使いやすい","眠れない夜には台所で料理をするとよい","日常の場所が夜には別の雰囲気をもち、それが心の安らぎになる","眠れないときはすぐに医者に相談すべきだ"],a:2,e:"「台所が夜は別の顔をする」「心が落ち着く」「その瞬間を大切にしている」が主題です。「料理をする」「医者に相談」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","だから","すると","ところが"],a:2,e:"「静寂の中で水の音だけが聞こえる」という状況の後に「心が落ち着いてくる」という結果が続くので、順接・動作の結果を示す「すると」が適切です。"}]}
]},
{p:[
{t:"説明文",ti:"読書の効果",tx:"読書は語彙力や読解力を高めるだけでなく、共感能力の向上にも役立つとされている。物語の登場人物の視点に立つことで、自分とは異なる立場や感情を理解する練習ができるからだ。___、読書量と他者への共感能力には正の相関関係があるという研究結果も存在する。また、読書は集中力や想像力を鍛え、ストレスを軽減する効果もあるとされる。現代においてスクリーンタイムが増加する中、読書の習慣を大切にすることは、心の健康を守ることにもつながる。",
q:[{t:"要約",q:"この文章の内容として最も適切なものを選びなさい。",c:["読書は語彙力だけを高める効果がある","読書には語彙・共感能力・集中力・ストレス軽減など多様な効果があり、現代において重要だ","スクリーンタイムを増やすことは読書と同じ効果がある","読書量が多い人は必ず成績が優秀になる"],a:1,e:"本文は読書の多様な効果（語彙・共感・集中・ストレス軽減）を述べ、現代における重要性を説いています。「語彙だけ」「成績が必ず優秀」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","または","実際に","ところが"],a:2,e:"前文で「共感能力の向上に役立つ」と述べ、後文でその根拠となる研究結果を示しているので「実際に」が適切です。"}]},
{t:"物語文",ti:"おばあちゃんのレシピ",tx:"祖母が残したノートには、びっしりと料理のレシピが書き込まれていた。文字は細かく、時々読めないところもある。母は涙をこらえながらページをめくっている。「この煮物、お正月によく作ってたね」と母がつぶやく。___、そのレシピには「孫たちが好きな味」とメモが添えられていた。私はその文字を見て、胸が詰まった。祖母はいつも、誰かのことを考えながら料理をしていたのだ。",
q:[{t:"要約",q:"この場面から読み取れることとして最も適切なものを選びなさい。",c:["祖母のレシピノートは読みにくく役に立たなかった","祖母はいつも家族のことを思いながら料理をしていたことが、レシピのメモから伝わってくる","母は祖母のレシピを批判している","私はレシピに興味がなかった"],a:1,e:"「孫たちが好きな味」というメモから、祖母が常に誰かのことを考えていたことが伝わり「私」は胸が詰まっています。「役に立たない」「批判」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","すると","そして","なぜなら"],a:2,e:"「母がつぶやく」という行動の後に「メモが添えられていた」という発見が続く流れなので「そして」が自然です。"}]},
{t:"随筆文",ti:"雨の日の楽しみ",tx:"雨が降ると、世界が少し遅くなる気がする。傘を差してゆっくり歩く人々、軒下で雨宿りをする猫、水たまりに映る街の灯り。晴れの日には見落としていたものが、雨の日には突然姿を現す。___、私は雨が嫌いではない。むしろ、日常の裏側を見せてくれる雨の日が、どこか好きだとさえ思っている。",
q:[{t:"要約",q:"この文章で筆者が伝えたいことは何ですか。最も適切なものを選びなさい。",c:["雨の日は危険なので外出を控えるべきだ","雨の日には晴れの日とは違う世界の姿が見え、それが好きだという気持ち","雨が降ると交通渋滞が起きて困る","雨の日の猫の様子が特に面白い"],a:1,e:"「晴れの日には見落としていたものが現れる」「日常の裏側を見せてくれる」という表現が主題です。「危険」「渋滞」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","だから","つまり","それでも"],a:1,e:"「晴れの日には見落としていたものが雨の日に現れる」という内容を受けて「雨が嫌いではない」という結論が来るので「だから」が適切です。"}]}
]},
{p:[
{t:"説明文",ti:"睡眠と学習の関係",tx:"睡眠は単なる休息ではなく、学習した内容を記憶として定着させる重要なプロセスである。人間の脳は睡眠中に、その日に得た情報を整理・統合し、長期記憶として保存する。___、試験前夜に徹夜で勉強することは、かえって逆効果になることが多い。十分な睡眠をとることで、学習効率が高まり、創造的な思考も促進される。規則正しい睡眠習慣を維持することは、学業成績の向上にもつながると考えられている。",
q:[{t:"要約",q:"この文章の内容として最も適切なものを選びなさい。",c:["睡眠は学習とは無関係で、休息のためだけにある","睡眠中に記憶が整理・定着されるため、十分な睡眠が学習効率を高める","試験前は必ず8時間以上睡眠をとるべきだ","徹夜で勉強すれば必ず成績が下がる"],a:1,e:"本文の主題は「睡眠が記憶定着に重要」「十分な睡眠で学習効率が高まる」です。「必ず8時間」「必ず成績が下がる」という断定は本文にありません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["また","しかし","そのため","ところが"],a:2,e:"「睡眠中に情報を整理・定着させる」という前文を受けて「徹夜は逆効果」という結果が来るので「そのため」が適切です。"}]},
{t:"物語文",ti:"鏡の中の自分",tx:"鏡を見るたびに、莉子は少しだけ憂鬱になる。目が小さい、鼻が低い。そう思うたびに、雑誌のモデルと自分を比べてしまう。ある日、幼なじみの陽菜が「莉子って笑うと目が細くなって、すごくかわいいよ」と言った。___、莉子には素直に受け取れなかった。それでも帰り道、莉子はこっそり笑顔を作ってみた。鏡の中の自分が、少し違って見えた気がした。",
q:[{t:"要約",q:"莉子の変化として最も適切なものを選びなさい。",c:["陽菜の言葉で自信が完全に回復し、コンプレックスがなくなった","友人の言葉を素直に受け取れなかったが、少しずつ自分を見る目が変わり始めた","莉子は雑誌のモデルのようになることを決意した","陽菜の言葉に怒りを感じた"],a:1,e:"「素直に受け取れなかった」が「こっそり笑顔を作ってみた」「鏡の中の自分が少し違って見えた」という微妙な変化が描かれています。「完全に回復」「怒り」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["だから","しかし","また","つまり"],a:1,e:"「陽菜がかわいいと言った」という内容に対して「素直に受け取れなかった」という逆の内容が続くので「しかし」が適切です。"}]},
{t:"随筆文",ti:"川の記憶",tx:"子どものころ、夏になると近所の川で遊んだ。今はコンクリートで固められたその川に、かつての面影はない。透き通った水の中で光る小石を探したり、ザリガニを捕まえたりした記憶は、今も鮮明だ。___、大人になってからその川のそばを通るたびに、なんとも言えない喪失感を覚える。失われた風景は、失われた時間そのものでもある。",
q:[{t:"要約",q:"この文章で筆者が伝えたいことは何ですか。最も適切なものを選びなさい。",c:["川をコンクリートで固めることは法律で禁止すべきだ","子ども時代の鮮明な記憶と、変わってしまった風景への喪失感を感じている","ザリガニ捕りは危険なので子どもにやらせるべきでない","川の近くに住むことは風情がある"],a:1,e:"「記憶は鮮明」「喪失感を覚える」「失われた風景は失われた時間」が主題です。法律論や危険性の話は本文にありません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","だから","そして","なぜなら"],a:2,e:"「子どもの頃の記憶は鮮明」という内容に加えて「大人になって喪失感を覚える」という別の事実を追加しているので「そして」が適切です。"}]}
]},
{p:[
{t:"説明文",ti:"森林と気候変動",tx:"森林は「地球の肺」とも呼ばれ、大気中の二酸化炭素を吸収して酸素を供給する重要な役割を担っている。___、世界では毎年日本の国土面積に匹敵するほどの森林が失われているとされる。農地の拡大や木材採取、都市化が主な原因だ。森林破壊は気候変動を加速させるだけでなく、生物多様性の喪失にもつながる。森を守ることは、地球全体の未来を守ることにほかならない。",
q:[{t:"要約",q:"この文章の内容として最も適切なものを選びなさい。",c:["森林は美しい景色のためだけに存在する","森林は気候や生態系に不可欠だが急速に失われており、保護が必要だ","森林破壊は先進国だけが引き起こしている","二酸化炭素は増えても生態系には影響しない"],a:1,e:"森林の役割・現状・原因・影響を述べ「守ることが必要」と結論づけています。「景色のため」「先進国だけ」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["つまり","しかし","だから","または"],a:1,e:"「重要な役割を担っている」という内容に対して「毎年大量に失われている」という逆の現実が続くので「しかし」が適切です。"}]},
{t:"物語文",ti:"父の背中",tx:"父は毎朝五時に起きて弁当を作る。私が中学に入ってから、ずっとそうだ。一度だけ、寝坊して弁当が間に合わなかった日があった。父は申し訳なさそうに「今日だけ購買で買ってくれ」と言い、千円札を差し出した。___、私はなぜかその千円札を受け取ることができなかった。弁当がない日のほうが、父のことを考え続けた一日だった。",
q:[{t:"要約",q:"この場面から「私」の気持ちとして最も適切なものを選びなさい。",c:["父が弁当を作れなかったことに怒っている","毎日弁当を作る父への感謝と、その努力の大きさを改めて感じている","購買の食事の方が好きだと思っている","父が早起きすることを迷惑に感じている"],a:1,e:"千円札を受け取れなかった・弁当がない日の方が父のことを考えたという描写から、父への感謝と努力への気づきが読み取れます。「怒り」「迷惑」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["だから","しかし","また","つまり"],a:1,e:"「父が千円札を差し出した」という自然な流れに対して「受け取ることができなかった」という予想外の行動が続くので「しかし」が適切です。"}]},
{t:"随筆文",ti:"本棚の住人",tx:"引っ越しのたびに本棚を整理するが、どうしても捨てられない本がある。読み返すわけでもないのに、ただそこにあるだけでいい本だ。背表紙を眺めるだけで、その本を読んだときの自分に戻れる気がする。___、本は単なる情報の容器ではなく、その時間を生きた自分の記録でもある。本棚は、自分の歴史を並べた棚なのかもしれない。",
q:[{t:"要約",q:"この文章で筆者が最も伝えたいことは何ですか。最も適切なものを選びなさい。",c:["本は定期的に捨てないと部屋が散らかる","本は読み返してこそ価値がある","本は情報だけでなく読んだ当時の自分の記録であり、本棚は自分の歴史だ","引っ越しのたびに本を整理することは面倒だ"],a:2,e:"「本は自分の記録」「本棚は自分の歴史」が主題です。「捨てるべき」「読み返してこそ」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","つまり","また","ところが"],a:1,e:"「背表紙を眺めるだけで当時の自分に戻れる」という内容をまとめて「本は自分の記録だ」と結論づけているので「つまり」が適切です。"}]}
]},
{p:[
{t:"説明文",ti:"方言の価値",tx:"方言は、その地域の歴史や文化、自然環境が凝縮された言語の宝庫である。標準語の普及により多くの方言が消滅の危機に瀕しているが、方言には標準語では表現しきれないニュアンスや概念が含まれている。___、ある地方の言葉に「いびつな形をした愛らしいもの」を指す一語が存在するように、方言は人々の繊細な感性を反映している。方言を守ることは、その地域の精神的な遺産を守ることでもある。",
q:[{t:"要約",q:"この文章の内容として最も適切なものを選びなさい。",c:["方言はすべて標準語に統一するべきだ","方言は地域の文化や感性を反映した言語遺産であり保護する価値がある","方言は古くて使いにくいので若者は使うべきでない","標準語の方が方言よりも表現力が豊かだ"],a:1,e:"「方言は文化の宝庫」「精神的な遺産を守ること」が主題です。「統一すべき」「使うべきでない」とは正反対の主張です。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","たとえば","だから","つまり"],a:1,e:"前文で「方言には標準語では表現しきれないニュアンスが含まれる」と述べ、その具体例を挙げているので「たとえば」が適切です。"}]},
{t:"物語文",ti:"遠い夏",tx:"田舎の祖父母の家で過ごした夏休みを、沙羅はいつまでも忘れられない。縁側で食べるスイカ、蚊取り線香の匂い、遠くから聞こえる祭りの太鼓。祖父はよく「何もないところじゃが、ゆっくりしていきんさい」と言った。___、あのころの沙羅には、その「何もなさ」の豊かさが全くわからなかった。大人になった今、もう一度あの夏に戻りたいと思う。",
q:[{t:"要約",q:"この文章で最も伝えたいことは何ですか。最も適切なものを選びなさい。",c:["田舎は都会に比べて不便なので若者は住むべきでない","子どものときには気づかなかった「何もなさ」の豊かさを大人になって理解し懐かしんでいる","祭りや行事のある田舎の生活は都会より優れている","祖父の言葉は意味がなかった"],a:1,e:"「何もなさの豊かさが全くわからなかった」→「もう一度戻りたい」という大人になってからの気づきが主題です。「田舎が優れている」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["だから","しかし","また","つまり"],a:1,e:"「祖父がゆっくりしていきなさいと言った」という内容に対して「豊かさが全くわからなかった」という逆の反応が来るので「しかし」が適切です。"}]},
{t:"随筆文",ti:"傘の記憶",tx:"雨の日に傘を忘れた。しかたなく軒下で雨宿りをしていると、見知らぬ老婦人が「一緒に入りますか」と傘を差し出してくれた。遠慮がちに断ると「若い人は濡れると風邪をひきますよ」と笑いながら言った。___、その笑顔がずっと忘れられない。見知らぬ人の小さな親切が、時に何年も心に残ることがある。",
q:[{t:"要約",q:"この文章で筆者が最も伝えたいことは何ですか。最も適切なものを選びなさい。",c:["雨の日は必ず傘を持参すべきだ","見知らぬ人の小さな親切が長く心に残ることがある","老婦人の行動は危険なのでまねすべきでない","雨宿りは時間の無駄だ"],a:1,e:"「その笑顔がずっと忘れられない」「小さな親切が何年も心に残る」が主題です。「必ず傘を」「危険」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","だから","そして","つまり"],a:2,e:"「老婦人が笑いながら言った」という出来事に続いて「笑顔が忘れられない」という感想が来るので「そして」が自然な流れです。"}]}
]},
{p:[
{t:"説明文",ti:"食の記憶と文化",tx:"食べ物の記憶は、他のどんな記憶よりも鮮明で感情的だと言われている。匂いや味が、忘れていた場面や感情を一瞬で呼び覚ますことがある。これをプルースト効果と呼ぶ。___、食は単に栄養を摂るための行為ではなく、文化・家族・時間を共有するための行為でもある。世界各地の料理がその土地の歴史や自然条件を反映しているように、食文化は人類の多様性を象徴するものでもある。",
q:[{t:"要約",q:"この文章の内容として最も適切なものを選びなさい。",c:["すべての食べ物の記憶は科学的に証明されている","食は栄養摂取だけでなく感情・文化・歴史と深く結びついている","プルースト効果はすべての人に同じように起こる","世界の料理はすべて同じ起源を持つ"],a:1,e:"「プルースト効果」「食は文化・家族を共有する行為」「食文化は多様性を象徴」という内容が主題です。「すべての人に同じ」「同じ起源」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","また","なぜなら","ところが"],a:1,e:"「プルースト効果」の説明に加えて「食は文化を共有する行為でもある」という別の視点を追加しているので「また」が適切です。"}]},
{t:"物語文",ti:"百点満点",tx:"テストが返ってきた。百点だった。でも、隣の席の優斗が「すごいじゃん」と言っても、颯太の胸は少しも弾まなかった。問題を解いているとき、答えがわかったのではなく、なんとなく書いたら合っていただけだったからだ。___、本当に理解できた問題は半分もなかった。百点という数字より、自分が何を理解していないかを、颯太は初めて真剣に考えた。",
q:[{t:"要約",q:"颯太の気持ちとして最も適切なものを選びなさい。",c:["百点をとれたので純粋に喜んでいる","点数より本当の理解の方が大切だと気づき、自分の理解不足を真剣に考えている","優斗にほめられてうれしくなった","テストの点数は重要ではないと開き直っている"],a:1,e:"「胸は弾まなかった」「なんとなく合っただけ」「理解できた問題は半分もない」「何を理解していないか考えた」から、点数より理解を重視する気づきが読み取れます。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["だから","しかし","そして","実際に"],a:3,e:"「なんとなく書いたら合っていただけ」という内容を受けて「理解できた問題は半分もない」という具体的な現実を示しているので「実際に」が適切です。"}]},
{t:"随筆文",ti:"図書館の午後",tx:"図書館が好きだ。特に、誰もいない平日の午後の図書館が。無数の本が並ぶ棚の間を歩くと、知らない世界の入り口がいくつも並んでいるような気持ちになる。今日読む本を選ぶのは、今日の自分を選ぶことでもある、と私はひそかに思っている。___、気が向くまま棚を眺めて、ふと手に取った一冊が人生を変えることだって、あるのかもしれない。",
q:[{t:"要約",q:"この文章で筆者が最も伝えたいことは何ですか。最も適切なものを選びなさい。",c:["図書館は勉強するための場所だ","図書館は本との偶然の出会いがあり、その一冊が自分を変える可能性がある特別な場所だ","本を読まないと人生が変わらない","平日の図書館は空いていてよい"],a:1,e:"「知らない世界の入り口」「今日の自分を選ぶ」「人生を変える一冊」が主題です。「勉強するだけの場所」とは書かれていません。"},
{t:"接続詞",q:"文中の___に入る言葉として最も適切なものを選びなさい。",c:["しかし","だから","そして","つまり"],a:2,e:"前文で「今日読む本を選ぶことは今日の自分を選ぶこと」と述べ、続けて「偶然の一冊が人生を変えることもある」と話を展開しているので「そして」が自然です。"}]}
]},
{p:[

const SK='dokkai-stats-v2',PK='dokkai-progress-v2';
function lS(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{sets:0,correct:0,total:0};}catch(e){return{sets:0,correct:0,total:0};}}
function sS(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}
function lP(){try{const r=localStorage.getItem(PK);return r?JSON.parse(r):{nextSet:0};}catch(e){return{nextSet:0};}}
function sP(p){try{localStorage.setItem(PK,JSON.stringify(p));}catch(e){}}

function updateDisp(){
  const s=lS(),p=lP(),total=S.length;
  document.getElementById('stat-sets').textContent=s.sets;
  document.getElementById('stat-correct').textContent=s.correct;
  document.getElementById('stat-pct').textContent=s.total>0?Math.round(s.correct/s.total*100)+'%':'—';
  document.getElementById('set-counter').textContent=`セット ${p.nextSet+1} / ${total}`;
}

let cSD=null,cQ=0,sScore=0,sRes=[],answered=false;

function startSession(){
  const p=lP(),idx=p.nextSet%S.length;
  cSD=S[idx];cQ=0;sScore=0;sRes=[];answered=false;
  showScreen('quiz-screen');renderQ();
}

function renderQ(){
  const pi=Math.floor(cQ/2),qi=cQ%2,pas=cSD.p[pi],q=pas.q[qi];
  document.getElementById('qpfill').style.width=`${cQ/6*100}%`;
  document.getElementById('qptext').textContent=`${cQ+1}/6`;
  answered=false;
  const tc={'説明文':'tag-s','物語文':'tag-m','随筆文':'tag-z'};
  const nc={'説明文':'','物語文':'r','随筆文':'g'};
  const lb=['ア','イ','ウ','エ'];
  let tx=pas.tx;
  if(q.t==='接続詞')tx=pas.tx.replace(/___/g,'<span class="blank">　　</span>');
  const html=`
    ${qi===0?`<div class="passage-card"><span class="ptag ${tc[pas.t]}">${pas.t}</span><div class="ptitle">『${pas.ti}』</div><div class="ptext">${tx}</div></div>`
    :`<div class="passage-card" style="background:var(--card);border-style:dashed;"><span class="ptag ${tc[pas.t]}">${pas.t}（続き）</span><div class="ptext">${tx}</div></div>`}
    <div class="question-section">
      <div class="qlabel"><div class="qnum ${nc[pas.t]}">${cQ+1}</div><div class="qtext">${q.q}</div></div>
      <div class="choices" id="choices">${q.c.map((c,i)=>`<button class="choice-btn" onclick="selA(${i})"><strong>${lb[i]}</strong>　${c}</button>`).join('')}</div>
      <div class="feedback" id="feedback"><div class="fbtitle" id="fbtitle"></div><div id="fbbody"></div></div>
      <button class="next-btn" id="nxtbtn" onclick="nextQ()">${cQ<5?'次の問題 →':'結果を見る'}</button>
    </div>`;
  document.getElementById('quiz-content').innerHTML=html;
  window.scrollTo(0,0);
}

function selA(idx){
  if(answered)return;answered=true;
  const pi=Math.floor(cQ/2),qi=cQ%2,q=cSD.p[pi].q[qi];
  const ok=idx===q.a;const lb=['ア','イ','ウ','エ'];
  if(ok)sScore++;
  sRes.push({pt:cSD.p[pi].t,qt:q.t,ca:lb[q.a]+'　'+q.c[q.a],ok,e:q.e});
  document.querySelectorAll('.choice-btn').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');else if(i===idx&&!ok)b.classList.add('wrong');});
  document.getElementById('fbtitle').textContent=ok?'✓ 正解！':`✗ 不正解　正解：${lb[q.a]}`;
  document.getElementById('fbbody').textContent=q.e;
  document.getElementById('feedback').className='feedback show '+(ok?'ok':'ng');
  document.getElementById('nxtbtn').className='next-btn show';
}

function nextQ(){cQ++;if(cQ>=6)showResult();else renderQ();}

function showResult(){
  showScreen('result-screen');
  const pct=Math.round(sScore/6*100);
  document.getElementById('rscore').textContent=sScore;
  let msg,sub;
  if(pct===100){msg='🎉 パーフェクト！';sub='全問正解！素晴らしい読解力です。';}
  else if(pct>=83){msg='👏 よくできました！';sub='1問ミス。もう少しで完璧です。';}
  else if(pct>=67){msg='🙆 まずまず！';sub='間違えた問題の解説をよく読みましょう。';}
  else{msg='💪 もう一セット！';sub='「文章にないことは選ばない」を意識して。';}
  document.getElementById('rmsg').textContent=msg;
  document.getElementById('rsub').textContent=sub;
  const s=lS();s.sets++;s.correct+=sScore;s.total+=6;sS(s);
  const p=lP();p.nextSet=(p.nextSet+1)%S.length;sP(p);
  const wrong=sRes.filter(r=>!r.ok);
  const rc=document.getElementById('review-card');
  if(wrong.length>0){
    rc.style.display='block';
    document.getElementById('review-list').innerHTML=wrong.map(r=>`<div class="ritem"><div class="rq">[${r.pt}・${r.qt}]</div><div class="ra">正解：${r.ca}</div><div style="font-size:0.8rem;color:var(--muted);margin-top:4px;">${r.e}</div></div>`).join('');
  }else rc.style.display='none';
}

function showScreen(id){['home-screen','quiz-screen','result-screen'].forEach(s=>{document.getElementById(s).style.display=s===id?'block':'none';});}
function goHome(){updateDisp();showScreen('home-screen');}
function confirmBack(){if(confirm('ホームに戻りますか？'))goHome();}

updateDisp();showScreen('home-screen');
</script>
