<html lang="ja">

<meta charset="UTF-8">

<style>
:root {
  --kokugo: #C0272D; --kokugo-light: #FAEAEA;
  --sansu: #1E5FA8;  --sansu-light: #E8EFF8;
  --rika: #E87722;   --rika-light: #FDF0E3;
  --shakai: #2A7A3B; --shakai-light: #E8F5EB;
  --bg: #F7F8FA; --surface: #FFFFFF; --border: #E4E7EC;
  --text: #1A1D23; --text-sub: #6B7280;
  --shukudai: #FF6B6B; --jishu: #54B3D6;
  --radius: 12px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }

.app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px 0; position: sticky; top: 0; z-index: 100; }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.app-title { font-size: 17px; font-weight: 700; }
.gear-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px; }
.week-selector { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.week-selector button { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--text); }
.week-label { font-size: 14px; font-weight: 600; flex: 1; text-align: center; }
.tabs { display: flex; }
.tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab.active { color: var(--text); border-bottom-color: var(--text); }

.tab-content { display: none; padding: 16px; padding-bottom: 80px; }
.tab-content.active { display: block; }

/* 進捗 */
.progress-section { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; border: 1px solid var(--border); }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.progress-title { font-size: 13px; font-weight: 600; color: var(--text-sub); }
.progress-count { font-size: 13px; font-weight: 700; }
.progress-bar-wrap { background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; margin-bottom: 12px; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg,#4A90D9,#5BAD6F); border-radius: 4px; transition: width 0.3s ease; }
.subject-progress { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.subject-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 8px; border-radius: 6px; }
.subject-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* フィルター */
.filter-area { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px 10px; }
.filter-label { font-size: 10px; font-weight: 700; color: var(--text-sub); letter-spacing: 0.06em; margin-bottom: 5px; }
.filter-row { display: flex; gap: 6px; margin-bottom: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-row:last-child { margin-bottom: 0; }
.kind-chip { flex-shrink: 0; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; background: var(--bg); color: var(--text-sub); transition: all 0.15s; }
.kind-chip.active-shukudai { background: var(--shukudai); color: white; }
.kind-chip.active-jishu { background: var(--jishu); color: white; }
.subject-tab { flex-shrink: 0; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; background: var(--bg); color: var(--text-sub); transition: all 0.15s; }
.subject-tab.active-all { background: var(--text); color: white; }
.subject-tab.active-kokugo { background: var(--kokugo); color: white; }
.subject-tab.active-sansu  { background: var(--sansu);  color: white; }
.subject-tab.active-rika   { background: var(--rika);   color: white; }
.subject-tab.active-shakai { background: var(--shakai); color: white; }

/* タスクカード */
.section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--text-sub); margin: 16px 0 8px; }
.task-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 8px; overflow: hidden; }
.task-card.done { opacity: 0.6; }
.task-main { display: flex; align-items: center; padding: 12px 14px; gap: 10px; }
.subject-bar { width: 4px; border-radius: 2px; align-self: stretch; flex-shrink: 0; }
.task-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.15s; font-size: 14px; }
.task-check.checked { background: #5BAD6F; border-color: #5BAD6F; color: white; }
.task-info { flex: 1; min-width: 0; }
.task-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
.badge.shukudai { background: #FEE2E2; color: var(--shukudai); }
.badge.jishu { background: #E0F4FB; color: var(--jishu); }
.deadline { font-size: 11px; color: var(--text-sub); }
.deadline.urgent { color: #EF4444; font-weight: 600; }
.rikai-group { display: flex; gap: 4px; flex-shrink: 0; }
.rikai-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border); background: none; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-weight: 700; }
.rikai-btn.maru.active    { background: #DCFCE7; border-color: #5BAD6F; color: #166534; }
.rikai-btn.sankaku.active { background: #FEF9C3; border-color: #EAB308; color: #713F12; }
.rikai-btn.batsu.active   { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }
.task-comment { border-top: 1px solid var(--border); padding: 8px 14px 10px; display: none; }
.task-comment.show { display: block; }
.comment-toggle { font-size: 11px; color: var(--text-sub); cursor: pointer; padding: 2px 14px 6px; display: block; }
.comment-input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; font-family: inherit; resize: none; background: var(--bg); color: var(--text); min-height: 60px; }
.comment-input:focus { outline: none; border-color: #4A90D9; }
.comment-label { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }

/* 予定日タブ */
.date-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.date-nav button { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--text); }
.date-nav-label { flex: 1; text-align: center; font-size: 15px; font-weight: 700; }
.today-btn { font-size: 12px; padding: 4px 10px !important; }

/* ボタン */
.btn-primary { background: var(--text); color: white; border: none; border-radius: var(--radius-sm); padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-danger { background: none; border: none; color: #EF4444; font-size: 18px; cursor: pointer; padding: 4px 8px; line-height: 1; }
.action-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.action-bar .btn-primary { flex: 1; }

/* モーダル */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 20px 16px 40px; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.modal-close { float: right; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-sub); line-height: 1; }
.form-row { margin-bottom: 12px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 5px; display: block; }
.form-input, .form-select { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text); }
.form-input:focus, .form-select:focus { outline: none; border-color: #4A90D9; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

/* テンプレートモーダル */
.subject-section { margin-bottom: 16px; }
.subject-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.subject-tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 10px; color: white; }
.template-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 6px; }
.template-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
.template-item-name { flex: 1; font-size: 14px; }

/* 設定モーダル */
.setting-section { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
.setting-section-title { padding: 12px 16px; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.template-edit-item { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 8px; }
.template-edit-item:last-child { border-bottom: none; }
.template-edit-name { flex: 1; font-size: 14px; }
.kind-toggle { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; border: none; cursor: pointer; }
.kind-toggle.shukudai { background: #FEE2E2; color: var(--shukudai); }
.kind-toggle.jishu    { background: #E0F4FB; color: var(--jishu); }

/* 空状態 */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-sub); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; line-height: 1.6; }

/* トースト */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1A1D23; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.2s; z-index: 300; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 科目カラー */
.kokugo-bar{background:var(--kokugo)} .sansu-bar{background:var(--sansu)} .rika-bar{background:var(--rika)} .shakai-bar{background:var(--shakai)}
.kokugo-tag{background:var(--kokugo)} .sansu-tag{background:var(--sansu)} .rika-tag{background:var(--rika)} .shakai-tag{background:var(--shakai)}
/* バナー */
.banner {
  margin: 12px 16px 0;
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  animation: slideDown 0.3s ease;
  border: 1.5px solid transparent;
}
@keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
.banner.info    { background: #EBF3FD; border-color: var(--sansu); }
.banner.warning { background: #FEF9C3; border-color: #EAB308; }
.banner.danger  { background: #FEE2E2; border-color: var(--shukudai); }
.banner-icon { font-size: 22px; flex-shrink: 0; }
.banner-text { flex: 1; font-size: 13px; font-weight: 700; line-height: 1.5; }
.banner-arrow { font-size: 16px; color: var(--text-sub); flex-shrink: 0; }
.banner-close { font-size: 18px; color: var(--text-sub); cursor: pointer; padding: 0 4px; flex-shrink: 0; }

.kokugo-dot{background:var(--kokugo)} .sansu-dot{background:var(--sansu)} .rika-dot{background:var(--rika)} .shakai-dot{background:var(--shakai)}
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div class="app-title">📚 塾スケジュール</div>
    <button class="gear-btn" onclick="openSettings()">⚙️</button>
  </div>
  <div class="week-selector">
    <button onclick="changeWeek(-1)">‹</button>
    <div class="week-label" id="weekLabel"></div>
    <button onclick="changeWeek(1)">›</button>
    <button class="btn-secondary" style="font-size:12px;padding:4px 10px;" onclick="goToCurrentWeek()">今週</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('today')">今週のタスク</div>
    <div class="tab" onclick="switchTab('schedule')">予定日</div>
  </div>
</div>

<!-- バナーエリア -->
<div id="bannerArea"></div>

<!-- 今週のタスク -->
<div id="tab-today" class="tab-content active">
  <div class="progress-section" id="progressSection"></div>
  <div class="filter-area">
    <div class="filter-label">種別</div>
    <div class="filter-row" id="kindFilterRow">
      <div class="kind-chip active-shukudai" onclick="toggleKindFilter('宿題')">宿題</div>
      <div class="kind-chip active-jishu" onclick="toggleKindFilter('自習')">自習</div>
    </div>
    <div class="filter-label">科目</div>
    <div class="filter-row">
      <div class="subject-tab active-all" onclick="filterSubject('全部')">全部</div>
      <div class="subject-tab" onclick="filterSubject('国語')">国語</div>
      <div class="subject-tab" onclick="filterSubject('算数')">算数</div>
      <div class="subject-tab" onclick="filterSubject('理科')">理科</div>
      <div class="subject-tab" onclick="filterSubject('社会')">社会</div>
    </div>
  </div>
  <div style="padding:12px 16px 0;">
    <div class="action-bar">
      <button class="btn-primary" onclick="openTemplateModal()">＋ テンプレートから追加</button>
      <button class="btn-secondary" onclick="openAddModal()">手動追加</button>
    </div>
  </div>
  <div id="taskList" style="padding:0 0 0 0;"></div>
</div>

<!-- 予定日タブ -->
<div id="tab-schedule" class="tab-content">
  <div class="date-nav">
    <button onclick="changeScheduleDate(-1)">‹</button>
    <div class="date-nav-label" id="scheduleDateLabel"></div>
    <button onclick="changeScheduleDate(1)">›</button>
    <button class="btn-secondary today-btn" onclick="goToToday()">今日</button>
  </div>
  <div id="scheduleList"></div>
</div>

<!-- テンプレートモーダル -->
<div class="modal-overlay" id="templateModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('templateModal')">×</button>
    <div class="modal-title">テンプレートから追加</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn-secondary" style="flex:1;font-size:13px;" onclick="selectAllTemplates(true)">すべて選択</button>
      <button class="btn-secondary" style="flex:1;font-size:13px;" onclick="selectAllTemplates(false)">すべて解除</button>
    </div>
    <div id="templateContent"></div>
    <button class="btn-primary" style="width:100%;margin-top:12px;" onclick="addFromTemplate()">選択した項目を追加</button>
  </div>
</div>

<!-- 手動追加モーダル -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('addModal')">×</button>
    <div class="modal-title" id="addModalTitle">タスクを追加</div>
    <div class="form-row">
      <label class="form-label">科目</label>
      <select class="form-select" id="f-subject">
        <option value="国語">国語</option>
        <option value="算数">算数</option>
        <option value="理科">理科</option>
        <option value="社会">社会</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">教材・作業名</label>
      <input class="form-input" id="f-name" placeholder="例：予習シリーズ 要点チェック">
    </div>
    <div class="form-row-2">
      <div>
        <label class="form-label">種別</label>
        <select class="form-select" id="f-kind">
          <option value="宿題">宿題</option>
          <option value="自習">自習</option>
        </select>
      </div>
      <div>
        <label class="form-label">予定日</label>
        <input class="form-input" type="date" id="f-deadline">
      </div>
    </div>
    <input type="hidden" id="f-edit-id">
    <button class="btn-primary" style="width:100%;margin-top:4px;" onclick="saveTask()">保存</button>
  </div>
</div>

<!-- 設定モーダル -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
    <div class="modal-title">設定（テンプレート）</div>
    <div id="settingsList"></div>
  </div>
</div>

<!-- 期限切れモーダル -->
<div class="modal-overlay" id="overdueModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('overdueModal')">×</button>
    <div class="modal-title">⚠️ 期限切れのタスク</div>
    <div style="font-size:13px;color:var(--text-sub);margin-bottom:12px;">完了したものはチェック、未完了のものは予定日を変更してください。</div>
    <div id="overdueList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ===== Firebase =====
async function loadData() { return _cachedTasks; }

async function loadTemplates() {

async function getWeekTasks(offset = currentWeekOffset) {
  const key = getWeekKey(offset);
  return (await loadData()).filter(t => t.week === key);
}

// ===== 週ユーティリティ =====
function getWeekKey(offset=0) {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + 1 + offset*7);
  return `${d.getFullYear()}-W${String(getWeekNumber(d)).padStart(2,'0')}`;
}
function getWeekNumber(d) {
  const onejan = new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
}
function getWeekRange(offset=0) {
  const d = new Date();
  d.setDate(d.getDate()-d.getDay()+1+offset*7);
  const mon = new Date(d); const sun = new Date(d); sun.setDate(mon.getDate()+6);
  const fmt = x=>`${x.getMonth()+1}/${x.getDate()}`;
  return `${mon.getFullYear()}年 ${fmt(mon)}〜${fmt(sun)}`;
}
function changeWeek(dir) { currentWeekOffset+=dir; updateWeekLabel(); renderAll(); }
function goToCurrentWeek() { currentWeekOffset=0; updateWeekLabel(); renderAll(); }
function updateWeekLabel() { document.getElementById('weekLabel').textContent=getWeekRange(currentWeekOffset); }

// ===== 予定日ユーティリティ =====
function getScheduleDate(offset=scheduleDateOffset) {
  const d = new Date(); d.setDate(d.getDate()+offset); return d;
}
function formatDateLabel(d) {
  const days=['日','月','火','水','木','金','土'];
  const today=new Date(); today.setHours(0,0,0,0);
  const target=new Date(d); target.setHours(0,0,0,0);
  const diff=(target-today)/86400000;
  let prefix='';
  if(diff===0) prefix='今日・';
  else if(diff===1) prefix='明日・';
  else if(diff===-1) prefix='昨日・';
  return `${prefix}${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
}
function getDateISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function changeScheduleDate(dir) { scheduleDateOffset+=dir; renderSchedule(); }
function goToToday() { scheduleDateOffset=0; renderSchedule(); }

// ===== レンダリング =====
async function renderAll() { await renderToday(); }

async function renderToday() {
  const tasks = await getWeekTasks();
  const shukudaiTasks=tasks.filter(t=>t.kind==='宿題');
  const jishuTasks=tasks.filter(t=>t.kind==='自習');
  const shukudaiDone=shukudaiTasks.filter(t=>t.done).length;
  const jishuDone=jishuTasks.filter(t=>t.done).length;
  const total=tasks.length; const done=tasks.filter(t=>t.done).length;
  const pct=total>0?Math.round(done/total*100):0;
  const subjectCounts={};
  ['国語','算数','理科','社会'].forEach(s=>{
    const st=tasks.filter(t=>t.subject===s);
    subjectCounts[s]={total:st.length,done:st.filter(t=>t.done).length};
  });

  document.getElementById('progressSection').innerHTML=`
    <div class="progress-header"><span class="progress-title">今週の進捗</span><span class="progress-count">${done} / ${total} 完了</span></div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div style="background:#FEE2E2;border-radius:8px;padding:8px 10px;">
        <div style="font-size:10px;font-weight:700;color:var(--shukudai);margin-bottom:3px;">📌 宿題</div>
        <div style="font-size:13px;font-weight:700;">${shukudaiDone} / ${shukudaiTasks.length} 完了</div>
        <div style="background:#FECACA;border-radius:3px;height:5px;margin-top:5px;">
          <div style="background:var(--shukudai);height:100%;border-radius:3px;width:${shukudaiTasks.length>0?Math.round(shukudaiDone/shukudaiTasks.length*100):0}%;"></div>
        </div>
      </div>
      <div style="background:#E0F4FB;border-radius:8px;padding:8px 10px;">
        <div style="font-size:10px;font-weight:700;color:var(--jishu);margin-bottom:3px;">📖 自習</div>
        <div style="font-size:13px;font-weight:700;">${jishuDone} / ${jishuTasks.length} 完了</div>
        <div style="background:#BAE6FD;border-radius:3px;height:5px;margin-top:5px;">
          <div style="background:var(--jishu);height:100%;border-radius:3px;width:${jishuTasks.length>0?Math.round(jishuDone/jishuTasks.length*100):0}%;"></div>
        </div>
      </div>
    </div>
    <div class="subject-progress">
      ${['国語','算数','理科','社会'].map(s=>{
        const c=subjectCounts[s]; if(c.total===0)return'';
        const k=SUBJECT_KEYS[s];
        return`<div class="subject-chip"><div class="dot ${k.dot}"></div><span style="font-size:12px;font-weight:600;">${s}</span><span style="font-size:12px;color:var(--text-sub);margin-left:auto;">${c.done}/${c.total}</span></div>`;
      }).join('')}
    </div>`;

  const list=document.getElementById('taskList');
  if(tasks.length===0){
    list.innerHTML=`<div class="empty-state"><div class="icon">📝</div><p>今週のタスクはまだありません。<br>上のボタンから追加してください。</p></div>`;
    return;
  }
  const filtered=tasks.filter(t=>currentKindFilter.has(t.kind)&&(currentSubjectFilter==='全部'||t.subject===currentSubjectFilter));
  if(filtered.length===0){ list.innerHTML=`<div class="empty-state"><div class="icon">📭</div><p>該当するタスクがありません。</p></div>`; return; }

  const sorted=[...filtered].sort((a,b)=>{
    if(a.kind!==b.kind)return a.kind==='宿題'?-1:1;
    if(a.deadline&&b.deadline)return a.deadline.localeCompare(b.deadline);
    return 0;
  });
  let html=''; let lastKind=null;
  sorted.forEach(task=>{
    if(task.kind!==lastKind){ html+=`<div class="section-label" style="padding:0 16px;">${task.kind==='宿題'?'📌 宿題':'📖 自習'}</div>`; lastKind=task.kind; }
    html+=renderTaskCard(task);
  });
  list.innerHTML=html;
  attachTaskEvents();
}

async function renderSchedule() {
  const d=getScheduleDate();
  document.getElementById('scheduleDateLabel').textContent=formatDateLabel(d);
  const iso=getDateISO(d);
  const tasks=await loadData();
  const dayTasks=tasks.filter(t=>t.deadline===iso);
  const list=document.getElementById('scheduleList');
  if(dayTasks.length===0){
    list.innerHTML=`<div class="empty-state"><div class="icon">📅</div><p>この日の予定はありません。</p></div>`;
    return;
  }
  const sorted=[...dayTasks].sort((a,b)=>{
    if(a.kind!==b.kind)return a.kind==='宿題'?-1:1;
    if(a.subject!==b.subject)return['国語','算数','理科','社会'].indexOf(a.subject)-['国語','算数','理科','社会'].indexOf(b.subject);
    return 0;
  });
  let html=''; let lastKind=null;
  sorted.forEach(task=>{
    if(task.kind!==lastKind){ html+=`<div class="section-label">${task.kind==='宿題'?'📌 宿題':'📖 自習'}</div>`; lastKind=task.kind; }
    html+=renderTaskCard(task);
  });
  list.innerHTML=html;
  attachTaskEvents();
}

function renderTaskCard(task) {
  const k=SUBJECT_KEYS[task.subject]||SUBJECT_KEYS['国語'];
  const rikaiBtns=['○','△','×'].map(r=>{
    const cls=r==='○'?'maru':r==='△'?'sankaku':'batsu';
    const active=task.rikai===r?'active':'';
    return`<button class="rikai-btn ${cls} ${active}" data-id="${task.id}" data-rikai="${r}">${r}</button>`;
  }).join('');
  const hasComment=task.comment&&task.comment.trim();
  const showComment=(task.rikai==='△'||task.rikai==='×'||hasComment);
  const dl=task.deadline?formatDeadlineShort(task.deadline):'';
  const isUrgent=task.deadline&&isDeadlineUrgent(task.deadline);
  return`<div class="task-card ${task.done?'done':''}" id="card-${task.id}" style="margin:0 16px 8px;">
    <div class="task-main">
      <div class="subject-bar ${k.bar}"></div>
      <div class="task-check ${task.done?'checked':''}" onclick="toggleDone('${task.id}')">${task.done?'✓':''}</div>
      <div class="task-info">
        <div class="task-name">${task.name}</div>
        <div class="task-meta">
          <span class="badge ${task.kind==='宿題'?'shukudai':'jishu'}">${task.kind}</span>
          ${dl?`<span class="deadline ${isUrgent?'urgent':''}">${dl}</span>`:''}
        </div>
      </div>
      <div class="rikai-group">${rikaiBtns}</div>
      <button class="btn-secondary" style="font-size:11px;padding:4px 8px;margin-left:4px;" onclick="editTask('${task.id}')">編集</button>
      <button class="btn-danger" onclick="deleteTask('${task.id}')">×</button>
    </div>
    <span class="comment-toggle" onclick="toggleComment('${task.id}')">${hasComment?'💬 コメントを見る・編集':'＋ コメント'}</span>
    <div class="task-comment ${showComment?'show':''}" id="comment-${task.id}">
      <div class="comment-label">メモ・コメント（子供・保護者どちらでも）</div>
      <textarea class="comment-input" data-id="${task.id}" placeholder="気づいたことや一言メモを書いてね">${task.comment||''}</textarea>
    </div>
  </div>`;
}

function attachTaskEvents() {
  document.querySelectorAll('.rikai-btn').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const id=btn.dataset.id; const rikai=btn.dataset.rikai;
      const data=await loadData(); const task=data.find(t=>t.id===id); if(!task)return;
      task.rikai=task.rikai===rikai?null:rikai;
      await saveData(data);
      const commentEl=document.getElementById('comment-'+id);
      if(task.rikai==='△'||task.rikai==='×') commentEl.classList.add('show');
      renderAll();
    });
  });
  document.querySelectorAll('.comment-input').forEach(el=>{
    el.addEventListener('blur',async()=>{
      const id=el.dataset.id; const data=await loadData(); const task=data.find(t=>t.id===id); if(!task)return;
      task.comment=el.value; await saveData(data);
    });
  });
}

function toggleComment(id) { document.getElementById('comment-'+id).classList.toggle('show'); }

async function toggleDone(id) {
  const data=await loadData(); const task=data.find(t=>t.id===id); if(!task)return;
  task.done=!task.done; await saveData(data); renderAll();
  if(task.done)showToast('✓ 完了！');
}

function formatDeadlineShort(dl) {
  const d=new Date(dl+'T00:00:00');
  const days=['日','月','火','水','木','金','土'];
  return`${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}
function isDeadlineUrgent(dl) {
  const today=new Date(); today.setHours(0,0,0,0);
  return(new Date(dl+'T00:00:00')-today)/86400000<=1;
}

async function renderSettings() {
  const templates=await loadTemplates();
  const bySubject={}; ['国語','算数','理科','社会'].forEach(s=>bySubject[s]=[]);
  templates.forEach(t=>{ if(bySubject[t.subject])bySubject[t.subject].push(t); });

    items.forEach((t,i)=>{

          <button onclick="moveTemplate('${t.id}','down')" style="background:none;border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:11px;cursor:pointer;${i===items.length-1?'opacity:0.3;pointer-events:none;':''}">↓</button>
        </div>
        <div class="template-edit-name">${t.name}</div>

      </div>`;
    });
    html+='</div>';
  });

}
async function moveTemplate(id, dir) {
  const templates=await loadTemplates();
  const idx=templates.findIndex(t=>t.id===id);
  if(idx===-1)return;
  const subject=templates[idx].subject;
  // 同じ科目内のインデックスを操作
  const subjectItems=templates.filter(t=>t.subject===subject);
  const subIdx=subjectItems.findIndex(t=>t.id===id);
  if(dir==='up'&&subIdx===0)return;
  if(dir==='down'&&subIdx===subjectItems.length-1)return;
  const swapItem=dir==='up'?subjectItems[subIdx-1]:subjectItems[subIdx+1];
  const swapIdx=templates.findIndex(t=>t.id===swapItem.id);
  // swap
  [templates[idx],templates[swapIdx]]=[templates[swapIdx],templates[idx]];
  await saveTemplates(templates);
  renderSettings();
}

async function toggleTemplateKind(id) {
  const templates=await loadTemplates(); const t=templates.find(x=>x.id===id); if(!t)return;
  t.kind=t.kind==='宿題'?'自習':'宿題'; await saveTemplates(templates); renderSettings();
}
async function deleteTemplate(id) {
  if(!confirm('このテンプレートを削除しますか？'))return;
  const templates=(await loadTemplates()).filter(t=>t.id!==id);
  await saveTemplates(templates); renderSettings();
}
async function addTemplateItem(subject) {
  const name=prompt(`${subject}に追加するテンプレート名を入力してください`);
  if(!name||!name.trim())return;
  const templates=await loadTemplates();
  templates.push({id:'tpl_'+Date.now(),subject,name:name.trim(),kind:'宿題'});
  await saveTemplates(templates); renderSettings();
}

async function renderBanners() {
  const tasks = await loadData();
  const now = new Date();
  const hour = now.getHours();
  const todayISO = getDateISO(now);

  // 今日の予定タスク
  const todayTasks = tasks.filter(t => t.deadline === todayISO);
  const todayUndone = todayTasks.filter(t => !t.done);

  // 期限切れ未完了（今日より前）
  const overdueTasks = tasks.filter(t => t.deadline && t.deadline < todayISO && !t.done);

  const area = document.getElementById('bannerArea');
  let html = '';

  // 期限切れバナー（最優先）
  if (overdueTasks.length > 0) {
    html += `<div class="banner danger" onclick="openOverdueModal()">
      <div class="banner-icon">🚨</div>
      <div class="banner-text">期限切れのタスクが${overdueTasks.length}件あります！<br>確認して完了チェックか予定日を変更してください。</div>
      <div class="banner-arrow">›</div>
      <div class="banner-close" onclick="event.stopPropagation();this.parentElement.remove()">×</div>
    </div>`;
  }

  // 今日の予定バナー
  if (todayTasks.length > 0) {
    if (hour >= 21 && todayUndone.length > 0) {
      // 21時以降・未完了あり
      html += `<div class="banner warning" onclick="openOverdueModalToday()">
        <div class="banner-icon">⏰</div>
        <div class="banner-text">今日の予定がまだ${todayUndone.length}件残っています。<br>予定日を変更しますか？</div>
        <div class="banner-arrow">›</div>
        <div class="banner-close" onclick="event.stopPropagation();this.parentElement.remove()">×</div>
      </div>`;
    } else if (todayUndone.length > 0) {
      // 通常時間帯・未完了あり
      html += `<div class="banner info" onclick="switchTab('schedule');closeAllBanners()">
        <div class="banner-icon">📅</div>
        <div class="banner-text">今日の予定が${todayUndone.length}件あります！</div>
        <div class="banner-arrow">›</div>
        <div class="banner-close" onclick="event.stopPropagation();this.parentElement.remove()">×</div>
      </div>`;
    } else {
      // 全完了
      html += `<div class="banner info" style="cursor:default;">
        <div class="banner-icon">🎉</div>
        <div class="banner-text">今日の予定はすべて完了！お疲れさま！</div>
        <div class="banner-close" onclick="this.parentElement.remove()">×</div>
      </div>`;
    }
  }

  area.innerHTML = html;
}

function closeAllBanners() {
  document.getElementById('bannerArea').innerHTML = '';
}

async function openOverdueModal() {
  const tasks = await loadData();
  const todayISO = getDateISO(new Date());
  const overdue = tasks.filter(t => t.deadline && t.deadline < todayISO && !t.done);
  renderOverdueList(overdue, false);
  document.getElementById('overdueModal').classList.add('show');
}

async function openOverdueModalToday() {
  const tasks = await loadData();
  const todayISO = getDateISO(new Date());
  const todayUndone = tasks.filter(t => t.deadline === todayISO && !t.done);
  renderOverdueList(todayUndone, true);
  document.getElementById('overdueModal').classList.add('show');
}

function renderOverdueList(tasks, isToday) {
  const list = document.getElementById('overdueList');
  if (tasks.length === 0) { list.innerHTML = '<div class="empty-state"><p>該当するタスクはありません。</p></div>'; return; }
  list.innerHTML = tasks.map(task => {
    const k = SUBJECT_KEYS[task.subject] || SUBJECT_KEYS['国語'];
    return `<div class="task-card" style="margin-bottom:8px;">
      <div class="task-main">
        <div class="subject-bar ${k.bar}"></div>
        <div class="task-check ${task.done?'checked':''}" onclick="toggleDoneInOverdue('${task.id}')" id="overdue-check-${task.id}">${task.done?'✓':''}</div>
        <div class="task-info">
          <div class="task-name">${task.name}</div>
          <div class="task-meta">
            <span class="badge ${task.kind==='宿題'?'shukudai':'jishu'}">${task.kind}</span>
            <span class="deadline urgent">${task.deadline?formatDeadlineShort(task.deadline):''}</span>
          </div>
        </div>
        <button class="btn-secondary" style="font-size:11px;padding:5px 8px;flex-shrink:0;" onclick="editTaskFromOverdue('${task.id}')">予定日変更</button>
      </div>
    </div>`;
  }).join('');
}

async function toggleDoneInOverdue(id) {
  const data = await loadData();
  const task = data.find(t => t.id === id);
  if (!task) return;
  task.done = !task.done;
  await saveData(data);
  // チェック表示を更新
  const check = document.getElementById('overdue-check-' + id);
  if (check) { check.classList.toggle('checked', task.done); check.textContent = task.done ? '✓' : ''; }
  if (task.done) showToast('✓ 完了！');
  renderAll();
}

async function editTaskFromOverdue(id) {
  closeModal('overdueModal');
  await editTask(id);
}

// ===== モーダル =====
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{ if(e.target===el)el.classList.remove('show'); });
});

// ===== トースト =====
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

// ===== 初期化 =====
async function initApp() {
  window._fbOnValue(window._fbRef(window._fbDb,'tasks'),(snapshot)=>{
    _cachedTasks=snapshot.exists()?(snapshot.val()||[]):[];
    updateWeekLabel();
    renderAll();
    renderBanners();
  });
}
</script>
