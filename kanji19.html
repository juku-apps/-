<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>漢字19回｜予習シリーズ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Kaisei+HarunoUmi:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--surface:#161b27;--card:#1e2535;--border:rgba(255,255,255,0.08);--accent:#06b6d4;--accent2:#0e7490;--green:#3dd68c;--red:#f05a5a;--blue:#4a9eff;--text:#e8eaf0;--muted:rgba(232,234,240,0.45);--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{max-width:600px;margin:0 auto;padding:0 16px 60px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;}
.header-title{font-family:'Kaisei HarunoUmi',serif;font-size:1.3rem;color:var(--accent);}
.header-sub{font-size:0.68rem;color:var(--muted);margin-top:2px;}
.reset-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:0.7rem;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;}
.reset-btn:hover{border-color:var(--red);color:var(--red);}
.tab-bar{display:flex;gap:8px;margin-bottom:20px;}
.tab-btn{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;text-align:center;}
.tab-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(6,182,212,0.08);}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.summary-label{font-size:0.7rem;color:var(--muted);letter-spacing:0.12em;margin-bottom:12px;}
.mastery-bar-wrap{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin-bottom:10px;}
.mastery-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px;transition:width 0.6s;}
.mastery-stats{display:flex;gap:20px;}
.stat-item{display:flex;flex-direction:column;gap:2px;}
.stat-num{font-family:'Kaisei HarunoUmi',serif;font-size:1.5rem;line-height:1;color:var(--accent);}
.stat-label{font-size:0.65rem;color:var(--muted);}
.section-label{font-size:0.7rem;color:var(--muted);letter-spacing:0.12em;margin:20px 0 10px;}
.question-list{display:flex;flex-direction:column;gap:6px;margin-bottom:100px;}
.q-item{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;gap:12px;}
.q-status{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:900;flex-shrink:0;}
.q-status.mastered{background:rgba(61,214,140,0.15);color:var(--green);border:1.5px solid var(--green);}
.q-status.learning{background:rgba(6,182,212,0.12);color:var(--accent);border:1.5px solid rgba(6,182,212,0.4);}
.q-status.new{background:rgba(255,255,255,0.04);color:var(--muted);border:1.5px solid var(--border);}
.q-info{flex:1;}
.q-kanji{font-size:1.1rem;font-weight:700;}
.q-reading{font-size:0.7rem;color:var(--muted);margin-top:1px;}
.q-count{font-size:0.68rem;color:var(--muted);}
.mastery-badge{display:inline-block;font-size:0.62rem;padding:2px 7px;border-radius:10px;margin-left:8px;vertical-align:middle;font-weight:700;}
.badge-new{background:rgba(74,158,255,0.15);color:var(--blue);}
.badge-learning{background:rgba(6,182,212,0.15);color:var(--accent);}
.badge-mastered{background:rgba(61,214,140,0.15);color:var(--green);}
.home-btns{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;padding:12px 16px 20px;background:linear-gradient(to top,var(--bg) 80%,transparent);display:flex;flex-direction:column;gap:8px;}
.study-btn{width:100%;background:linear-gradient(135deg,#001a2a,#000e1a);border:1.5px solid var(--accent);border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.study-btn:active{transform:scale(0.98);}
.start-row{display:flex;gap:8px;}
.start-btn{flex:1;background:linear-gradient(135deg,var(--accent2),#c04420);border:none;border-radius:14px;padding:14px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;}
.weak-btn{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;}
.weak-btn:disabled{opacity:0.35;cursor:default;}
.finish-btn{background:none;border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:5px 10px;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.75rem;cursor:pointer;white-space:nowrap;}
.finish-btn:hover{border-color:var(--accent);color:var(--accent);}
.kakitori-area{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:20px;margin-bottom:10px;text-align:center;}
.kakitori-hint{font-size:0.88rem;color:var(--muted);margin-bottom:14px;line-height:1.7;}
.kakitori-reveal-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:10px;padding:10px 24px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;cursor:pointer;margin-bottom:10px;}
.kakitori-answer{font-family:'Kaisei HarunoUmi',serif;font-size:2.5rem;color:var(--accent);font-weight:700;letter-spacing:0.2em;padding:10px 0;}
.kakitori-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.kakitori-ok{border:none;border-radius:12px;padding:18px;background:linear-gradient(135deg,#16a34a,#14532d);color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.kakitori-ng{border:none;border-radius:12px;padding:18px;background:linear-gradient(135deg,#dc2626,#7f1d1d);color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.ng-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.ng-item{background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.25);border-radius:10px;padding:10px 14px;font-size:0.85rem;line-height:1.6;}
.ng-item-ans{font-family:'Kaisei HarunoUmi',serif;font-size:1.2rem;color:var(--red);font-weight:700;margin-top:4px;}
.retry-kakitori-btn{width:100%;background:linear-gradient(135deg,#dc2626,#7f1d1d);border:none;border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:8px;}
.kakitori-complete{background:rgba(61,214,140,0.1);border:1px solid rgba(61,214,140,0.3);border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;}
.kakitori-complete-icon{font-size:2.5rem;margin-bottom:8px;}
.kakitori-complete-msg{font-size:1.1rem;font-weight:700;color:var(--green);}
.fav-home-btn{width:100%;background:rgba(251,191,36,0.08);border:1.5px solid rgba(251,191,36,0.35);border-radius:14px;padding:14px;color:#fbbf24;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;display:none;}
.fav-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.fav-item{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color 0.15s;}
.fav-item.checked{border-color:#fbbf24;background:rgba(251,191,36,0.07);}
.fav-check{font-size:1.2rem;flex-shrink:0;margin-top:2px;}
.fav-item-q{font-size:0.82rem;line-height:1.65;flex:1;}
.fav-item-ans{font-size:0.78rem;color:var(--green);font-weight:700;margin-top:3px;}
.fav-save-btn{width:100%;background:linear-gradient(135deg,#d97706,#92400e);border:none;border-radius:14px;padding:15px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;margin-bottom:8px;}
.fav-section{background:var(--card);border:1px solid rgba(251,191,36,0.25);border-radius:16px;padding:16px;margin-bottom:16px;}
.fav-section-title{font-size:0.7rem;color:#fbbf24;letter-spacing:0.1em;margin-bottom:12px;}
#study-screen{display:none;}
.study-nav{display:flex;align-items:center;gap:12px;padding:16px 0 12px;}
.back-icon{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 8px 4px 0;}
.study-progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.study-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));border-radius:2px;transition:width 0.4s;}
.study-progress-text{font-size:0.75rem;color:var(--muted);}
.kanji-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 24px;margin-bottom:16px;position:relative;overflow:hidden;}
.kanji-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(240,192,64,0.06),transparent 70%);pointer-events:none;}
.kanji-big{font-family:'Kaisei HarunoUmi',serif;font-size:5rem;color:var(--accent);text-align:center;line-height:1;margin-bottom:16px;text-shadow:0 0 40px rgba(240,192,64,0.3);}
.kanji-readings{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.reading-badge{background:rgba(240,192,64,0.1);border:1px solid rgba(240,192,64,0.25);border-radius:20px;padding:4px 14px;font-size:0.78rem;}
.reading-label{font-size:0.6rem;color:var(--muted);margin-right:4px;}
.reading-val{color:var(--accent);font-weight:700;}
.kanji-meanings{margin-bottom:20px;}
.meaning-title{font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:8px;}
.meaning-item{background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 14px;margin-bottom:6px;font-size:0.88rem;line-height:1.6;}
.kanji-examples{margin-bottom:8px;}
.example-title{font-size:0.68rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:8px;}
.example-list{display:flex;flex-direction:column;gap:6px;}
.example-item{display:flex;align-items:baseline;gap:8px;font-size:0.85rem;}
.example-word{font-weight:700;color:var(--text);min-width:90px;}
.example-meaning{color:var(--muted);font-size:0.8rem;line-height:1.5;}
.card-nav-row{display:flex;gap:10px;align-items:center;}
.prev-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;cursor:pointer;}
.next-card-btn{flex:1;background:linear-gradient(135deg,var(--blue),#2a5fa8);border:none;border-radius:12px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.study-complete{background:var(--card);border:1px solid rgba(61,214,140,0.3);border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;}
.complete-icon{font-size:2.5rem;margin-bottom:8px;}
.complete-msg{font-size:1rem;font-weight:700;color:var(--green);margin-bottom:4px;}
.complete-sub{font-size:0.8rem;color:var(--muted);}
.goto-quiz-row{display:flex;gap:8px;margin-top:16px;}
.goto-btn{flex:1;border:none;border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;}
.goto-renshu{background:linear-gradient(135deg,var(--accent2),#c04420);}
.goto-kakunin{background:linear-gradient(135deg,#3a6aaa,#2a4a8a);}
#quiz-screen{display:none;}
.quiz-header{display:flex;align-items:center;gap:12px;padding:16px 0 12px;}
.quiz-progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:2px;transition:width 0.4s;}
.quiz-progress-text{font-size:0.75rem;color:var(--muted);}
.mode-tag{display:inline-block;font-size:0.62rem;background:rgba(6,182,212,0.12);color:var(--accent);border:1px solid rgba(240,192,64,0.25);padding:3px 10px;border-radius:20px;letter-spacing:0.1em;margin-bottom:14px;font-weight:700;}
.quiz-card-q{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px 20px;margin-bottom:16px;}
.quiz-q{font-size:1rem;line-height:1.85;font-weight:500;white-space:pre-wrap;}
.hint-btn{background:none;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:5px 14px;color:var(--muted);font-size:0.72rem;cursor:pointer;margin-top:12px;font-family:'Zen Kaku Gothic New',sans-serif;}
.hint-btn:hover{border-color:var(--accent);color:var(--accent);}
.quiz-hint{font-size:0.72rem;color:var(--accent);margin-top:8px;display:none;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:16px 10px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(240,192,64,0.07);}
.choice-btn.correct{background:rgba(61,214,140,0.12);border-color:var(--green);color:var(--green);}
.choice-btn.wrong{background:rgba(240,90,90,0.1);border-color:var(--red);color:var(--red);}
.choice-btn:disabled{cursor:default;}
.input-area{margin-bottom:12px;}
.feedback{border-radius:14px;padding:14px 18px;margin-bottom:12px;font-size:0.85rem;line-height:1.75;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:rgba(61,214,140,0.1);border:1px solid rgba(61,214,140,0.3);}
.feedback.ng{background:rgba(240,90,90,0.08);border:1px solid rgba(240,90,90,0.25);}
.fb-title{font-weight:700;font-size:0.95rem;margin-bottom:4px;}
.feedback.ok .fb-title{color:var(--green);}
.feedback.ng .fb-title{color:var(--red);}
.next-btn{width:100%;background:var(--accent2);border:none;border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;display:none;}
.next-btn.show{display:block;}
#result-screen{display:none;}
.result-wrap{padding:20px 0;}
.result-top{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:16px;}
.result-circle{width:90px;height:90px;border-radius:50%;border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;background:rgba(240,192,64,0.06);}
.result-num{font-family:'Kaisei HarunoUmi',serif;font-size:2rem;color:var(--accent);line-height:1;}
.result-denom{font-size:0.7rem;color:var(--muted);}
.result-msg{font-size:1rem;font-weight:700;line-height:1.6;}
.result-sub{font-size:0.8rem;color:var(--muted);margin-top:6px;line-height:1.6;}
.updated-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
.updated-title{font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;}
.updated-list{display:flex;flex-direction:column;gap:6px;}
.updated-item{display:flex;align-items:center;gap:10px;font-size:0.85rem;}
.updated-arrow{color:var(--muted);font-size:0.7rem;}
.updated-new{color:var(--green);font-weight:700;}
.review-section{background:var(--card);border:1px solid rgba(240,90,90,0.2);border-radius:16px;padding:16px;margin-bottom:20px;}
.review-title{font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;}
.review-item{border-bottom:1px solid var(--border);padding:8px 0;font-size:0.82rem;line-height:1.7;}
.review-item:last-child{border-bottom:none;}
.review-answer{font-weight:700;color:var(--accent);}
.result-btns{display:flex;flex-direction:column;gap:8px;}
.retry-btn{width:100%;background:linear-gradient(135deg,var(--accent2),#c04420);border:none;border-radius:14px;padding:16px;color:white;font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;}
.home-btn-r{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif;font-size:0.9rem;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
<div id="home-screen">
  <div class="header">
    <div><div class="header-title">漢字 第19回</div><div class="header-sub">予習シリーズ ｜ 姿・視・詞・誌・磁・射・捨・尺・若・樹</div></div>
    <button class="reset-btn" onclick="confirmReset()">リセット</button>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-renshu" onclick="switchTab('renshu')">📝 練習問題</button>
    <button class="tab-btn" id="tab-kakitori" onclick="switchTab('kakitori')">✏️ 書き取り</button>
  </div>
  <div class="summary-card">
    <div class="summary-label">MASTERY PROGRESS</div>
    <div class="mastery-bar-wrap"><div class="mastery-bar-fill" id="home-bar" style="width:0%"></div></div>
    <div class="mastery-stats">
      <div class="stat-item"><div class="stat-num" id="stat-mastered">0</div><div class="stat-label">習得済み</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-learning">0</div><div class="stat-label">練習中</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-new">0</div><div class="stat-label">未挑戦</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-total">0</div><div class="stat-label">合計</div></div>
    </div>
  </div>
  <div class="section-label">KANJI LIST</div>
  <div class="question-list" id="question-list"></div>
  <div class="home-btns">
    <button class="study-btn" onclick="startStudy()">📖 漢字を学習する</button>
    <div class="start-row">
      <button class="start-btn" onclick="startAllMode()">▶ 全問スタート</button>
      <button class="weak-btn" id="weak-btn" onclick="startWeakMode()">⚡ 未習得</button>
    </div>
    <button class="fav-home-btn" id="fav-btn" onclick="startFavMode()">⭐ お気に入りを復習</button>
    <button class="weak-btn" id="retry-home-btn" onclick="startRetryMode()" style="width:100%">🔁 解き直し</button>
  </div>
</div>

<div id="study-screen">
  <div class="study-nav">
    <button class="back-icon" onclick="goHome()">←</button>
    <div class="study-progress-bar"><div class="study-progress-fill" id="sp-fill" style="width:0%"></div></div>
    <div class="study-progress-text" id="sp-text">1 / 10</div>
  </div>
  <div id="kanji-card-area"></div>
  <div id="card-nav"></div>
</div>

<div id="quiz-screen">
  <div class="quiz-header">
    <button class="back-icon" onclick="goHome()">←</button>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="qp-fill" style="width:0%"></div></div>
    <div class="quiz-progress-text" id="qp-text">1/20</div>
    <button class="finish-btn" id="finish-btn" onclick="finishEarly()" style="display:none">終了</button>
  </div>
  <div class="mode-tag" id="mode-tag">練習問題</div>
  <div class="quiz-card-q">
    <div class="quiz-q" id="quiz-q"></div>
    <button class="hint-btn" id="hint-btn" onclick="showHint()">ヒントを見る</button>
    <div class="quiz-hint" id="quiz-hint"></div>
  </div>
  <div class="choices" id="choice-area"></div>
  <div class="input-area" id="input-area" style="display:none">
    <div class="kakitori-area">
      <div class="kakitori-hint" id="kakitori-hint">📓 ノートに漢字を書いてください</div>
      <button class="kakitori-reveal-btn" id="kakitori-reveal-btn" onclick="revealAnswer()">答えを見る</button>
      <div class="kakitori-answer" id="kakitori-answer" style="display:none"></div>
      <div class="kakitori-btns" id="kakitori-btns" style="display:none">
        <button class="kakitori-ok" onclick="kakitoriAnswer(true)">✅ 書けた！</button>
        <button class="kakitori-ng" onclick="kakitoriAnswer(false)">❌ 書けなかった</button>

const SK_R='kanji19-renshu',SK_K='kanji19-kakitori',SK_NG='kanji19-nglist',MASTERY=3;
function lD(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):{};}catch(e){return{};}}
function sD(k,d){try{localStorage.setItem(k,JSON.stringify(d));}catch(e){}}
function getM(k,id){const d=lD(k);return d[id]||{correct:0,attempt:0};}
function recR(k,id,ok){const d=lD(k);if(!d[id])d[id]={correct:0,attempt:0};d[id].attempt++;if(ok)d[id].correct++;sD(k,d);}
function getLv(k,id){const m=getM(k,id);if(m.correct>=MASTERY)return'mastered';if(m.attempt>0)return'learning';return'new';}
function loadNg(){try{const r=localStorage.getItem(SK_NG);return r?JSON.parse(r):[];}catch(e){return[];}}
function saveNg(ids){try{localStorage.setItem(SK_NG,JSON.stringify(ids));}catch(e){}}
function loadFav(){try{const r=localStorage.getItem(currentTab==='renshu'?SK_R+'-fav':SK_K+'-fav');return r?JSON.parse(r):[];}catch(e){return[];}}
function saveFav(ids){try{localStorage.setItem(currentTab==='renshu'?SK_R+'-fav':SK_K+'-fav',JSON.stringify(ids));}catch(e){}}
let currentTab='renshu',quizQueue=[],quizIndex=0,quizScore=0,quizAnswered=false,quizMode='all',sessionResults=[],studyIndex=0;
let kakitoriNgList=[],isRetryMode=false;
function getCK(){return currentTab==='renshu'?SK_R:SK_K;}
function getCQ(){return currentTab==='renshu'?RENSHU:KAKITORI;}
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tab-renshu').className='tab-btn'+(tab==='renshu'?' active':'');
  document.getElementById('tab-kakitori').className='tab-btn'+(tab==='kakitori'?' active':'');
  buildHome();
}
function buildHome(){
  const key=getCK(),qs=getCQ();let mastered=0,learning=0,newQ=0;
  qs.forEach(q=>{const lv=getLv(key,q.id);if(lv==='mastered')mastered++;else if(lv==='learning')learning++;else newQ++;});
  const total=qs.length;
  document.getElementById('stat-mastered').textContent=mastered;
  document.getElementById('stat-learning').textContent=learning;
  document.getElementById('stat-new').textContent=newQ;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('home-bar').style.width=`${Math.round(mastered/total*100)}%`;
  const unmastered=qs.filter(q=>getLv(key,q.id)!=='mastered');
  const wb=document.getElementById('weak-btn');
  if(wb){wb.disabled=unmastered.length===0;wb.textContent=`⚡ 未習得（${unmastered.length}）`;}
  const favIds=loadFav();const fb=document.getElementById('fav-btn');
  if(favIds.length>0){fb.style.display='block';fb.textContent=`⭐ お気に入りを復習（${favIds.length}問）`;}
  else{fb.style.display='none';}
  const ngIds=loadNg();const retryBtn2=document.getElementById('retry-home-btn');
  if(retryBtn2){if(ngIds.length>0){retryBtn2.textContent=`🔁 解き直し（${ngIds.length}問）`;retryBtn2.style.opacity='1';}
  else{retryBtn2.textContent='🔁 解き直し';retryBtn2.style.opacity='0.5';}}
  const list=document.getElementById('question-list');list.innerHTML='';
  const kanjiMap={};
  qs.forEach(q=>{
    if(!kanjiMap[q.kanji])kanjiMap[q.kanji]={kanji:q.kanji,reading:q.reading,ids:[],correct:0,total:0};
    const km=kanjiMap[q.kanji];km.ids.push(q.id);
    const m=getM(key,q.id);km.correct+=m.correct;km.total+=MASTERY;
  });
  Object.values(kanjiMap).forEach(km=>{
    const allMastered=km.ids.every(id=>getLv(key,id)==='mastered');
    const anyLearning=km.ids.some(id=>getLv(key,id)==='learning');
    const lv=allMastered?'mastered':anyLearning?'learning':'new';
    const div=document.createElement('div');div.className='q-item';
    div.innerHTML=`<div class="q-status ${lv}">${lv==='mastered'?'✓':km.correct}</div><div class="q-info"><div class="q-kanji">${km.kanji}<span class="mastery-badge badge-${lv}">${lv==='mastered'?'習得済':lv==='learning'?'練習中':'未挑戦'}</span></div><div class="q-reading">${km.reading}</div></div><div class="q-count">${km.correct}/${km.total}</div>`;
    list.appendChild(div);});
}
function confirmReset(){if(confirm('習熟度をリセットしますか？')){localStorage.removeItem(SK_R);localStorage.removeItem(SK_K);localStorage.removeItem(SK_R+'-fav');localStorage.removeItem(SK_K+'-fav');localStorage.removeItem(SK_NG);buildHome();}}
function startStudy(){studyIndex=0;showScreen('study-screen');renderCard();}
function renderCard(){
  const k=KANJI_DATA[studyIndex],total=KANJI_DATA.length;
  document.getElementById('sp-fill').style.width=`${studyIndex/total*100}%`;
  document.getElementById('sp-text').textContent=`${studyIndex+1} / ${total}`;
  const mHtml=k.meanings.map(m=>`<div class="meaning-item">● ${m.text}</div>`).join('');
  const eHtml=k.examples.map(e=>`<div class="example-item"><span class="example-word">${e.word}（${e.reading}）</span><span class="example-meaning">${e.meaning}</span></div>`).join('');
  document.getElementById('kanji-card-area').innerHTML=`<div class="kanji-card"><div class="kanji-big">${k.kanji}</div><div class="kanji-readings"><div class="reading-badge"><span class="reading-label">音</span><span class="reading-val">${k.on}</span></div><div class="reading-badge"><span class="reading-label">訓</span><span class="reading-val">${k.kun}</span></div></div><div class="kanji-meanings"><div class="meaning-title">意　味</div>${mHtml}</div><div class="kanji-examples"><div class="example-title">用　例</div><div class="example-list">${eHtml}</div></div></div>`;
  const isLast=studyIndex===total-1;
  document.getElementById('card-nav').innerHTML=isLast?`<div class="study-complete"><div class="complete-icon">🎉</div><div class="complete-msg">10字の学習完了！</div><div class="complete-sub">次は問題にチャレンジしよう</div><div class="goto-quiz-row"><button class="goto-btn goto-renshu" onclick="startFromStudy('renshu')">📝 練習問題へ</button><button class="goto-btn goto-kakunin" onclick="startFromStudy('kakitori')">✏️ 書き取りへ</button></div></div><div class="card-nav-row">${studyIndex>0?'<button class="prev-btn" onclick="prevCard()">← 前へ</button>':'<div></div>'}<button class="next-card-btn" style="background:var(--card);border:1px solid var(--border);color:var(--muted);" disabled>最後のカードです</button></div>`:
    `<div class="card-nav-row">${studyIndex>0?'<button class="prev-btn" onclick="prevCard()">← 前へ</button>':'<div></div>'}<button class="next-card-btn" onclick="nextCard()">次のカード →</button></div>`;
  window.scrollTo(0,0);
}
function nextCard(){if(studyIndex<KANJI_DATA.length-1){studyIndex++;renderCard();}}
function prevCard(){if(studyIndex>0){studyIndex--;renderCard();}}
function startFromStudy(tab){currentTab=tab;document.getElementById('tab-renshu').className='tab-btn'+(tab==='renshu'?' active':'');document.getElementById('tab-kakitori').className='tab-btn'+(tab==='kakitori'?' active':'');startAllMode();}
function shuffle(arr){return[...arr].sort(()=>Math.random()-0.5);}
function startAllMode(){quizQueue=shuffle(getCQ());quizMode='all';startQuizCommon();}
function startWeakMode(){
  const key=getCK(),qs=getCQ();
  quizQueue=shuffle(qs.filter(q=>getLv(key,q.id)!=='mastered'));
  if(quizQueue.length===0){alert('未習得の問題がありません');return;}
  quizMode='weak';startQuizCommon();
}
function startFavMode(){
  const favIds=loadFav(),qs=getCQ();
  quizQueue=shuffle(qs.filter(q=>favIds.includes(q.id)));
  if(quizQueue.length===0){alert('お気に入りの問題がありません');return;}
  quizMode='fav';startQuizCommon();
}
function startQuizCommon(){
  quizIndex=0;quizScore=0;quizAnswered=false;sessionResults=[];kakitoriNgList=[];isRetryMode=false;
  showScreen('quiz-screen');renderQ();
}
function startKakitoriRetry(){
  quizQueue=[...kakitoriNgList];quizIndex=0;quizScore=0;quizAnswered=false;sessionResults=[];kakitoriNgList=[];isRetryMode=true;
  showScreen('quiz-screen');renderQ();
}
function renderQ(){
  const q=quizQueue[quizIndex],total=quizQueue.length;
  document.getElementById('qp-fill').style.width=`${quizIndex/total*100}%`;
  document.getElementById('qp-text').textContent=`${quizIndex+1}/${total}`;
  const mLabel=currentTab==='kakitori'?(isRetryMode?'✏️ 書き取り復習':'✏️ 書き取り'):(quizMode==='fav'?'⭐ お気に入り復習':'練習問題（選択式）');
  document.getElementById('mode-tag').textContent=mLabel;
  const dispQ=currentTab==='kakitori'?q.q.replace(/\nカタカナを漢字に。/g,'').replace(/（[^）]+）/g,'').trim():q.q;
  document.getElementById('quiz-q').textContent=dispQ;
  document.getElementById('quiz-hint').textContent=`ヒント：${q.hint}`;
  document.getElementById('quiz-hint').style.display='none';
  document.getElementById('hint-btn').style.display='inline-block';
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').className='next-btn';
  quizAnswered=false;
  const finBtn=document.getElementById('finish-btn');
  if(finBtn)finBtn.style.display=currentTab==='kakitori'?'inline-block':'none';
  if(currentTab==='kakitori'){
    document.getElementById('choice-area').style.display='none';
    document.getElementById('input-area').style.display='block';
    document.getElementById('kakitori-hint').textContent='📓 ノートに漢字を書いてください';
    document.getElementById('kakitori-answer').style.display='none';
    document.getElementById('kakitori-answer').textContent='';
    document.getElementById('kakitori-reveal-btn').style.display='inline-block';
    document.getElementById('kakitori-btns').style.display='none';
  }else{
    document.getElementById('choice-area').style.display='grid';
    document.getElementById('input-area').style.display='none';
    const area=document.getElementById('choice-area');area.innerHTML='';
    shuffle(q.choices||[]).forEach(opt=>{const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=opt;btn.onclick=()=>selC(btn,opt,q);area.appendChild(btn);});
  }
}
function revealAnswer(){
  const q=quizQueue[quizIndex];
  document.getElementById('kakitori-answer').textContent=q.answer;
  document.getElementById('kakitori-answer').style.display='block';
  document.getElementById('kakitori-reveal-btn').style.display='none';
  document.getElementById('kakitori-btns').style.display='grid';
}
function kakitoriAnswer(ok){
  if(quizAnswered)return;quizAnswered=true;
  const q=quizQueue[quizIndex],key=getCK(),prev=getLv(key,q.id);
  recR(key,q.id,ok);const newLv=getLv(key,q.id);
  sessionResults.push({q,wasCorrect:ok,prevLv:prev,newLv});
  if(ok){quizScore++;}else{kakitoriNgList.push(q);}
  const fb=document.getElementById('feedback');
  document.getElementById('fb-title').textContent=ok?'✅ 書けた！'+(newLv==='mastered'?'　🎉 習得達成！':''):'❌ 書けなかった…　次回また挑戦！';
  document.getElementById('fb-body').textContent=ok?`正解：${q.answer}　${q.explain}`:`正解：${q.answer}　（${q.hint}）`;
  fb.className='feedback show '+(ok?'ok':'ng');
  document.getElementById('next-btn').className='next-btn show';
  document.getElementById('next-btn').textContent=quizIndex<quizQueue.length-1?'次の問題 →':'結果を見る';
}
function selC(btn,opt,q){
  if(quizAnswered)return;quizAnswered=true;
  const key=getCK(),prev=getLv(key,q.id),ok=opt===q.answer;
  recR(key,q.id,ok);const newLv=getLv(key,q.id);
  sessionResults.push({q,wasCorrect:ok,prevLv:prev,newLv});
  if(ok){quizScore++;btn.classList.add('correct');}
  else{btn.classList.add('wrong');document.querySelectorAll('.choice-btn').forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct');});}
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const fb=document.getElementById('feedback');
  document.getElementById('fb-title').textContent=ok?'✓ 正解！'+(newLv==='mastered'?'　🎉 習得達成！':''):`✗ 不正解　正解：${q.answer}`;
  document.getElementById('fb-body').textContent=q.explain||'';
  fb.className='feedback show '+(ok?'ok':'ng');
  document.getElementById('next-btn').className='next-btn show';
}
function showHint(){document.getElementById('quiz-hint').style.display='block';document.getElementById('hint-btn').style.display='none';}
function nextQ(){quizIndex++;if(quizIndex>=quizQueue.length)showResult();else{renderQ();window.scrollTo(0,0);}}
function showResult(){
  showScreen('result-screen');
  const total=quizQueue.length,pct=Math.round(quizScore/total*100);
  document.getElementById('r-score').textContent=quizScore;
  document.getElementById('r-total').textContent=`/${total}問`;
  const[msg,sub]=pct===100?['🎉 全問クリア！','全部書けました！すごい！']:pct>=80?['👏 よくできました！',`あと${total-quizScore}問！`]:pct>=60?['🙆 まずまず！','書けなかった問題を復習しよう！']:['💪 もう一度！','書けなかった問題から始めよう！'];
  document.getElementById('r-msg').textContent=msg;document.getElementById('r-sub').textContent=sub;
  const upgraded=sessionResults.filter(r=>r.wasCorrect&&r.prevLv!==r.newLv);
  const us=document.getElementById('updated-section');
  if(upgraded.length>0){const ll={new:'未挑戦',learning:'練習中',mastered:'習得済み✓'};us.style.display='block';us.innerHTML=`<div class="updated-title">▲ 習熟度アップ！</div><div class="updated-list">`+upgraded.map(r=>`<div class="updated-item"><span>${r.q.answer}</span><span class="updated-arrow">→</span><span class="updated-new">${ll[r.newLv]}</span></div>`).join('')+'</div>';}
  else{us.style.display='none';}
  const rs=document.getElementById('review-section');
  if(currentTab==='kakitori'&&kakitoriNgList.length>0){
    saveNg(kakitoriNgList.map(q=>q.id));
    rs.style.display='block';
    rs.innerHTML=`<div class="review-title">❌ 書けなかった問題（${kakitoriNgList.length}問）</div><div class="ng-list">`+kakitoriNgList.map(q=>`<div class="ng-item">${q.q.replace(/\n/g,'<br>')}<div class="ng-item-ans">${q.answer}</div></div>`).join('')+'</div><button class="retry-kakitori-btn" onclick="startKakitoriRetry()">✏️ 書けなかった問題をもう一度</button>';
  }else if(!kakitoriNgList.length&&currentTab==='kakitori'){
    saveNg([]);rs.style.display='block';
    rs.innerHTML=`<div class="kakitori-complete"><div class="kakitori-complete-icon">🎊</div><div class="kakitori-complete-msg">全問書けました！完璧です！</div></div>`;
  }else{
    const wrong=sessionResults.filter(r=>!r.wasCorrect);
    if(wrong.length>0){rs.style.display='block';rs.innerHTML=`<div class="review-title">▼ 間違えた問題</div>`+wrong.map(r=>`<div class="review-item"><span class="review-answer">正解：${r.q.answer}</span>（${r.q.hint}）<br>${r.q.q}</div>`).join('');}
    else{rs.style.display='none';}
  }
  const favSec=document.getElementById('fav-section');
  if(currentTab==='kakitori'&&favSec){
    favSec.style.display='block';
    const allQ=getCQ();
    favSec.innerHTML='<div class="fav-section-title">⭐ お気に入りに登録する問題を選んでください</div><div class="fav-list" id="fav-list">'+allQ.map(q=>'<div class="fav-item" id="fi-'+q.id+'" onclick="toggleFavItem(\''+q.id+'\')"><span class="fav-check" id="fc-'+q.id+'">☆</span><div class="fav-item-q">'+q.q.replace(/\n/g,'<br>')+'<div class="fav-item-ans">正解：'+q.answer+'</div></div></div>').join('')+'</div><button class="fav-save-btn" onclick="saveFavFromList()">⭐ チェックした問題をお気に入り登録</button>';
  }else if(favSec){favSec.style.display='none';}
  document.getElementById('retry-btn').onclick=()=>{startAllMode();};
}
function toggleFavItem(id){const el=document.getElementById('fi-'+id);const ic=document.getElementById('fc-'+id);if(!el)return;el.classList.toggle('checked');ic.textContent=el.classList.contains('checked')?'⭐':'☆';}
function saveFavFromList(){const checked=[...document.querySelectorAll('.fav-item.checked')].map(el=>el.id.replace('fi-',''));saveFav(checked);const fb=document.getElementById('fav-btn');if(checked.length>0){fb.style.display='block';fb.textContent=`⭐ お気に入りを復習（${checked.length}問）`;}else{fb.style.display='none';}alert(`${checked.length}問をお気に入りに登録しました！`);}
function finishEarly(){
  for(let i=quizIndex+(quizAnswered?1:0);i<quizQueue.length;i++){
    const q=quizQueue[i],key=getCK(),prev=getLv(key,q.id);
    recR(key,q.id,false);const newLv=getLv(key,q.id);
    sessionResults.push({q,wasCorrect:false,prevLv:prev,newLv});kakitoriNgList.push(q);
  }
  if(!quizAnswered&&quizIndex<quizQueue.length){
    const q=quizQueue[quizIndex],key=getCK(),prev=getLv(key,q.id);
    recR(key,q.id,false);const newLv=getLv(key,q.id);
    sessionResults.push({q,wasCorrect:false,prevLv:prev,newLv});kakitoriNgList.push(q);
  }
  showResult();
}
function startRetryMode(){
  const ngIds=loadNg(),qs=getCQ(),ngQ=qs.filter(q=>ngIds.includes(q.id));
  if(ngQ.length===0){alert('解き直しの問題がありません。\n書き取りを解いてから使ってください。');return;}
  quizQueue=shuffle(ngQ);quizMode='retry';startQuizCommon();
}
function showScreen(id){['home-screen','study-screen','quiz-screen','result-screen'].forEach(s=>{document.getElementById(s).style.display=s===id?'block':'none';});}
function goHome(){buildHome();showScreen('home-screen');}
buildHome();showScreen('home-screen');
</script>
