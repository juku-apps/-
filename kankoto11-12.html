<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>漢コト 11-12回</title>
<style>
:root {
  --bg: #0f172a; --surface: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1);
  --accent: #f472b6; --accent2: #be185d; --green: #22c55e; --red: #ef4444;
  --orange: #f97316; --text: #f1f5f9; --muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#0f3460 100%); min-height: 100vh; font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; color: var(--text); padding: 16px; }
.wrap { max-width: 600px; margin: 0 auto; }

/* HOME */
.home-title { text-align: center; padding: 36px 0 28px; }
.home-title-main { font-size: 36px; font-weight: 900; letter-spacing: 0.1em; color: var(--accent); text-shadow: 0 0 40px rgba(244,114,182,0.5); }
.home-title-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
.section-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .1em; margin: 20px 0 10px; }
.home-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 20px 18px; border-radius: 16px; border: 1px solid var(--border); cursor: pointer; margin-bottom: 12px; text-align: left; color: var(--text); }
.home-btn-pink { background: linear-gradient(135deg,#4a1236,#9d174d); box-shadow: 0 6px 24px rgba(244,114,182,0.2); }
.home-btn-purple { background: linear-gradient(135deg,#2e1065,#5b21b6); box-shadow: 0 6px 24px rgba(139,92,246,0.2); }
.home-btn-orange { background: linear-gradient(135deg,#7c2d12,#c2410c); box-shadow: 0 6px 24px rgba(249,115,22,0.2); }
.home-btn-gray { background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
.btn-icon { font-size: 30px; flex-shrink: 0; }
.btn-name { font-size: 17px; font-weight: 800; margin-bottom: 3px; }
.btn-note { font-size: 12px; color: var(--muted); }
.redo-count { font-size: 11px; color: #fed7aa; background: rgba(249,115,22,0.2); padding: 2px 8px; border-radius: 99px; margin-left: 6px; }
.reset-btn { width: 100%; padding: 10px; border-radius: 10px; background: none; border: 1px solid rgba(239,68,68,0.3); color: rgba(239,68,68,0.6); font-size: 12px; cursor: pointer; margin-top: 8px; }

/* STUDY */
.study-wrap { padding-top: 8px; }
.back-btn { background: none; border: none; color: var(--accent); font-size: 14px; cursor: pointer; margin-bottom: 16px; padding: 4px 0; }
.prog-bar { height: 5px; background: rgba(255,255,255,0.08); border-radius: 99px; margin-bottom: 14px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg,var(--accent),var(--accent2)); border-radius: 99px; transition: width 0.3s; }
.study-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.study-badge { font-size: 11px; font-weight: 700; color: var(--accent); background: rgba(244,114,182,0.12); padding: 3px 10px; border-radius: 99px; }
.study-counter { font-size: 12px; color: var(--muted); }
.study-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 22px; margin-bottom: 16px; }
.study-word { font-size: 2rem; font-weight: 900; margin-bottom: 6px; letter-spacing: 0.05em; }
.study-read { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }
.study-divider { height: 1px; background: var(--border); margin-bottom: 16px; }
.study-meaning { font-size: 0.95rem; line-height: 1.8; color: var(--text); margin-bottom: 12px; }
.study-ex { font-size: 0.82rem; color: var(--accent); line-height: 1.7; padding: 10px 14px; background: rgba(244,114,182,0.06); border-radius: 10px; border-left: 3px solid var(--accent2); }
.study-next-btn { width: 100%; padding: 14px; border-radius: 12px; background: linear-gradient(135deg,var(--accent2),#9d174d); color: #fff; font-weight: 800; font-size: 16px; border: none; cursor: pointer; }
.study-done { text-align: center; padding: 32px 0; }
.study-done-title { font-size: 1.4rem; font-weight: 900; color: var(--accent); margin-bottom: 8px; }
.study-done-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; }

/* QUIZ */
.quiz-wrap { padding-top: 8px; }
.q-box { background: var(--surface); border-radius: 16px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--border); }
.q-label { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
.q-text { font-size: 1rem; line-height: 1.8; font-weight: 600; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.choice-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); cursor: pointer; color: var(--text); text-align: left; font-size: 13px; font-weight: 600; font-family: inherit; }
.choice-btn:disabled { cursor: default; }
.choice-num { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; color: var(--accent); min-width: 24px; }
.choice-ok { border-color: var(--green)!important; background: rgba(34,197,94,0.12)!important; color: #86efac; }
.choice-ng { border-color: var(--red)!important; background: rgba(239,68,68,0.12)!important; color: #fca5a5; }
.choice-dim { opacity: 0.35; }
.exp-box { background: var(--surface); border-radius: 14px; padding: 16px; border: 1px solid var(--border); margin-top: 4px; }
.exp-tag { font-size: 14px; font-weight: 800; margin-bottom: 8px; }
.exp-text { font-size: 12px; color: var(--muted); line-height: 1.8; margin-bottom: 12px; }
.ai-hint { background: rgba(96,165,250,0.07); border: 1px solid rgba(96,165,250,0.2); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #bfdbfe; line-height: 1.7; margin-bottom: 12px; }
.ai-hint-label { font-size: 10px; font-weight: 700; color: #60a5fa; display: block; margin-bottom: 3px; }
.next-btn { width: 100%; padding: 13px; border-radius: 12px; background: linear-gradient(135deg,#2563eb,#1d4ed8); color: #fff; font-weight: 800; font-size: 15px; border: none; cursor: pointer; }
.quit-btn { width: 100%; padding: 10px; border-radius: 10px; background: none; border: 1px solid var(--border); color: var(--muted); font-size: 13px; cursor: pointer; margin-top: 8px; margin-bottom: 14px; }

/* RESULT */
.result-score { text-align: center; background: var(--surface); border-radius: 18px; padding: 28px 20px; border: 1px solid var(--border); margin-bottom: 24px; }
.score-num { font-size: 60px; font-weight: 900; line-height: 1; margin-bottom: 6px; }
.score-total { font-size: 24px; color: var(--muted); }
.score-msg { font-size: 16px; color: var(--accent); font-weight: 700; }
.res-item { padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; background: var(--surface); border-left: 4px solid transparent; }
.res-q { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.res-a { font-size: 13px; font-weight: 700; }
.res-wrong { color: #f87171; font-weight: 400; font-size: 11px; }
.result-actions { display: flex; gap: 10px; margin-bottom: 14px; }
.again-btn { flex: 1; padding: 13px; border-radius: 12px; background: linear-gradient(135deg,#2563eb,#1d4ed8); color: #fff; font-weight: 800; font-size: 15px; border: none; cursor: pointer; }
.top-btn { flex: 1; padding: 13px; border-radius: 12px; background: rgba(255,255,255,0.07); color: #fff; font-weight: 800; font-size: 15px; border: 1px solid var(--border); cursor: pointer; }
.redo-result-btn { width: 100%; padding: 13px; border-radius: 12px; background: linear-gradient(135deg,#7c2d12,#c2410c); color: #fff; font-weight: 800; font-size: 15px; border: none; cursor: pointer; margin-bottom: 32px; }

.hidden { display: none!important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <div id="screen-home">
    <div class="home-title">
      <div class="home-title-main">漢コト 11-12</div>
      <div class="home-title-sub">和語③ · 慣用句③</div>
    </div>

    <div class="section-label">📖 学習</div>
    <button class="home-btn home-btn-pink" onclick="startStudy('和語③')">
      <span class="btn-icon">📖</span>
      <div><div class="btn-name">和語③を学ぶ</div><div class="btn-note">21語 · 一語ずつ意味を確認</div></div>
    </button>
    <button class="home-btn home-btn-purple" onclick="startStudy('慣用句③')">
      <span class="btn-icon">🗣️</span>
      <div><div class="btn-name">慣用句③を学ぶ</div><div class="btn-note">38語 · 一語ずつ意味を確認</div></div>
    </button>

    <div class="section-label">📝 クイズ</div>
    <button class="home-btn home-btn-pink" onclick="startQuiz('和語③')">
      <span class="btn-icon">✏️</span>
      <div><div class="btn-name">和語③ クイズ</div><div class="btn-note">全21問 · 意味を選ぶ</div></div>
    </button>
    <button class="home-btn home-btn-purple" onclick="startQuiz('慣用句③')">
      <span class="btn-icon">✏️</span>
      <div><div class="btn-name">慣用句③ クイズ</div><div class="btn-note">全38問 · 意味を選ぶ</div></div>
    </button>

    <div class="section-label">🔁 復習</div>
    <button class="home-btn home-btn-orange" id="redo-home-btn" onclick="startRedoQuiz()" style="display:none">
      <span class="btn-icon">🔁</span>
      <div><div class="btn-name">解き直し <span class="redo-count" id="redo-home-count"></span></div><div class="btn-note">間違えた問題を累積復習</div></div>
    </button>

    <button class="reset-btn" id="reset-btn1" onclick="doReset()">🗑️ 全データをリセット（初期化）</button>
  </div>

  <!-- STUDY -->
  <div id="screen-study" class="hidden">
    <div class="study-wrap">
      <button class="back-btn" onclick="showHome()">← もどる</button>
      <div class="prog-bar"><div class="prog-fill" id="study-prog"></div></div>
      <div class="study-meta">
        <span class="study-badge" id="study-badge"></span>
        <span class="study-counter" id="study-counter"></span>
      </div>
      <div id="study-card-area"></div>
      <button class="study-next-btn" id="study-next-btn" onclick="studyNext()">次へ →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-wrap">
      <button class="back-btn" onclick="showHome()">← もどる</button>
      <div class="prog-bar"><div class="prog-fill" id="quiz-prog"></div></div>
      <div class="study-meta">
        <span class="study-badge" id="quiz-badge"></span>
        <span class="study-counter" id="quiz-counter"></span>
      </div>
      <div class="q-box">
        <div class="q-label">意味を選んでください</div>
        <div class="q-text" id="q-text"></div>
      </div>
      <div class="choices" id="choices"></div>
      <button class="quit-btn" id="quit-btn" onclick="quitQuiz()">終了する →</button>
      <div id="exp-area" class="hidden">
        <div class="exp-box">
          <div class="exp-tag" id="exp-tag"></div>
          <div class="exp-text" id="exp-text"></div>
          <div class="ai-hint hidden" id="ai-hint-box"><span class="ai-hint-label">💡 ポイント</span><span id="ai-hint-text"></span></div>
          <button class="next-btn" id="next-btn" onclick="quizNext()">次の問題 →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="hidden">
    <button class="back-btn" onclick="showHome()">← もどる</button>
    <div class="result-score">
      <div class="score-num" id="score-num"></div>
      <div class="score-msg" id="score-msg"></div>
    </div>
    <div id="answer-list"></div>
    <div class="result-actions">
      <button class="again-btn" onclick="retryQuiz()">もう一度</button>
      <button class="top-btn" onclick="showHome()">トップへ</button>
    </div>
    <button class="redo-result-btn hidden" id="redo-result-btn" onclick="startRedoQuiz()">🔁 間違えた問題を解き直す</button>
  </div>

</div>
<script>
// ===== データ =====
const WORDS = [
  // 和語③
  {id:'w01',cat:'和語③',word:'ありきたり',read:'ありきたり',
   meaning:'元からあること。珍しくないこと。ありふれていること。',
   ex:'「ありきたりな意見ばかりでつまらない」'},
  {id:'w02',cat:'和語③',word:'いそいそ',read:'いそいそ',
   meaning:'喜び勇んで、うれしいことがあって動作がはずむさま。',
   ex:'「兄はいそいそとデートに出かけていった」'},
  {id:'w03',cat:'和語③',word:'うちひしがれる',read:'うちひしがれる',

  {id:'w04',cat:'和語③',word:'おおむね',read:'おおむね',
   meaning:'だいたいの趣旨。おおよそ。あらまし。',
   ex:'「四谷君の意見にはおおむね賛成です」'},
  {id:'w05',cat:'和語③',word:'おずおず',read:'おずおず',
   meaning:'恐れてためらいながら。こわごわ。',
   ex:'「自信はないが、指名されたので先生の質問におずおず答える」'},
  {id:'w06',cat:'和語③',word:'おもいあまる',read:'おもいあまる',
   meaning:'どうしたらよいかわからない。自分だけでは答えが出せない状態。',
   ex:'「さんざん悩んで、おもいあまって母に秘密を打ち明けた」'},
  {id:'w07',cat:'和語③',word:'ぎくしゃく',read:'ぎくしゃく',
   meaning:'話し方や動作、また物事の関係などがなめらかでないさま。',
   ex:'「大喧嘩して以来、彼とはぎくしゃくした関係が続いている」'},
  {id:'w08',cat:'和語③',word:'けおされる',read:'けおされる',
   meaning:'相手の勢いに押される。相手の剣幕に精神的に圧倒されてしまう。',

  {id:'w09',cat:'和語③',word:'しいる',read:'しいる',
   meaning:'相手の意向を無視して、むりにやらせる。強制する。',
   ex:'「優勝候補の選手が、予想外の苦戦をしいられている」'},
  {id:'w10',cat:'和語③',word:'すねる',read:'すねる',
   meaning:'素直に人に従わないで、不平がましい態度をとる。',
   ex:'「弟は自分の思い通りにならないことがあるとすねる」'},
  {id:'w11',cat:'和語③',word:'せとぎわ',read:'せとぎわ',
   meaning:'勝負・成否・生死などの分かれ目。',
   ex:'「勝つか負けるかのせとぎわに立っている」'},
  {id:'w12',cat:'和語③',word:'つくづく',read:'つくづく',
   meaning:'念を入れて観察したり、よく考えたりするさま。じっくり。',

  {id:'w13',cat:'和語③',word:'とりとめのない',read:'とりとめのない',
   meaning:'まとまりがない。つかみどころがない。',
   ex:'「負けたからといって、とりとめのない言い訳ばかり言う」'},
  {id:'w14',cat:'和語③',word:'ぬかりなく',read:'ぬかりなく',
   meaning:'油断や手落ちがない。万事に手落ちなく進める。',
   ex:'「作戦は万事にぬかりなく進めています」'},
  {id:'w15',cat:'和語③',word:'ひそめる',read:'ひそめる',

  {id:'w16',cat:'和語③',word:'ふてぶてしい',read:'ふてぶてしい',

  {id:'w17',cat:'和語③',word:'へりくだる',read:'へりくだる',

  {id:'w18',cat:'和語③',word:'ほのめかす',read:'ほのめかす',

  {id:'k01',cat:'慣用句③',word:'後の祭り',read:'あとのまつり',

const CATS = ['和語③','慣用句③'];
const STORAGE_KEY = 'kankoto11_redo';

// ===== ローカルストレージ =====
function loadRedo(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch{return[];}}
function saveRedo(ids){localStorage.setItem(STORAGE_KEY,JSON.stringify(ids));}

function updateRedoBtn(){
  const r=loadRedo(), btn=document.getElementById('redo-home-btn'), cnt=document.getElementById('redo-home-count');
  if(r.length>0){btn.style.display='flex';cnt.textContent=r.length+'問';}
  else{btn.style.display='none';}
}

// ===== 画面切替 =====
function showScreen(id){
  ['home','study','quiz','result'].forEach(s=>document.getElementById('screen-'+s).classList.add('hidden'));
  document.getElementById('screen-'+id).classList.remove('hidden');
}
function showHome(){updateRedoBtn();showScreen('home');}

// ===== リセット =====
function doReset(){
  saveRedo([]);
  updateRedoBtn();
  const btn=document.getElementById('reset-btn1');
  btn.textContent='✅ リセットしました';
  setTimeout(()=>{btn.textContent='🗑️ 全データをリセット（初期化）';},2000);
}

// ===== 学習モード =====
let studyWords=[], studyIdx=0, studyCat='';
function startStudy(cat){
  studyCat=cat; studyWords=WORDS.filter(w=>w.cat===cat); studyIdx=0;
  renderStudy(); showScreen('study');
}
function renderStudy(){
  const w=studyWords[studyIdx];
  const pct=(studyIdx/studyWords.length*100);
  document.getElementById('study-prog').style.width=pct+'%';
  document.getElementById('study-badge').textContent=studyCat;
  document.getElementById('study-counter').textContent=(studyIdx+1)+' / '+studyWords.length;
  document.getElementById('study-card-area').innerHTML=`
    <div class="study-card">
      <div class="study-word">${w.word}</div>
      <div class="study-read">${w.read}</div>
      <div class="study-divider"></div>
      <div class="study-meaning">${w.meaning}</div>
      ${w.ex?`<div class="study-ex">${w.ex}</div>`:''}
    </div>`;
  const btn=document.getElementById('study-next-btn');
  btn.textContent=studyIdx+1>=studyWords.length?'完了！ →':'次へ →';
}
function studyNext(){
  if(studyIdx+1>=studyWords.length){showHome();return;}
  studyIdx++; renderStudy();
}

// ===== クイズモード =====
let quizWords=[], quizIdx=0, quizScore=0, quizAnswers=[], quizCat='', isRedo=false;
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

function startQuiz(cat){
  quizCat=cat; isRedo=false;
  quizWords=shuffle(WORDS.filter(w=>w.cat===cat));
  quizIdx=0; quizScore=0; quizAnswers=[];
  renderQuiz(); showScreen('quiz');
}
function startRedoQuiz(){
  const r=loadRedo();
  if(!r.length){alert('解き直しの問題がありません');return;}
  quizCat='解き直し'; isRedo=true;
  quizWords=shuffle(WORDS.filter(w=>r.includes(w.id)));
  quizIdx=0; quizScore=0; quizAnswers=[];
  renderQuiz(); showScreen('quiz');
}
function renderQuiz(){
  const q=quizWords[quizIdx];
  const pct=(quizIdx/quizWords.length*100);
  document.getElementById('quiz-prog').style.width=pct+'%';
  document.getElementById('quiz-badge').textContent=quizCat;
  document.getElementById('quiz-counter').textContent=(quizIdx+1)+' / '+quizWords.length;
  document.getElementById('q-text').textContent='「'+q.word+'」（'+q.read+'）';
  document.getElementById('exp-area').classList.add('hidden');
  document.getElementById('ai-hint-box').classList.add('hidden');
  document.getElementById('ai-hint-text').textContent='';
  document.getElementById('quit-btn').style.display='block';

  // 選択肢：同カテゴリから3つ + 正解1つ
  const pool=WORDS.filter(w=>w.id!==q.id&&w.cat===q.cat);
  const others=shuffle(pool).slice(0,3);
  const choices=shuffle([q,...others]);

  document.getElementById('choices').innerHTML=choices.map((c,i)=>
    `<button class="choice-btn" id="ch-${i}" onclick="answerQuiz(${i},'${c.id}','${q.id}')">
      <span class="choice-num">${i+1}</span>${c.meaning.length>45?c.meaning.slice(0,45)+'…':c.meaning}
    </button>`
  ).join('');
  document.getElementById('next-btn').textContent=(quizIdx+1>=quizWords.length)?'結果を見る →':'次の問題 →';
  window._choices=choices;
}
function answerQuiz(i,choiceId,correctId){
  const q=quizWords[quizIdx], ok=choiceId===correctId;
  if(ok)quizScore++;
  quizAnswers.push({word:q,userIdx:i,correct:ok});
  window._choices.forEach((c,j)=>{
    const b=document.getElementById('ch-'+j); b.disabled=true;
    if(c.id===correctId)b.classList.add('choice-ok');
    else if(j===i)b.classList.add('choice-ng');
    else b.classList.add('choice-dim');
  });
  document.getElementById('exp-tag').textContent=ok?'✅ 正解！':'❌ 不正解';
  document.getElementById('exp-text').innerHTML=`<b>${q.word}（${q.read}）</b><br>${q.meaning}<br><span style="color:var(--accent);font-size:0.8rem">${q.ex||''}</span>`;
  document.getElementById('exp-area').classList.remove('hidden');
  document.getElementById('quit-btn').style.display='none';
  fetchHint(q);
}
async function fetchHint(q){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,
        messages:[{role:'user',content:`小学5年生向け国語の解説です。以下の解説をもとに、子どもにわかりやすく30〜50字で「覚え方のポイント」を一言添えてください。解説：${q.meaning}`}]})});
    const d=await r.json(),h=d.content?.[0]?.text;
    if(h){document.getElementById('ai-hint-text').textContent=h;document.getElementById('ai-hint-box').classList.remove('hidden');}
  }catch(e){}
}
function quizNext(){
  if(quizIdx+1>=quizWords.length){showResult();return;}
  quizIdx++; renderQuiz();
}
function quitQuiz(){
  // 未回答を全て誤答として追加
  quizWords.forEach(w=>{
    if(!quizAnswers.find(a=>a.word.id===w.id)){
      quizAnswers.push({word:w,userIdx:-1,correct:false});
    }
  });
  showResult();
}
function retryQuiz(){
  if(isRedo){startRedoQuiz();}
  else{startQuiz(quizCat);}
}

function showResult(){
  // 未回答を誤答として追加
  quizWords.forEach(w=>{
    if(!quizAnswers.find(a=>a.word.id===w.id)){
      quizAnswers.push({word:w,userIdx:-1,correct:false});
    }
  });

  const wrongIds=quizAnswers.filter(a=>!a.correct).map(a=>a.word.id);
  const correctIds=quizAnswers.filter(a=>a.correct).map(a=>a.word.id);
  const existing=loadRedo();
  const merged=[...new Set([...existing,...wrongIds])].filter(id=>!correctIds.includes(id));
  saveRedo(merged);

  const total=quizAnswers.length;
  document.getElementById('score-num').innerHTML=quizScore+'<span class="score-total">/'+total+'</span>';
  const pct=quizScore/total;
  document.getElementById('score-msg').textContent=
    quizScore===total?'🎉 満点！すばらしい！':pct>=0.8?'👏 よくできました！':pct>=0.6?'😊 もう少し！':'📖 もう一度挑戦しよう';

  document.getElementById('answer-list').innerHTML=quizAnswers.map(a=>{
    const w=!a.correct&&a.userIdx>=0?'<span class="res-wrong">（あなた：'+window._choices?.[a.userIdx]?.meaning?.slice(0,20)+'…）</span>':
            !a.correct?'<span class="res-wrong">（未回答）</span>':'';
    return`<div class="res-item" style="border-left-color:${a.correct?'#22c55e':'#ef4444'}">
      <div class="res-q">${a.word.word}（${a.word.read}）</div>
      <div class="res-a">${a.correct?'✅':'❌'} ${a.word.meaning.slice(0,30)}… ${w}</div></div>`;
  }).join('');

  showScreen('result');

  const btn=document.getElementById('redo-result-btn');
  if(merged.length>0){btn.textContent='🔁 間違えた'+merged.length+'問を解き直す';btn.style.display='block';}
  else{btn.style.display='none';}
  updateRedoBtn();
}

updateRedoBtn(); showHome();
</script>
