<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>言語知識テスト 練習アプリ 11・12回</title>
<style>
:root {
  --bg: #0f172a;
  --surface: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.1);
  --blue: #3b82f6;
  --blue-light: #60a5fa;
  --green: #22c55e;
  --red: #ef4444;
  --text: #f1f5f9;
  --muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f3460 100%);
  min-height: 100vh;
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  color: var(--text);
  padding: 16px;
}
.wrap { max-width: 600px; margin: 0 auto; }
.home-title { text-align: center; padding: 40px 0 32px; }
.home-title-main { font-size: 38px; font-weight: 900; letter-spacing: 0.1em; text-shadow: 0 0 40px rgba(96,165,250,0.7); }
.home-title-sub { font-size: 14px; color: #93c5fd; margin-top: 6px; }
.mode-btn {
  display: flex; align-items: center; gap: 16px;
  width: 100%; padding: 24px 20px; border-radius: 18px;
  border: 1px solid var(--border); cursor: pointer;
  margin-bottom: 14px; text-align: left; color: var(--text);
}
.mode-btn-blue { background: linear-gradient(135deg,#1e3a5f,#1e40af); box-shadow: 0 8px 32px rgba(59,130,246,0.25); }
.mode-btn-green { background: linear-gradient(135deg,#14432a,#166534); box-shadow: 0 8px 32px rgba(34,197,94,0.2); }
.mode-btn-fav { background: linear-gradient(135deg,#4a1d6e,#6d28d9); box-shadow: 0 8px 32px rgba(139,92,246,0.25); }
.mode-icon { font-size: 36px; }
.mode-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.mode-note { font-size: 13px; color: var(--muted); }
.fav-count { font-size: 12px; color: #c4b5fd; background: rgba(139,92,246,0.2); padding: 2px 8px; border-radius: 99px; margin-left: 8px; }
.back-btn { background: none; border: none; color: var(--blue-light); font-size: 15px; cursor: pointer; margin-bottom: 20px; padding: 4px 0; }
.select-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
.select-btn {
  display: flex; justify-content: space-between; align-items: center;
  width: 100%; padding: 18px 20px; margin-bottom: 10px;
  border-radius: 14px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; color: var(--text);
}
.select-name { font-size: 17px; font-weight: 700; }
.select-count { font-size: 13px; color: var(--blue-light); background: rgba(96,165,250,0.15); padding: 3px 10px; border-radius: 99px; }
.prog-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 99px; margin-bottom: 16px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg,#3b82f6,#60a5fa); border-radius: 99px; transition: width 0.3s; }
.quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.badge { font-size: 12px; font-weight: 700; color: var(--blue-light); background: rgba(96,165,250,0.15); padding: 3px 10px; border-radius: 99px; }
.counter { font-size: 13px; color: #64748b; }
.q-box { background: var(--surface); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
.q-text { font-size: 16px; line-height: 1.9; font-weight: 600; }
.q-sub { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.7; }
.opt-btn {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 13px 16px; margin-bottom: 10px;
  border-radius: 12px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); cursor: pointer;
  color: var(--text); text-align: left;
  font-size: 15px; font-weight: 600;
}
.opt-btn:disabled { cursor: default; }
.opt-kana {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0; color: var(--blue-light);
  min-width: 28px;
}
.opt-ok { border-color: var(--green) !important; background: rgba(34,197,94,0.15) !important; color: #86efac; }
.opt-ng { border-color: var(--red) !important; background: rgba(239,68,68,0.15) !important; color: #fca5a5; }
.opt-dim { opacity: 0.35; }
.exp-box { background: var(--surface); border-radius: 16px; padding: 20px; border: 1px solid var(--border); margin-top: 4px; }
.result-tag { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
.exp-text { font-size: 14px; color: var(--muted); line-height: 1.8; margin-bottom: 12px; }
.ai-hint { background: rgba(96,165,250,0.08); border: 1px solid rgba(96,165,250,0.2); border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #bfdbfe; line-height: 1.7; margin-bottom: 14px; }
.ai-hint-label { font-size: 11px; font-weight: 700; color: var(--blue-light); display: block; margin-bottom: 4px; }
.next-btn { width: 100%; padding: 14px; border-radius: 12px; background: linear-gradient(135deg,#2563eb,#1d4ed8); color: #fff; font-weight: 800; font-size: 16px; border: none; cursor: pointer; }
.score-box { text-align: center; background: var(--surface); border-radius: 20px; padding: 32px 24px; border: 1px solid var(--border); margin-bottom: 28px; }
.score-num { font-size: 64px; font-weight: 900; line-height: 1; margin-bottom: 8px; }
.score-total { font-size: 28px; color: var(--muted); }
.score-msg { font-size: 18px; color: var(--blue-light); font-weight: 700; }
.res-item { padding: 12px 14px; margin-bottom: 10px; border-radius: 12px; background: var(--surface); border-left: 4px solid transparent; }
.res-q { font-size: 13px; color: var(--muted); margin-bottom: 4px; line-height: 1.6; }
.res-a { font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.res-wrong { color: #f87171; font-weight: 400; }
.fav-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; line-height: 1; flex-shrink: 0; }
.result-actions { display: flex; gap: 12px; margin-bottom: 32px; }
.retry-btn { flex: 1; padding: 14px; border-radius: 12px; background: linear-gradient(135deg,#2563eb,#1d4ed8); color: #fff; font-weight: 800; font-size: 16px; border: none; cursor: pointer; }
.home-btn { flex: 1; padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.08); color: #fff; font-weight: 800; font-size: 16px; border: 1px solid var(--border); cursor: pointer; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <div id="screen-home">
    <div class="home-title">
      <div class="home-title-main">言語知識</div>
      <div class="home-title-sub">練習アプリ　第11・12回</div>
    </div>
    <button class="mode-btn mode-btn-blue" onclick="showThemeSelect()">
      <span class="mode-icon">📚</span>
      <div><div class="mode-name">テーマ別で練習</div><div class="mode-note">主語述語・修飾語・語彙など分野ごとに学ぶ</div></div>
    </button>
    <button class="mode-btn mode-btn-green" onclick="showRoundSelect()">
      <span class="mode-icon">📝</span>
      <div><div class="mode-name">回数別で確認</div><div class="mode-note">第11・12回をテスト形式で解く</div></div>
    </button>
    <button class="mode-btn mode-btn-fav" id="fav-home-btn" onclick="startFavQuiz()" style="display:none">
      <span class="mode-icon">⭐</span>
      <div>
        <div class="mode-name">お気に入り復習 <span class="fav-count" id="fav-home-count"></span></div>
        <div class="mode-note">登録した問題をまとめて復習する</div>
      </div>
    </button>
  </div>

  <!-- THEME SELECT -->
  <div id="screen-theme" class="hidden">
    <button class="back-btn" onclick="showHome()">← もどる</button>
    <div class="select-title">テーマを選んでください</div>
    <div id="theme-list"></div>
  </div>

  <!-- ROUND SELECT -->
  <div id="screen-round" class="hidden">
    <button class="back-btn" onclick="showHome()">← もどる</button>
    <div class="select-title">回を選んでください</div>
    <div id="round-list"></div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="hidden">
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="quiz-meta">
      <span class="badge" id="q-theme"></span>
      <span class="counter" id="q-counter"></span>
    </div>
    <div class="q-box">
      <p class="q-text" id="q-text"></p>
      <p class="q-sub hidden" id="q-sub"></p>
    </div>
    <div id="options"></div>
    <div id="exp-area" class="hidden">
      <div class="exp-box">
        <div class="result-tag" id="result-tag"></div>
        <div class="exp-text" id="exp-text"></div>
        <div class="ai-hint hidden" id="ai-hint-box">
          <span class="ai-hint-label">💡 ポイント</span>
          <span id="ai-hint-text"></span>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="hidden">
    <div class="score-box">
      <div class="score-num" id="score-num"></div>
      <div class="score-msg" id="score-msg"></div>
    </div>
    <div id="answer-list"></div>
    <div class="result-actions">
      <button class="retry-btn" onclick="retryQuiz()">もう一度</button>
      <button class="home-btn" onclick="showHome()">トップへ</button>
    </div>
  </div>

</div>

<script>
const ALL_QUESTIONS = [
  // ===== 第11回 =====
  // 問1 主語・述語
  {id:"q11-1-1", round:11, theme:"主語・述語",
   question:'「山嵐はエ腹をオすかしていた」\n①主語はどれですか？',
   sub:'ア山から　イおりてきた　ウ山嵐は　エ腹を　オすかしていた',
   options:["ア","イ","ウ","エ","オ"], answer:2,
   explanation:"「山嵐は」が「すかしていた」の主語。「は」がついた文節が主語になることが多い。"},
  {id:"q11-1-2", round:11, theme:"主語・述語",
   question:'「山嵐はエ腹をオすかしていた」\n②述語はどれですか？',
   sub:'ア山から　イおりてきた　ウ山嵐は　エ腹を　オすかしていた',
   options:["ア","イ","ウ","エ","オ"], answer:4,
   explanation:"「すかしていた」が述語。文末の動詞・形容詞・形容動詞が述語になる。"},
  {id:"q11-1-3", round:11, theme:"主語・述語",
   question:'「今日は一日中運動をしていたのでとても疲れた」\n①主語はどれですか？（省略の場合は×）',
   sub:'ア今日は　イ一日中　ウ運動を　エしていたので　オとても　カ疲れた',
   options:["ア","イ","ウ","エ","オ","カ","×（省略）"], answer:6,
   explanation:"この文の主語（私が）は省略されている。「今日は」は時を表す修飾語。"},
  {id:"q11-1-4", round:11, theme:"主語・述語",
   question:'「今日は一日中運動をしていたのでとても疲れた」\n②述語はどれですか？',
   sub:'ア今日は　イ一日中　ウ運動を　エしていたので　オとても　カ疲れた',
   options:["ア","イ","ウ","エ","オ","カ"], answer:5,
   explanation:"「疲れた」が文末の述語。「疲れた」が文全体の結論となっている。"},
  {id:"q11-1-5", round:11, theme:"主語・述語",
   question:'「境内には影法師だけがひっそりと残されていた」\n①主語はどれですか？',
   sub:'ア夕暮れが　イ迫る　ウ境内には　エ小僧たちの　オ影法師だけが　カひっそりと　キいびつな　ク穴のように　ケ残されていた',
   options:["ア","イ","ウ","エ","オ","カ","キ","ク","ケ"], answer:4,
   explanation:"「影法師だけが」が「残されていた」の主語。「が」がついた文節が主語のサイン。"},
  {id:"q11-1-6", round:11, theme:"主語・述語",
   question:'「境内には影法師だけがひっそりと残されていた」\n②述語はどれですか？',
   sub:'ア夕暮れが　イ迫る　ウ境内には　エ小僧たちの　オ影法師だけが　カひっそりと　キいびつな　ク穴のように　ケ残されていた',
   options:["ア","イ","ウ","エ","オ","カ","キ","ク","ケ"], answer:8,
   explanation:"「残されていた」が文末の述語。文全体の主述関係は「影法師だけが＋残されていた」。"},
  {id:"q11-1-7", round:11, theme:"主語・述語",
   question:'「多くの村人たちが目撃したという…毒リンゴはいったい誰の手に」\n①主語はどれですか？',
   sub:'ア多くの　イ村人たちが　ウ目撃した　エ青い　オ空から　カ降ってきた　キ白雪姫の　ク毒リンゴは　ケいったい　コ誰の　サ手に',
   options:["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ"], answer:7,
   explanation:"「毒リンゴは」が主語。「は」がついた文節。述語は省略されている（〜落ちた、など）。"},
  {id:"q11-1-8", round:11, theme:"主語・述語",
   question:'「多くの村人たちが目撃したという…毒リンゴはいったい誰の手に」\n②述語はどれですか？（省略の場合は×）',
   sub:'ア多くの　イ村人たちが　ウ目撃した　エ青い　オ空から　カ降ってきた　キ白雪姫の　ク毒リンゴは　ケいったい　コ誰の　サ手に',
   options:["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ","×（省略）"], answer:11,
   explanation:"この文は「毒リンゴは誰の手に（落ちたのか）」という形で、述語が省略されている。"},
  {id:"q11-1-9", round:11, theme:"主語・述語",
   question:'「長太郎だってもうだまってはいないだろう」\n①主語はどれですか？',
   sub:'アいつもは　イおとなしい　ウ長太郎だって　エもう　オだまっては　カいないだろう　キ山嵐の　クふるまいを　ケ知った今は',
   options:["ア","イ","ウ","エ","オ","カ","キ","ク","ケ"], answer:2,
   explanation:"「長太郎だって」が主語。「だって」は「も」と同じ意味で主語を示す助詞。"},
  {id:"q11-1-10", round:11, theme:"主語・述語",
   question:'「長太郎だってもうだまってはいないだろう」\n②述語はどれですか？',
   sub:'アいつもは　イおとなしい　ウ長太郎だって　エもう　オだまっては　カいないだろう　キ山嵐の　クふるまいを　ケ知った今は',
   options:["ア","イ","ウ","エ","オ","カ","キ","ク","ケ"], answer:5,
   explanation:"「いないだろう」が述語。文末の「〜だろう」は推量の述語。"},

  // 問2 修飾語
  {id:"q11-2-1", round:11, theme:"修飾語",
   question:'「きらきらと」はどの文節を修飾していますか？',
   sub:'きらきらとア高いイ夜空にウ輝くエ無数のオ星はカ美しかった',
   options:["ア高い","イ夜空に","ウ輝く","エ無数の","オ星は","カ美しかった"], answer:2,
   explanation:"「きらきらと輝く」がひとまとまり。副詞「きらきらと」は直後の動詞「輝く」を修飾している。"},
  {id:"q11-2-2", round:11, theme:"修飾語",
   question:'①の文で「高い」はどの文節を修飾していますか？',
   sub:'きらきらとア高いイ夜空にウ輝くエ無数のオ星はカ美しかった',
   options:["きらきらと","イ夜空に","ウ輝く","エ無数の","オ星は","カ美しかった"], answer:1,
   explanation:"「高い夜空」がひとまとまり。形容詞「高い」は直後の名詞「夜空に」を修飾している。"},
  {id:"q11-2-3", round:11, theme:"修飾語",
   question:'②の文で「うっすらと」はどの文節を修飾していますか？',
   sub:'やがてア山のイふもとはウうっすらとエ薄いオ緑にカ染まり、キ村人たちにク春のケ訪れをコ知らせるだろう',
   options:["ア山の","イふもとは","エ薄い","オ緑に","カ染まり","キ村人たちに"], answer:4,
   explanation:"「うっすらと染まり」がひとまとまり。副詞「うっすらと」は動詞「染まり」を修飾している。"},
  {id:"q11-2-4", round:11, theme:"修飾語",
   question:'③の文で「間もなく」はどの文節を修飾していますか？',
   sub:'このア見捨てられたようなイさびしいウ村にもエ間もなくオ巡礼のカ人々がキ訪れ、ク神のケ降臨をコ告げるだろう',
   options:["ア見捨てられたような","イさびしい","ウ村にも","オ巡礼の","カ人々が","キ訪れ"], answer:5,
   explanation:"「間もなく訪れ」がひとまとまり。副詞「間もなく」は動詞「訪れ」を修飾している。"},

  // 問3 文の問題点
  {id:"q11-3-1", round:11, theme:"文の組み立て",
   question:'「早くおしゃべりせずに問題を解きなさい」の問題点は？',
   sub:'ア主語と述語の表現が対応していない\nイ主語が省略され、否定の言葉が二つあるのでわかりにくい\nウ修飾語の副詞の位置が不適切なため、文の意味がとりにくい',
   options:["ア","イ","ウ"], answer:2,
   explanation:"「早く」が「おしゃべりせずに」と「問題を解きなさい」のどちらにかかるかわかりにくい。副詞の位置が問題。正しくは「おしゃべりせずに早く問題を解きなさい」。"},
  {id:"q11-3-2", round:11, theme:"文の組み立て",
   question:'「ぼくの希望は、…職業に就こうと思っています」の問題点は？',
   sub:'ア主語と述語の表現が対応していない\nイ主語が省略され、否定の言葉が二つあるのでわかりにくい\nウ修飾語の副詞の位置が不適切なため、文の意味がとりにくい',
   options:["ア","イ","ウ"], answer:0,
   explanation:"主語は「ぼくの希望は」なので述語は「〜職業です」が正しい。「〜思っています」では主述がねじれている。これを「主述のねじれ」という。"},

  // 問4 語彙
  {id:"q11-4-1", round:11, theme:"語彙",
   question:'「この映画は展開がありきたりでつまらない」の「ありきたり」の意味は？',
   options:["ある気分や状態を引き起こす","ずうずうしいさま","気力を完全になくす","うれしいことがあって動作がはずむさま","ありふれていること","物事の関係がぎこちないさま","見つけるのが早い"],
   answer:4,
   explanation:"「ありきたり」は「よくある・平凡だ・目新しさがない」という意味。「ありきたりな展開」のように使う。"},
  {id:"q11-4-2", round:11, theme:"語彙",
   question:'「絶望にうちひしがれている」の「うちひしがれる」の意味は？',
   options:["ある気分や状態を引き起こす","ずうずうしいさま","気力を完全になくす","うれしいことがあって動作がはずむさま","ありふれていること","物事の関係がぎこちないさま","見つけるのが早い"],
   answer:2,
   explanation:"「うちひしがれる」は打ち砕かれて気力を完全になくすこと。「絶望にうちひしがれる」で「絶望で立ち直れなくなる」という意味。"},
  {id:"q11-4-3", round:11, theme:"語彙",
   question:'「四谷君はいそいそと帰宅した」の「いそいそ」の意味は？',
   options:["ある気分や状態を引き起こす","ずうずうしいさま","気力を完全になくす","うれしいことがあって動作がはずむさま","ありふれていること","物事の関係がぎこちないさま","見つけるのが早い"],
   answer:3,
   explanation:"「いそいそ」はうれしいことがあって、動作が弾んでいる様子。「いそいそと出かける」のように使う。"},
  {id:"q11-4-4", round:11, theme:"語彙",
   question:'「冷蔵庫のプリンを妹にめざとく見つけられた」の「めざとく」の意味は？',
   options:["ある気分や状態を引き起こす","ずうずうしいさま","気力を完全になくす","うれしいことがあって動作がはずむさま","ありふれていること","物事の関係がぎこちないさま","見つけるのが早い"],
   answer:6,
   explanation:"「めざとい」は目が鋭くて見つけるのが早いこと。「めざとく見つける」で「すぐに見つけてしまう」という意味。"},

const THEMES = ["主語・述語","修飾語","文の組み立て","語彙","語彙・慣用句"];
const ROUNDS = [11, 12];
const KANA = ["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ","×（省略）"];
const STORAGE_KEY = 'gengo11_favorites';

let questions = [], idx = 0, score = 0, answers = [];
let lastFilter = null, lastMode = null;

function loadFavs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
function saveFavs(ids) { localStorage.setItem(STORAGE_KEY, JSON.stringify(ids)); }
function isFav(id) { return loadFavs().includes(id); }
function toggleFav(id) {
  let favs = loadFavs();
  if (favs.includes(id)) favs = favs.filter(f => f !== id);
  else favs.push(id);
  saveFavs(favs);
  updateFavHomeBtn();
  return favs.includes(id);
}
function updateFavHomeBtn() {
  const favs = loadFavs();
  const btn = document.getElementById('fav-home-btn');
  const cnt = document.getElementById('fav-home-count');
  if (favs.length > 0) { btn.style.display = 'flex'; cnt.textContent = favs.length + '問'; }
  else { btn.style.display = 'none'; }
}
function startFavQuiz() {
  const favs = loadFavs();
  if (favs.length === 0) { alert('お気に入りがまだありません'); return; }
  lastFilter = 'fav'; lastMode = 'fav';
  questions = shuffle(ALL_QUESTIONS.filter(q => favs.includes(q.id)));
  idx = 0; score = 0; answers = [];
  renderQuestion(); showScreen('quiz');
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function showScreen(id) {
  ['home','theme','round','quiz','result'].forEach(s => {
    document.getElementById('screen-' + s).classList.add('hidden');
  });
  document.getElementById('screen-' + id).classList.remove('hidden');
}

function showHome() { updateFavHomeBtn(); showScreen('home'); }

function showThemeSelect() {
  const el = document.getElementById('theme-list');
  el.innerHTML = THEMES.map(t => {
    const cnt = ALL_QUESTIONS.filter(q => q.theme === t).length;
    return `<button class="select-btn" onclick="startQuiz('${t}','theme')">
      <span class="select-name">${t}</span>
      <span class="select-count">${cnt}問</span>
    </button>`;
  }).join('');
  showScreen('theme');
}

function showRoundSelect() {
  const el = document.getElementById('round-list');
  el.innerHTML = ROUNDS.map(r => {
    const cnt = ALL_QUESTIONS.filter(q => q.round === r).length;
    return `<button class="select-btn" onclick="startQuiz(${r},'round')">
      <span class="select-name">第${r}回</span>
      <span class="select-count">${cnt}問</span>
    </button>`;
  }).join('');
  showScreen('round');
}

function startQuiz(filter, mode) {
  lastFilter = filter; lastMode = mode;
  questions = shuffle(ALL_QUESTIONS.filter(q => mode === 'theme' ? q.theme === filter : q.round === filter));
  idx = 0; score = 0; answers = [];
  renderQuestion(); showScreen('quiz');
}

function renderQuestion() {
  const q = questions[idx];
  const pct = (idx / questions.length) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('q-theme').textContent = q.theme;
  document.getElementById('q-counter').textContent = `${idx + 1} / ${questions.length}`;
  document.getElementById('q-text').textContent = q.question;

  const subEl = document.getElementById('q-sub');
  if (q.sub) {
    subEl.textContent = q.sub;
    subEl.classList.remove('hidden');
  } else {
    subEl.classList.add('hidden');
  }

  document.getElementById('exp-area').classList.add('hidden');
  document.getElementById('ai-hint-box').classList.add('hidden');
  document.getElementById('ai-hint-text').textContent = '';

  const opts = document.getElementById('options');
  opts.innerHTML = q.options.map((opt, i) =>
    `<button class="opt-btn" id="opt-${i}" onclick="selectAnswer(${i})">
      <span class="opt-kana">${KANA[i] || (i+1)}</span>${opt}
    </button>`
  ).join('');
  document.getElementById('next-btn').textContent = (idx + 1 >= questions.length) ? '結果を見る →' : '次の問題 →';
}

function selectAnswer(i) {
  const q = questions[idx];
  const correct = i === q.answer;
  if (correct) score++;
  answers.push({ question: q, userAnswer: i, correct });

  q.options.forEach((_, j) => {
    const btn = document.getElementById('opt-' + j);
    btn.disabled = true;
    if (j === q.answer) btn.classList.add('opt-ok');
    else if (j === i) btn.classList.add('opt-ng');
    else btn.classList.add('opt-dim');
  });

  document.getElementById('result-tag').textContent = correct ? '✅ 正解！' : `❌ 不正解　正解：${q.options[q.answer]}`;
  document.getElementById('exp-text').textContent = q.explanation;
  document.getElementById('exp-area').classList.remove('hidden');
  fetchAiHint(q);

  const pct = ((idx + 1) / questions.length) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
}

async function fetchAiHint(q) {
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 200,
        messages: [{ role: 'user', content: `小学5年生向け国語の解説です。以下の解説をもとに、子どもにわかりやすく30〜50字で「覚え方のポイント」を一言添えてください。解説：${q.explanation}` }]
      })
    });
    const data = await res.json();
    const hint = data.content?.[0]?.text;
    if (hint) {
      document.getElementById('ai-hint-text').textContent = hint;
      document.getElementById('ai-hint-box').classList.remove('hidden');
    }
  } catch(e) {}
}

function nextQuestion() {
  if (idx + 1 >= questions.length) { showResult(); return; }
  idx++;
  renderQuestion();
}

function showResult() {
  document.getElementById('score-num').innerHTML = `${score}<span class="score-total">/${questions.length}</span>`;
  const pct = score / questions.length;
  document.getElementById('score-msg').textContent =
    score === questions.length ? '🎉 満点！すばらしい！' :
    pct >= 0.8 ? '👏 よくできました！' :
    pct >= 0.6 ? '😊 もう少し！' : '📖 もう一度挑戦しよう';

  document.getElementById('answer-list').innerHTML = answers.map(a => {
    const fav = isFav(a.question.id);
    const favIcon = fav ? '⭐' : '☆';
    const wrongExtra = !a.correct
      ? `<span class="res-wrong">（あなた：${a.question.options[a.userAnswer]}）</span>` : '';
    return `<div class="res-item" style="border-left-color:${a.correct ? '#22c55e' : '#ef4444'}">
      <div class="res-q">${a.question.question.replace(/\n/g, '　')}</div>
      <div class="res-a">
        <span>${a.correct ? '✅' : '❌'} ${a.question.options[a.question.answer]}${wrongExtra}</span>
        <button class="fav-btn" id="fav-${a.question.id}" onclick="handleFavToggle('${a.question.id}')">${favIcon}</button>
      </div>
    </div>`;
  }).join('');

  updateFavHomeBtn();
  showScreen('result');
}

function handleFavToggle(id) {
  const isNowFav = toggleFav(id);
  const btn = document.getElementById('fav-' + id);
  if (btn) btn.textContent = isNowFav ? '⭐' : '☆';
}

function retryQuiz() { startQuiz(lastFilter, lastMode); }

updateFavHomeBtn();
showHome();
</script>
</body>
