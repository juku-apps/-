<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九州地方テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#3468a6;
  --accent-light:#e8f0fa;
  --ref:#7a5ea8;
  --ref-light:#f1ecf8;
  --good:#2f9e5b;
  --good-light:#e6f6ec;
  --bad:#d1453b;
  --bad-light:#fbe9e8;
  --ink:#22303f;
  --sub:#5c6b7a;
  --line:#dbe3ec;
  --bg:#f5f7fa;
  --card:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Zen Kaku Gothic New",sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}
.header{
  padding:16px 18px 12px;
  background:linear-gradient(135deg,var(--accent),#4d7dbf);
  color:#fff;
  position:sticky;
  top:0;
  z-index:5;
}
.header h1{
  margin:0;
  font-size:18px;
  font-weight:900;
  letter-spacing:.02em;
}
.header .sub{
  margin-top:2px;
  font-size:12px;
  opacity:.9;
}
.content{
  flex:1;
  padding:14px 16px 90px;
}
.stage-card{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 2px 8px rgba(30,50,80,.08);
  padding:16px;
  margin-bottom:14px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .1s;
}
.stage-card:active{transform:scale(.98);}
.stage-card.ref{
  border-color:var(--ref);
  background:linear-gradient(180deg,#fff,var(--ref-light));
}
.stage-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.stage-name{
  font-size:16px;
  font-weight:700;
}
.stage-badge{
  font-size:11px;
  background:var(--accent);
  color:#fff;
  padding:3px 8px;
  border-radius:999px;
  font-weight:700;
}
.stage-card.ref .stage-badge{background:var(--ref);}
.stage-desc{
  font-size:12.5px;
  color:var(--sub);
  margin-top:6px;
  line-height:1.5;
}
.stage-meta{
  display:flex;
  gap:10px;
  margin-top:10px;
  font-size:12px;
  color:var(--sub);
}
.retry-btn{
  margin-top:10px;
  display:inline-block;
  background:var(--bad-light);
  color:var(--bad);
  border:1px solid var(--bad);
  border-radius:8px;
  padding:6px 10px;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}
.progress-bar{
  height:6px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
  margin-top:8px;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:99px;
}
.lead-badge{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  margin-bottom:10px;
}
.sub-badge{
  display:inline-block;
  background:#fff;
  color:var(--accent);
  border:1px solid var(--accent);
  font-size:11px;
  font-weight:700;
  padding:2px 8px;
  border-radius:999px;
  margin-left:6px;
}
.play-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12.5px;
  color:var(--sub);
  margin-bottom:10px;
}
.qcard{
  background:var(--card);
  border-radius:14px;
  padding:18px 16px;
  box-shadow:0 2px 8px rgba(30,50,80,.08);
  border:1px solid var(--line);
}
.qcard.info{
  border-color:var(--ref);
  background:linear-gradient(180deg,#fff,var(--ref-light));
}
.qtitle{
  font-weight:900;
  font-size:16px;
  margin-bottom:8px;
}
.qtext{
  font-size:15.5px;
  line-height:1.7;
  margin-bottom:14px;
  white-space:pre-wrap;
}
.qtext.wide{font-size:14.5px;}
.info-body{
  font-size:14.5px;
  line-height:1.85;
}
.info-body b{color:var(--accent);}
.src-tag{
  margin-top:14px;
  font-size:11.5px;
  color:var(--ref);
  border-top:1px dashed var(--line);
  padding-top:8px;
}
.choice-list{display:flex;flex-direction:column;gap:9px;}
.choice-btn{
  text-align:left;
  padding:12px 14px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:14.5px;
  font-family:inherit;
  cursor:pointer;
  line-height:1.5;
}
.choice-btn:active{background:var(--accent-light);}
.choice-btn.correct{
  border-color:var(--good);
  background:var(--good-light);
  font-weight:700;
}
.choice-btn.wrong{
  border-color:var(--bad);
  background:var(--bad-light);
  font-weight:700;
}
.choice-btn.dim{opacity:.55;}
.fill-input{
  width:100%;
  padding:12px 14px;
  font-size:16px;
  border-radius:10px;
  border:1.5px solid var(--line);
  font-family:inherit;
  margin-bottom:10px;
}
.fill-input.correct{border-color:var(--good);background:var(--good-light);}
.fill-input.wrong{border-color:var(--bad);background:var(--bad-light);}
.btn{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:none;
  font-size:15px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  margin-top:6px;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ref{background:var(--ref);color:#fff;}
.btn-outline{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
.btn-outline.ref{color:var(--ref);border-color:var(--ref);}
.result-box{
  text-align:center;
  padding:6px 0 18px;
}
.result-score{
  font-size:40px;
  font-weight:900;
  color:var(--accent);
  margin:6px 0;
}
.explain-box{
  margin-top:14px;
  background:var(--accent-light);
  border-radius:10px;
  padding:12px 14px;
  font-size:13.5px;
  line-height:1.7;
}
.explain-box.bad{background:var(--bad-light);}
.explain-box.good{background:var(--good-light);}
.hint-box{
  margin-top:10px;
  background:#fff8e6;
  border:1px solid #e8cf8a;
  border-radius:10px;
  padding:10px 12px;
  font-size:13px;
  line-height:1.6;
}
.mark-icon{font-size:18px;margin-right:4px;vertical-align:-2px;}
.missed-list{
  text-align:left;
  margin-top:16px;
  font-size:13px;
}
.missed-item{
  padding:8px 10px;
  background:var(--bad-light);
  border-radius:8px;
  margin-bottom:6px;
  color:#8a2f28;
}
.home-title{
  font-size:13px;
  font-weight:700;
  color:var(--sub);
  margin:18px 0 8px 2px;
}
.footer-note{
  text-align:center;
  font-size:11px;
  color:var(--sub);
  padding:10px 0 26px;
}
</style>
</head>
<body>
<div id="app"></div>
<script>

<b>②農林水産業</b>：筑紫平野の二毛作、宮崎平野の促成栽培、八代平野のいぐさ、鹿児島県・宮崎県の畜産、福岡県のいちご。水産業は東シナ海の好漁場、有明海ののり、大村湾の真珠、鹿児島県のうなぎ養殖。<br><br>
<b>③工業</b>：北九州工業地域（現在は機械工業が中心）、大分の鉄鋼・石油化学、長崎・佐世保の造船、有田・伊万里・唐津の陶磁器、シリコンアイランド／カーアイランド。<br><br>
<b>④交通</b>：関門海峡でむすばれる九州と本州、九州新幹線・西九州新幹線、福岡空港。<br><br>
<b>⑤沖縄</b>：さんご由来の水はけのよい土地、太平洋戦争と27年間のアメリカ統治、残るアメリカ軍基地、さとうきび・観光業。<br><br>
<b>⑥世界文化遺産</b>：琉球王国のグスク、明治日本の産業革命遺産（八幡製鉄所など）、神宿る島・沖ノ島、長崎と天草地方の潜伏キリシタン関連遺産。`
  }

const kihonFillRaw = [
  // pillar 1
  {pillar:1, q:"九州の中央部にある、高くけわしい山地を（　）という。", answer:"九州山地", accept:["九州山地"], explain:"九州の中央部には高くけわしい九州山地が、北部には低くなだらかな筑紫山地があります。"},
  {pillar:1, q:"阿蘇山は広大な（　）で知られている。", answer:"カルデラ", accept:["カルデラ"], explain:"阿蘇山は広大なカルデラで知られています。"},

/* ===================== 共通ビルド関数 ===================== */

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function finalize(q){
  const correctText = q.choices[q.answer];
  const order = shuffleArr(q.choices.map((c,i)=>i));
  const newChoices = order.map(i=>q.choices[i]);
  const newAnswer = newChoices.indexOf(correctText);
  const out = Object.assign({}, q, {choices:newChoices, answer:newAnswer});
  return out;
}

function normalizeAnswer(str){
  if(str===undefined || str===null) return "";
  let s = String(str).trim();
  s = s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  s = s.replace(/\s+/g,"");
  return s;
}

function checkFillAnswer(item, userInput){
  const norm = normalizeAnswer(userInput);
  if(norm==="") return false;
  const candidates = [item.answer].concat(item.accept||[]);
  return candidates.some(c => normalizeAnswer(c)===norm);
}

/* kihon の穴埋め item 生成 */
function buildKihonFillItems(){
  return kihonFillRaw.map((r,idx)=>({
    type:"fill",
    id:"kihonFill_"+idx,
    q:r.q,
    answer:r.answer,
    accept:r.accept,
    explain:r.explain,
    lead:PILLARS[r.pillar].label,
    sub:PILLARS[r.pillar].full,
    pillar:r.pillar
  }));
}

function buildKihonFinalItems(){
  return kihonFinalRaw.map((r,idx)=>{
    const fq = finalize({q:r.q, choices:r.choices, answer:r.answer, explain:r.explain});
    return Object.assign({type:"choice", id:"kihonFinal_"+idx, pillar:r.pillar}, fq);
  });
}

function buildKihonItems(){
  const overview = kihonOverviewScreens.map((s,idx)=>Object.assign({id:"kihonOv_"+idx}, s));
  const fills = shuffleArrKeepBlocks();
  const finals = shuffleArr(buildKihonFinalItems());
  return overview.concat(fills, finals);
}
// 穴埋めはブロック（pillar）順は固定、ブロック内はシャッフル
function shuffleArrKeepBlocks(){
  const byPillar = {};
  kihonFillRaw.forEach((r,idx)=>{
    if(!byPillar[r.pillar]) byPillar[r.pillar]=[];
    byPillar[r.pillar].push(idx);
  });
  let out = [];
  [1,2,3,4,5,6].forEach(p=>{
    const idxs = shuffleArr(byPillar[p]||[]);
    idxs.forEach(idx=>{
      const r = kihonFillRaw[idx];
      out.push({
        type:"fill", id:"kihonFill_"+idx, q:r.q, answer:r.answer, accept:r.accept,
        explain:r.explain, lead:PILLARS[r.pillar].label, sub:PILLARS[r.pillar].full, pillar:r.pillar
      });
    });
  });
  return out;
}

/* kuroji item 生成：ブロック順固定、ブロック内シャッフル */
function buildKurojiItems(){
  let out = [];
  kurojiBlocks.forEach((block,bi)=>{
    const shuffledItems = shuffleArr(block.items);
    shuffledItems.forEach((it,ii)=>{
      const fq = finalize(it);
      out.push(Object.assign({
        type:"choice",
        id:"kuroji_"+bi+"_"+ii,
        pillar:block.pillar,
        sub:block.sub
      }, fq));
    });
  });
  return out;
}

/* mame item 生成 */
function buildMameItems(){
  const shuffled = shuffleArr(mameQuizRaw);
  return shuffled.map((r,idx)=>{
    const fq = finalize(r);
    return Object.assign({type:"choice", id:"mame_"+idx, pillar:r.pillar}, fq);
  });
}

/* sanko item 生成（採点なし） */
function buildSankoItems(){
  return sankoNotes.map((n,idx)=>({
    type:"info", id:"sanko_"+idx, title:n.title, body:n.body, src:n.src, wide:true
  }));
}

const STAGES = [
  {id:"kihon", name:"① 構造テスト", desc:"6本柱（自然・農林水産業・工業・交通・沖縄・世界遺産）の骨組みを確認。概要2画面＋穴埋め23問＋まとめ選択6問。", scored:true, ref:false, build:buildKihonItems},
  {id:"kuroji", name:"② 黒太字テスト", desc:"各分野の重要語句・統計ランキング・8県別まとめを4択で確認します。", scored:true, ref:false, build:buildKurojiItems},
  {id:"mame", name:"③ ひとくちメモテスト", desc:"教科書のひとくちメモから出題します。", scored:true, ref:false, build:buildMameItems},
  {id:"sanko", name:"④ 気をつけたいポイント", desc:"教科書コラム＋入試でまちがえやすい注意点の読みもの。採点はありません。", scored:false, ref:true, build:buildSankoItems}
];

/* ===================== 状態管理／localStorage ===================== */

const STORAGE_KEY = "kyushu_missed_v1";

function loadMissedStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveMissedStore(store){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){ /* 保存できない環境は無視 */ }
}

const state = {
  screen:"home",
  stageId:null,
  isRetry:false,
  items:[],
  currentIndex:0,
  scoreTotal:0,
  scoreCorrect:0,
  answerLog:[],
  results:{},
  missedStore: loadMissedStore(),
  answered:false,
  userInput:""
};

function startStage(stageId){
  const stage = STAGES.find(s=>s.id===stageId);
  state.stageId = stageId;
  state.isRetry = false;
  state.items = stage.build();
  state.currentIndex = 0;
  state.scoreTotal = state.items.filter(i=>i.type!=="info").length;
  state.scoreCorrect = 0;
  state.answerLog = [];
  state.answered = false;
  state.userInput = "";
  state.screen = "play";
  render();
}

function startRetry(stageId){
  const missed = state.missedStore[stageId] || {};
  const items = Object.values(missed);
  if(items.length===0) return;
  state.stageId = stageId;
  state.isRetry = true;
  state.items = shuffleArr(items);
  state.currentIndex = 0;
  state.scoreTotal = state.items.length;
  state.scoreCorrect = 0;
  state.answerLog = [];
  state.answered = false;
  state.userInput = "";
  state.screen = "play";
  render();
}

function currentItem(){ return state.items[state.currentIndex]; }

function submitChoice(idx){
  if(state.answered) return;
  const item = currentItem();
  const correct = idx === item.answer;
  state.answered = true;
  state.userChoiceIdx = idx;
  if(correct) state.scoreCorrect++;
  state.answerLog.push({item, wasCorrect:correct});
}

function submitFill(){
  if(state.answered) return;
  const item = currentItem();
  const correct = checkFillAnswer(item, state.userInput);
  state.answered = true;
  if(correct) state.scoreCorrect++;
  state.answerLog.push({item, wasCorrect:correct});
}

function nextItem(){
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  state.hintShown = false;
  if(state.currentIndex < state.items.length-1){
    state.currentIndex++;
    render();
  }else{
    finishStage();
  }
}

function finishStage(){
  const stage = STAGES.find(s=>s.id===state.stageId);
  state.results[state.stageId] = {
    correct: state.scoreCorrect,
    total: state.scoreTotal,
    at: Date.now()
  };
  if(stage.scored && !state.isRetry===false || stage.scored){
    // まちがえた問題リストへのマージ（第1〜3段階のみ／sankoは対象外）
    if(stage.scored){
      const missed = state.missedStore[state.stageId] || {};
      state.answerLog.forEach(log=>{
        const key = log.item.q;
        if(!log.wasCorrect){
          missed[key] = log.item;
        }else{
          if(missed[key]) delete missed[key];
        }
      });
      state.missedStore[state.stageId] = missed;
      saveMissedStore(state.missedStore);
    }
  }
  state.screen = "result";
  render();
}

function backHome(){
  state.screen = "home";
  render();
}

/* ===================== レンダリング ===================== */

const app = document.getElementById("app");

function render(){
  if(state.screen==="home") renderHome();
  else if(state.screen==="play") renderPlay();
  else if(state.screen==="result") renderResult();
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderHome(){
  let html = `
    <div class="header">
      <h1>九州地方テスト</h1>
      <div class="sub">予習シリーズ5年上　第11回　九州地方</div>
    </div>
    <div class="content">
  `;
  const scoredStages = STAGES.filter(s=>s.scored);
  const refStages = STAGES.filter(s=>!s.scored);

  html += `<div class="home-title">確認テスト</div>`;
  scoredStages.forEach(stage=>{
    const res = state.results[stage.id];
    const missedCount = Object.keys(state.missedStore[stage.id]||{}).length;
    html += `<div class="stage-card" onclick="startStage('${stage.id}')">
      <div class="stage-top">
        <div class="stage-name">${esc(stage.name)}</div>
        <div class="stage-badge">${res ? res.correct+"/"+res.total : "未挑戦"}</div>
      </div>
      <div class="stage-desc">${esc(stage.desc)}</div>
      ${res ? `<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(res.correct/res.total*100)}%"></div></div>` : ""}
      ${missedCount>0 ? `<div class="retry-btn" onclick="event.stopPropagation(); startRetry('${stage.id}')">🔁 苦手${missedCount}問を復習</div>` : ""}
    </div>`;
  });

  html += `<div class="home-title">参考情報（読みもの）</div>`;
  refStages.forEach(stage=>{
    html += `<div class="stage-card ref" onclick="startStage('${stage.id}')">
      <div class="stage-top">
        <div class="stage-name">${esc(stage.name)}</div>
        <div class="stage-badge">読みもの</div>
      </div>
      <div class="stage-desc">${esc(stage.desc)}</div>
    </div>`;
  });

  html += `<div class="footer-note">単一HTMLファイル・localStorageに端末内で保存されます</div>`;
  html += `</div>`;
  app.innerHTML = html;
}

function renderPlay(){
  const item = currentItem();
  const stage = STAGES.find(s=>s.id===state.stageId);
  const isInfo = item.type==="info";
  const progressLabel = isInfo ? "" : `${state.answerLog.filter(l=>true).length + (state.answered?0:0)}`;
  const answeredCount = state.answerLog.length;

  let html = `
    <div class="header">
      <h1>${esc(stage.name)}${state.isRetry?"（復習）":""}</h1>
      <div class="sub">${item.sub ? esc(item.sub) : esc(stage.desc)}</div>
    </div>
    <div class="content">
      <div class="play-topbar">
        <span>問題 ${state.currentIndex+1} / ${state.items.length}</span>
        <span onclick="backHome()" style="text-decoration:underline; cursor:pointer;">中断してホームへ</span>
      </div>
  `;

  if(isInfo){
    html += `<div class="qcard info">
      <div class="qtitle">${esc(item.title)}</div>
      <div class="info-body ${item.wide?'wide':''}">${item.body}</div>
      ${item.src ? `<div class="src-tag">出典：${esc(item.src)}</div>` : ""}
      <button class="btn btn-ref" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次へ" : "結果を見る"}</button>
    </div>`;
  } else if(item.type==="fill"){
    html += `<div class="qcard">`;
    if(item.lead) html += `<div class="lead-badge">${esc(item.lead)}</div>`;
    html += `<div class="qtext">${esc(item.q)}</div>`;
    const inputClass = state.answered ? (checkFillAnswer(item, state.userInput) ? "correct":"wrong") : "";
    html += `<input type="text" id="fillInput" class="fill-input ${inputClass}" placeholder="答えを入力" value="${esc(state.userInput)}" ${state.answered?"disabled":""} onkeydown="if(event.key==='Enter'){document.getElementById('fillInput').value=this.value; state.userInput=this.value; submitFillUI();}">`;
    if(!state.answered){
      html += `<button class="btn btn-primary" onclick="submitFillUI()">こたえる</button>`;
    }else{
      const correct = checkFillAnswer(item, state.userInput);
      html += `<div class="explain-box ${correct?'good':'bad'}">
        <span class="mark-icon">${correct?"⭕":"❌"}</span><b>正解：${esc(item.answer)}</b><br>${item.explain||""}
      </div>`;
      html += `<button class="btn btn-primary" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次の問題へ" : "結果を見る"}</button>`;
    }
    html += `</div>`;
  } else if(item.type==="choice"){
    html += `<div class="qcard">`;
    if(item.pillar) html += `<div class="lead-badge">${esc(pillarBadge(item.pillar))}</div>`;
    html += `<div class="qtext">${esc(item.q)}</div>`;
    html += `<div class="choice-list">`;
    item.choices.forEach((c,idx)=>{
      let cls = "choice-btn";
      if(state.answered){
        if(idx===item.answer) cls += " correct";
        else if(idx===state.userChoiceIdx) cls += " wrong";
        else cls += " dim";
      }
      html += `<button class="${cls}" ${state.answered?"disabled":""} onclick="submitChoiceUI(${idx})">${esc(c)}</button>`;
    });
    html += `</div>`;
    if(item.hint && !state.answered){
      html += `<button class="btn btn-outline" style="margin-top:10px;" onclick="toggleHint()">${item.hintLabel||"ヒントを見る"}</button>`;
      if(state.hintShown){
        html += `<div class="hint-box">${item.hint.map(h=>"・"+esc(h)).join("<br>")}</div>`;
      }
    }
    if(state.answered){
      const correct = state.userChoiceIdx===item.answer;
      html += `<div class="explain-box ${correct?'good':'bad'}">
        <span class="mark-icon">${correct?"⭕":"❌"}</span>${item.explain||""}
      </div>`;
      html += `<button class="btn btn-primary" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次の問題へ" : "結果を見る"}</button>`;
    }
    html += `</div>`;
  }

  html += `</div>`;
  app.innerHTML = html;
  if(item.type==="fill" && !state.answered){
    const el = document.getElementById("fillInput");
    if(el) el.focus();
  }
}

function submitChoiceUI(idx){
  submitChoice(idx);
  renderPlay();
}
function submitFillUI(){
  const el = document.getElementById("fillInput");
  if(el) state.userInput = el.value;
  submitFill();
  renderPlay();
}
function toggleHint(){
  state.hintShown = !state.hintShown;
  renderPlay();
}

function renderResult(){
  const stage = STAGES.find(s=>s.id===state.stageId);
  const wrongItems = state.answerLog.filter(l=>!l.wasCorrect).map(l=>l.item);
  const missedCount = Object.keys(state.missedStore[state.stageId]||{}).length;

  let html = `
    <div class="header">
      <h1>結果</h1>
      <div class="sub">${esc(stage.name)}${state.isRetry?"（復習）":""}</div>
    </div>
    <div class="content">
      <div class="qcard result-box">
        <div>できた問題</div>
        <div class="result-score">${state.scoreCorrect} / ${state.scoreTotal}</div>
        ${wrongItems.length>0 ? `<div class="missed-list">${wrongItems.map(it=>`<div class="missed-item">${esc(it.q)}</div>`).join("")}</div>` : `<div style="color:var(--good); font-weight:700;">全問正解です！</div>`}
      </div>
  `;
  if(wrongItems.length>0){
    html += `<button class="btn btn-primary" onclick="startRetry('${state.stageId}')">🔁 まちがえた問題だけ復習する（${wrongItems.length}問）</button>`;
  } else if(missedCount>0){
    html += `<button class="btn btn-primary" onclick="startRetry('${state.stageId}')">🔁 残っている苦手${missedCount}問を復習する</button>`;
  }
  html += `<button class="btn btn-outline" onclick="backHome()">ホームにもどる</button>`;
  html += `</div>`;
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
