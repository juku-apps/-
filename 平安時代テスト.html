<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>平安時代テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Serif+JP:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#3468a6;
  --accent-light:#e8f0fa;
  --ref:#7a5ea8;
  --ref-light:#f1ecf8;
  --good:#2f9e5b;
  --good-light:#e6f6ec;
  --bad:#d1453b;
  --bad-light:#fbe9e8;
  --ink:#22303f;
  --sub:#5c6b7a;
  --line:#dbe3ec;
  --bg:#f5f7fa;
  --card:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Zen Kaku Gothic New",sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}
.header{
  padding:16px 18px 12px;
  background:linear-gradient(135deg,var(--accent),#4d7dbf);
  color:#fff;
  position:sticky;
  top:0;
  z-index:5;
}
.header h1{
  margin:0;
  font-size:18px;
  font-weight:900;
  letter-spacing:.02em;
}
.header .sub{
  margin-top:2px;
  font-size:12px;
  opacity:.9;
}
.content{
  flex:1;
  padding:14px 16px 90px;
}
.home-title{
  font-size:14px;
  font-weight:800;
  color:var(--sub);
  margin:18px 2px 10px;
}
.home-title:first-child{margin-top:2px;}
.stage-card{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 2px 8px rgba(30,50,80,.08);
  padding:16px;
  margin-bottom:14px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .1s;
}
.stage-card:active{transform:scale(.98);}
.stage-card.ref{
  border-color:var(--ref);
  background:linear-gradient(180deg,#fff,var(--ref-light));
}
.stage-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.stage-name{
  font-size:16px;
  font-weight:700;
}
.stage-badge{
  font-size:11px;
  background:var(--accent);
  color:#fff;
  padding:3px 8px;
  border-radius:999px;
  font-weight:700;
  white-space:nowrap;
  margin-left:8px;
}
.stage-card.ref .stage-badge{background:var(--ref);}
.stage-desc{
  font-size:12.5px;
  color:var(--sub);
  margin-top:6px;
  line-height:1.5;
}
.progress-bar{
  height:6px;
  background:var(--line);
  border-radius:99px;
  margin-top:10px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),#4d7dbf);
  border-radius:99px;
  transition:width .3s;
}
.retry-btn{
  margin-top:10px;
  display:inline-block;
  background:var(--bad-light);
  color:var(--bad);
  border:1px solid var(--bad);
  border-radius:8px;
  padding:6px 10px;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}
.footer-note{
  text-align:center;
  font-size:11px;
  color:var(--sub);
  margin-top:22px;
}
.reset-all-btn{
  width:100%;
  margin-top:18px;
  padding:11px;
  border-radius:10px;
  background:none;
  border:1px solid var(--bad);
  color:var(--bad);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
}
.play-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--sub);
  margin-bottom:12px;
}
.qcard{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(30,50,80,.08);
  border:1px solid var(--line);
  margin-bottom:16px;
}
.qcard.info{
  background:linear-gradient(180deg,#fff,var(--ref-light));
  border-color:var(--ref);
}
.qtitle{
  font-size:16px;
  font-weight:800;
  margin-bottom:10px;
  color:var(--ref);
}
.info-body{
  font-size:14px;
  line-height:1.9;
  color:var(--ink);
}
.info-body p{margin:0 0 12px;}
.info-body p:last-child{margin-bottom:0;}
.src-tag{
  margin-top:12px;
  font-size:11.5px;
  color:var(--sub);
}
.lead-badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  color:var(--accent);
  background:var(--accent-light);
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:10px;
}
.qtext{
  font-size:15px;
  font-weight:700;
  line-height:1.7;
  margin-bottom:16px;
}
.choice-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.choice-btn{
  width:100%;
  text-align:left;
  padding:13px 14px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-size:14px;
  font-family:inherit;
  font-weight:600;
  cursor:pointer;
}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct{border-color:var(--good);background:var(--good-light);color:#1c6b3f;}
.choice-btn.wrong{border-color:var(--bad);background:var(--bad-light);color:#9c3128;}
.choice-btn.dim{opacity:.4;}
.fill-input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1.5px solid var(--line);
  font-size:15px;
  font-family:inherit;
  margin-bottom:14px;
}
.fill-input.correct{border-color:var(--good);background:var(--good-light);}
.fill-input.wrong{border-color:var(--bad);background:var(--bad-light);}
.explain-box{
  border-radius:12px;
  padding:14px;
  font-size:13px;
  line-height:1.8;
  margin-bottom:14px;
}
.explain-box.good{background:var(--good-light);color:#1c6b3f;}
.explain-box.bad{background:var(--bad-light);color:#9c3128;}
.mark-icon{font-size:15px;margin-right:6px;}
.btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:15px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),#4d7dbf);color:#fff;}
.btn-ref{background:linear-gradient(135deg,var(--ref),#9678c2);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
.btn-danger-outline{background:var(--bad-light);border:1.5px solid var(--bad);color:var(--bad);}
.result-actions{display:flex;gap:10px;margin-top:4px;}
.result-actions .btn{flex:1;}
.result-box{text-align:center;}
.result-score{
  font-size:44px;
  font-weight:900;
  color:var(--accent);
  margin:8px 0;
}
.wrong-list{margin-top:14px;text-align:left;}
.wrong-list-label{font-size:12px;color:var(--sub);margin-bottom:6px;}
.wrong-item{
  padding:10px 12px;
  border-radius:10px;
  background:var(--bad-light);
  color:#9c3128;
  margin-bottom:8px;
  font-size:13px;
  line-height:1.6;
}
.perfect-msg{color:var(--good);font-weight:800;margin-top:10px;font-size:14px;}
.speak-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
}
.speak-btn{
  border:1.5px solid var(--ref);
  background:#fff;
  color:var(--ref);
  border-radius:999px;
  padding:8px 16px;
  font-size:13px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  white-space:nowrap;
}
.speak-btn.playing{background:var(--ref);color:#fff;}
.speed-control{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--sub);
}
.speed-control input[type=range]{
  width:92px;
  accent-color:var(--ref);
}
.hidden{display:none!important;}

/* ===== ざっくり流れ 導入ブロック ===== */
.heian-intro{
  --hi-ink:#2B2622; --hi-soft:#6B6255; --hi-line:#D9CDB4; --hi-paper:#FFFFFF;
  --hi-sei:#8778A8; --hi-sei-bg:#F0ECF7;   /* 政治=藤色 */
  --hi-sha:#C77B4E; --hi-sha-bg:#FBEDE3;   /* 社会=赤茶 */
  --hi-bun:#4E9B8F; --hi-bun-bg:#E7F3F0;   /* 文化=青緑 */
  margin: 0 0 18px;
  padding: 18px 16px 20px;
  background: var(--hi-paper);
  border: 1px solid var(--hi-line);
  border-radius: 14px;
  box-sizing: border-box;
  color: var(--hi-ink);
  font-family: "Noto Sans JP", sans-serif;
  line-height: 1.65;
}
.heian-intro *{ box-sizing: border-box; }
.heian-intro h2{
  font-family: "Noto Serif JP", serif;
  font-weight: 900;
  font-size: clamp(18px, 5vw, 21px);
  margin: 0 0 4px;
}
.heian-intro .hi-lead{
  font-size: 12.5px;
  color: var(--hi-soft);
  margin: 0 0 16px;
}
.hi-group{ margin-bottom: 16px; }
.hi-group:last-of-type{ margin-bottom: 4px; }
.hi-tag{
  display:inline-block;
  font-family: "Noto Serif JP", serif;
  font-weight: 700;
  font-size: 12.5px;
  padding: 3px 12px;
  border-radius: 999px;
  color: #fff;
  background: var(--hi-c);
  margin-bottom: 8px;
}
.hi-group.sei{ --hi-c: var(--hi-sei); }
.hi-group.sha{ --hi-c: var(--hi-sha); }
.hi-group.bun{ --hi-c: var(--hi-bun); }
.hi-chain{ display:flex; flex-direction: column; }
.hi-step{
  background: var(--hi-bg);
  border-left: 4px solid var(--hi-c);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13px;
}
.hi-group.sei .hi-step{ --hi-bg: var(--hi-sei-bg); }
.hi-group.sha .hi-step{ --hi-bg: var(--hi-sha-bg); }
.hi-group.bun .hi-step{ --hi-bg: var(--hi-bun-bg); }
.hi-arrow{
  font-size: 12px;
  font-weight: 700;
  color: var(--hi-soft);
  margin: 4px 0 4px 10px;
}
.hi-arrow b{ color: var(--hi-c); font-size: 14px; }
.hi-sum{
  margin-top: 14px;
  padding: 10px 13px;
  background: #F1E9D8;
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--hi-soft);
}
.hi-sum b{ color: var(--hi-ink); }
.hi-speak-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin:0 0 18px;
  padding:10px 12px;
  background:#F6F1E4;
  border:1px solid var(--hi-line);
  border-radius:10px;
}
.hi-speak-row .hi-speak-note{font-size:12px;color:var(--hi-soft);}
.hi-tag-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:8px;
}
.hi-tag-row .hi-tag{margin-bottom:0;}
.speak-btn.small{padding:5px 12px;font-size:11.5px;}

/* ===== 並べ替えクイズ ===== */
.order-cat-tag{
  display:inline-block;
  font-family:"Noto Serif JP",serif;
  font-weight:700;
  font-size:12px;
  padding:3px 12px;
  border-radius:999px;
  color:#fff;
  margin-bottom:10px;
}
.order-cat-tag.sei{background:#8778A8;}
.order-cat-tag.sha{background:#C77B4E;}
.order-cat-tag.bun{background:#4E9B8F;}
.order-instructions{font-size:12.5px;color:var(--sub);margin-bottom:14px;line-height:1.6;}
.order-placed{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;min-height:20px;}
.order-placed-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:10px 12px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:13px;
  line-height:1.6;
  cursor:pointer;
}
.order-placed-item.locked{cursor:default;}
.order-placed-item .order-num{flex:0 0 auto;font-weight:800;color:var(--accent);}
.order-placed-item.correct{border-color:var(--good);background:var(--good-light);}
.order-placed-item.correct .order-num{color:var(--good);}
.order-placed-item.wrong{border-color:var(--bad);background:var(--bad-light);}
.order-placed-item.wrong .order-num{color:var(--bad);}
.order-pool{display:flex;flex-direction:column;gap:8px;}
.order-pool-item{
  width:100%;
  text-align:left;
  padding:10px 12px;
  border-radius:10px;
  border:1.5px dashed var(--line);
  background:var(--bg);
  font-size:13px;
  line-height:1.6;
  font-family:inherit;
  color:var(--ink);
  cursor:pointer;
}
.order-pool-item:active{transform:scale(.98);}
.order-empty-hint{font-size:12px;color:var(--sub);text-align:center;padding:10px;border:1.5px dashed var(--line);border-radius:10px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== 単元データ：柱の定義 ===================== */
const PILLARS = {
  1: {label:"① 平安京と律令政治の立て直し", full:"平安京と律令政治の立て直し"},
  2: {label:"② 藤原氏の政治", full:"藤原氏の政治"},
  3: {label:"③ 武士のおこりと成長", full:"武士のおこりと成長"},
  4: {label:"④ 上皇の政治", full:"上皇の政治"},
  5: {label:"⑤ 平氏の政治", full:"平氏の政治"},
  6: {label:"⑥ 新しい仏教と国風文化", full:"新しい仏教と国風文化"}
};

/* ===================== ①構造テスト：概要画面 ===================== */
const kihonOverviewScreens = [
  {
    title:"はじめに",
    body:`<p>今回のテーマは「平安時代」です。794年に桓武天皇が平安京に都を移してから、源頼朝が鎌倉に幕府を開くまでの約400年間を平安時代といいます。</p><p>平安時代の前半は藤原氏が摂政・関白として政治の実権をにぎる摂関政治が行われ、後半には上皇が政治を行う院政や、武士が力をのばす動きが見られるようになりました。</p><p>この回では、平安京と律令政治の立て直し、藤原氏の政治、武士のおこりと成長、上皇の政治、平氏の政治、新しい仏教と国風文化という、6つの視点から平安時代を学びます。</p>`
  },
  {
    title:"6つの柱",
    body:`<p><b>① 平安京と律令政治の立て直し</b><br>桓武天皇が平安京に都を移した理由と、蝦夷との戦いについて学びます。</p><p><b>② 藤原氏の政治</b><br>摂政・関白による摂関政治と、藤原道長・頼通の全盛期について学びます。</p><p><b>③ 武士のおこりと成長</b><br>武士の登場と成長、平将門の乱・藤原純友の乱、東北地方の争いについて学びます。</p><p><b>④ 上皇の政治</b><br>白河上皇が始めた院政のしくみと、上皇と天皇の対立について学びます。</p><p><b>⑤ 平氏の政治</b><br>保元の乱・平治の乱と、平清盛による政治、日宋貿易について学びます。</p><p><b>⑥ 新しい仏教と国風文化</b><br>最澄・空海が伝えた新しい仏教と、かな文字を中心とする国風文化について学びます。</p>`
  }
];

/* ===================== ①構造テスト：穴埋め ===================== */
const kihonFillRaw = [
  {pillar:1, q:"794年、平城京から都を移した天皇は誰ですか。", answer:"桓武天皇", explain:"桓武天皇は寺院の勢力が強い平城京をはなれ、律令政治を立て直そうとした。"},
  {pillar:1, q:"794年に京都に置かれた、以後1100年ほど日本の都であり続けた都を何といいますか。", answer:"平安京", explain:"794年から源頼朝が鎌倉に幕府を開くまでの約400年間を平安時代という。"},
  {pillar:1, q:"桓武天皇が東北地方の蝦夷を討つために征夷大将軍に任命した人物は誰ですか。", answer:"坂上田村麻呂", explain:"坂上田村麻呂は、蝦夷の首長であるアテルイを降伏させた。"},
  {pillar:1, q:"朝廷が支配していなかった東北地方に住む人々を、朝廷は何とよんでいましたか。", answer:"蝦夷", explain:"朝廷の勢力拡大によって北に追いやられた蝦夷は、しばしば朝廷の軍と戦った。"},
  {pillar:2, q:"天皇が幼いときに藤原氏がついた役職を何といいますか。", answer:"摂政", explain:"天皇が成人した後は関白として政治の実権をにぎった。"},
  {pillar:2, q:"天皇が成人した後に藤原氏がついた役職を何といいますか。", answer:"関白", explain:"摂政と関白による藤原氏の政治を摂関政治という。"},
  {pillar:2, q:"894年、遣唐使の停止を提案した人物は誰ですか。", answer:"菅原道真", explain:"道真はのちに藤原氏によって大宰府に送られ、その地で亡くなった。"},
  {pillar:2, q:"藤原氏が最も栄えた11世紀前半に政治の実権をにぎっていた、道長とその子は誰ですか。", answer:"頼通", explain:"道長と頼通のころ、朝廷の重要な役職は藤原氏一族によってしめられた。"},
  {pillar:3, q:"一族や家来を従えるほどに成長した武士の集団を何といいますか。", answer:"武士団", explain:"有力な武士団は皇族から分かれた清和源氏と桓武平氏だった。"},
  {pillar:3, q:"939年、関東で自ら新皇と名のった人物は誰ですか。", answer:"平将門", explain:"平将門の乱は、朝廷に対して武士が起こした最初の大きな反乱だった。"},
  {pillar:3, q:"939年、瀬戸内海の海賊を率いて西国を荒らし回った人物は誰ですか。", answer:"藤原純友", explain:"平将門の乱とほぼ同時期に起こった反乱である。"},
  {pillar:3, q:"11世紀後半、東北地方の争いをしずめ、源氏が東国で勢力をもつきっかけをつくった人物は誰ですか。", answer:"源義家", explain:"この結果、源氏は東国で勢力をもつようになった。"},
  {pillar:4, q:"1086年、位を8歳の皇子にゆずって上皇となった天皇は誰ですか。", answer:"白河天皇", explain:"白河上皇は屋敷（院）で政治を行い、院政を始めた。"},
  {pillar:4, q:"上皇が屋敷（院）で行った政治を何といいますか。", answer:"院政", explain:"院政が始まると藤原氏の力は急速におとろえ、多くの荘園が上皇に集中した。"},
  {pillar:4, q:"白河上皇らが仏教をあつく信仰したため強まった、寺院からおしかけて要求をつきつけた武装した僧を何といいますか。", answer:"僧兵", explain:"院や朝廷は武士を使ってこれを防いだ。"},
  {pillar:4, q:"11世紀後半、藤原氏と関わりのうすい立場で自ら政治を行った天皇は誰ですか。", answer:"後三条天皇", explain:"後三条天皇は藤原氏をおさえて自ら政治を行った。"},

/* ===================== 共通ビルド関数 ===================== */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function finalize(q){
  const correctText = q.choices[q.answer];
  const order = shuffleArr(q.choices.map((c,i)=>i));
  const newChoices = order.map(i=>q.choices[i]);
  const newAnswer = newChoices.indexOf(correctText);
  const out = Object.assign({}, q, {choices:newChoices, answer:newAnswer});
  return out;
}

function normalizeAnswer(str){
  if(str===undefined || str===null) return "";
  let s = String(str).trim();
  s = s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  s = s.replace(/\s+/g,"");
  s = s.replace(/[『』「」]/g,"");
  return s;
}

function checkFillAnswer(item, userInput){
  const norm = normalizeAnswer(userInput);
  if(norm==="") return false;
  const candidates = [item.answer].concat(item.accept||[]);
  return candidates.some(c => normalizeAnswer(c)===norm);
}

function shuffleArrKeepBlocks(){
  const byPillar = {};
  kihonFillRaw.forEach((r,idx)=>{
    if(!byPillar[r.pillar]) byPillar[r.pillar]=[];
    byPillar[r.pillar].push(idx);
  });
  let out = [];
  [1,2,3,4,5,6].forEach(p=>{
    const idxs = shuffleArr(byPillar[p]||[]);
    idxs.forEach(idx=>{
      const r = kihonFillRaw[idx];
      out.push({
        type:"fill", id:"kihonFill_"+idx, q:r.q, answer:r.answer, accept:r.accept,
        explain:r.explain, lead:PILLARS[r.pillar].label, sub:PILLARS[r.pillar].full, pillar:r.pillar
      });
    });
  });
  return out;
}

function buildKihonFinalItems(){
  return kihonFinalRaw.map((r,idx)=>{
    const fq = finalize({q:r.q, choices:r.choices, answer:r.answer, explain:r.explain});
    return Object.assign({type:"choice", id:"kihonFinal_"+idx, pillar:r.pillar, sub:PILLARS[r.pillar].full}, fq);
  });
}

function buildKihonItems(){
  const orderItems = buildOrderQuizItems();
  const overview = kihonOverviewScreens.map((s,idx)=>Object.assign({id:"kihonOv_"+idx, type:"info", wide:true}, s));

const STORAGE_KEY = "heianjidai_missed_v1";

function loadMissedStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveMissedStore(store){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){ /* 保存できない環境は無視 */ }
}

const SPEAK_RATE_KEY = "quizapp_speak_rate_v1";
function loadSpeakRate(){
  try{
    const v = parseFloat(localStorage.getItem(SPEAK_RATE_KEY));
    if(!isNaN(v) && v>=0.7 && v<=1.8) return v;
  }catch(e){}
  return 1.1;
}
function saveSpeakRate(v){
  try{ localStorage.setItem(SPEAK_RATE_KEY, String(v)); }catch(e){}
}

const state = {
  screen:"home",
  stageId:null,
  isRetry:false,
  items:[],
  currentIndex:0,
  scoreTotal:0,
  scoreCorrect:0,
  answerLog:[],
  results:{},
  missedStore: loadMissedStore(),
  answered:false,
  userInput:"",
  userChoiceIdx:null,
  orderItemId:null,
  orderPool:[],
  orderPlaced:[],
  speakRate: loadSpeakRate()
};

function startStage(stageId){
  stopSpeak();
  const stage = STAGES.find(s=>s.id===stageId);
  state.stageId = stageId;
  state.isRetry = false;
  state.items = stage.build();
  state.currentIndex = 0;
  state.scoreTotal = state.items.filter(i=>i.type!=="info").length;
  state.scoreCorrect = 0;
  state.answerLog = [];
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  state.orderItemId = null;
  state.orderPool = [];
  state.orderPlaced = [];
  state.screen = "play";
  render();
}

function startRetry(stageId){
  const missed = state.missedStore[stageId] || {};
  const items = Object.values(missed);
  if(items.length===0) return;
  state.stageId = stageId;
  state.isRetry = true;
  state.items = shuffleArr(items);
  state.currentIndex = 0;
  state.scoreTotal = state.items.length;
  state.scoreCorrect = 0;
  state.answerLog = [];
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  state.orderItemId = null;
  state.orderPool = [];
  state.orderPlaced = [];
  state.screen = "play";
  render();
}

function currentItem(){ return state.items[state.currentIndex]; }

function submitChoice(idx){
  if(state.answered) return;
  const item = currentItem();
  const correct = idx === item.answer;
  state.answered = true;
  state.userChoiceIdx = idx;
  if(correct) state.scoreCorrect++;
  state.answerLog.push({item, wasCorrect:correct});
}

function submitFill(){
  if(state.answered) return;
  const item = currentItem();
  const correct = checkFillAnswer(item, state.userInput);
  state.answered = true;
  if(correct) state.scoreCorrect++;
  state.answerLog.push({item, wasCorrect:correct});
}

function initOrderIfNeeded(item){
  if(state.orderItemId === item.id) return;
  state.orderItemId = item.id;
  state.orderPool = shuffleArr(item.steps.map(s=>({text:s.text, correctIndex:s.correctIndex})));
  state.orderPlaced = [];
}

function tapOrderStep(poolIdx){
  if(state.answered) return;
  const step = state.orderPool.splice(poolIdx,1)[0];
  state.orderPlaced.push(step);
  if(state.orderPool.length===0){
    const item = currentItem();
    const allCorrect = state.orderPlaced.every((s,i)=>s.correctIndex===i);
    state.answered = true;
    if(allCorrect) state.scoreCorrect++;
    state.answerLog.push({item, wasCorrect:allCorrect});
  }
  renderPlay();
}

function removeOrderStep(placedIdx){
  if(state.answered) return;
  const step = state.orderPlaced.splice(placedIdx,1)[0];
  state.orderPool.push(step);
  renderPlay();
}

function nextItem(){
  stopSpeak();
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  state.orderItemId = null;
  state.orderPool = [];
  state.orderPlaced = [];
  if(state.currentIndex < state.items.length-1){
    state.currentIndex++;
    render();
  }else{
    finishStage();
  }
}

function finishStage(){
  const stage = STAGES.find(s=>s.id===state.stageId);
  state.results[state.stageId] = {
    correct: state.scoreCorrect,
    total: state.scoreTotal,
    at: Date.now()
  };
  if(stage.scored){
    const missed = state.missedStore[state.stageId] || {};
    state.answerLog.forEach(log=>{
      const key = log.item.q;
      if(!log.wasCorrect){
        missed[key] = log.item;
      }else{
        if(missed[key]) delete missed[key];
      }
    });
    state.missedStore[state.stageId] = missed;
    saveMissedStore(state.missedStore);
  }
  state.screen = "result";
  render();
}

function backHome(){
  stopSpeak();
  stopMic();
  state.screen = "home";
  render();
}

/* ===================== 音声読み上げ（Web Speech API：読み上げ） ===================== */
let cachedVoices = [];
let activeSpeakBtnId = null;
let activeSpeakText = null;
let currentUtterance = null; /* Safari対策：参照を保持しないと発話がGCで途中停止することがある */

function speakSupported(){
  return typeof window!=="undefined" && "speechSynthesis" in window;
}

function refreshVoices(){
  if(speakSupported()) cachedVoices = window.speechSynthesis.getVoices() || [];
}
if(speakSupported()){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function getBestJaVoice(){
  const jaVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ja"));
  if(jaVoices.length===0) return null;
  const preferred = jaVoices.find(v => /google/i.test(v.name))
    || jaVoices.find(v => v.localService===false)
    || jaVoices[0];
  return preferred;
}

function speakText(text, btnId){
  if(!speakSupported()) return;
  const doSpeak = ()=>{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.rate = state.speakRate;
    const voice = getBestJaVoice();
    if(voice) u.voice = voice;
    u.onend = ()=>{ setSpeakBtnState(btnId, false); if(activeSpeakBtnId===btnId) activeSpeakBtnId=null; };
    u.onerror = ()=>{ setSpeakBtnState(btnId, false); if(activeSpeakBtnId===btnId) activeSpeakBtnId=null; };
    currentUtterance = u;
    window.speechSynthesis.speak(u);
    setSpeakBtnState(btnId, true);
  };
  if(window.speechSynthesis.speaking){
    /* Safari対策：cancel直後にspeakすると発話が無音のまま失敗することがあるため少し間を置く */
    window.speechSynthesis.cancel();
    setTimeout(doSpeak, 150);
  }else{
    doSpeak();
  }
}

function stopSpeak(){
  if(speakSupported()) window.speechSynthesis.cancel();
  if(activeSpeakBtnId){ setSpeakBtnState(activeSpeakBtnId, false); activeSpeakBtnId = null; }
  activeSpeakText = null;
}

function toggleSpeak(text, btnId){
  btnId = btnId || "speakBtn";
  if(!speakSupported()) return;
  if(window.speechSynthesis.speaking && activeSpeakBtnId===btnId){
    stopSpeak();
  }else{
    if(activeSpeakBtnId && activeSpeakBtnId!==btnId) setSpeakBtnState(activeSpeakBtnId, false);
    activeSpeakBtnId = btnId;
    activeSpeakText = text;
    speakText(text, btnId);
  }
}

function updateSpeakRate(v){
  state.speakRate = parseFloat(v);
  saveSpeakRate(state.speakRate);
  document.querySelectorAll(".speak-rate-label").forEach(label=>{
    label.textContent = state.speakRate.toFixed(1)+"倍";
  });
}

function restartSpeakIfPlaying(){
  /* スライダーを離したとき、再生中のものがあれば新しい速さで読み直す */
  if(activeSpeakBtnId && activeSpeakText){
    speakText(activeSpeakText, activeSpeakBtnId);
  }
}

function setSpeakBtnState(btnId, playing){
  const btn = document.getElementById(btnId);
  if(!btn) return;
  btn.classList.toggle("playing", playing);
  btn.innerHTML = playing ? "⏸ 止める" : "🔊 音声で聞く";
}

/* マイク機能は精度の問題により削除済み。他の関数からの呼び出しに備えて no-op で残す */
function stopMic(){}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function pillarBadge(p){
  return (PILLARS[p] && PILLARS[p].label) || "";
}

function renderPlay(){
  const item = currentItem();
  const stage = STAGES.find(s=>s.id===state.stageId);
  const isInfo = item.type==="info";

  let html = `
    <div class="header">
      <h1>${esc(stage.name)}${state.isRetry?"（復習）":""}</h1>
      <div class="sub">${item.sub ? esc(item.sub) : esc(stage.desc)}</div>
    </div>
    <div class="content">
      <div class="play-topbar">
        <span>問題 ${state.currentIndex+1} / ${state.items.length}</span>
        <span onclick="backHome()" style="text-decoration:underline; cursor:pointer;">中断してホームへ</span>
      </div>

  if(isInfo){
    html += `<div class="qcard info">
      <div class="qtitle">${esc(item.title)}</div>

        <button id="speakBtn" class="speak-btn" onclick='toggleSpeak(${JSON.stringify(item.speak)})'>🔊 音声で聞く</button>

    html += `<div class="qcard">`;
    if(item.lead) html += `<div class="lead-badge">${esc(item.lead)}</div>`;
    html += `<div class="qtext">${esc(item.q)}</div>`;
    const inputClass = state.answered ? (checkFillAnswer(item, state.userInput) ? "correct":"wrong") : "";

      </div>`;
      html += `<button class="btn btn-primary" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次の問題へ" : "結果を見る"}</button>`;
    }
    html += `</div>`;
  } else if(item.type==="choice"){
    html += `<div class="qcard">`;
    if(item.pillar!==undefined && item.pillar!==null) html += `<div class="lead-badge">${esc(pillarBadge(item.pillar))}</div>`;
    html += `<div class="qtext">${esc(item.q)}</div>`;
    html += `<div class="choice-list">`;
    item.choices.forEach((c,idx)=>{
      let cls = "choice-btn";
      if(state.answered){
        if(idx===item.answer) cls += " correct";
        else if(idx===state.userChoiceIdx) cls += " wrong";
        else cls += " dim";
      }
      html += `<button class="${cls}" ${state.answered?"disabled":""} onclick="submitChoiceUI(${idx})">${esc(c)}</button>`;
    });
    html += `</div>`;
    if(state.answered){
      const correct = state.userChoiceIdx===item.answer;
      html += `<div class="explain-box ${correct?'good':'bad'}">
        <span class="mark-icon">${correct?"⭕":"❌"}</span>${esc(item.explain||"")}
      </div>`;
      html += `<button class="btn btn-primary" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次の問題へ" : "結果を見る"}</button>`;
    }
    html += `</div>`;
  } else if(item.type==="order"){

  html += `</div>`;
  app.innerHTML = html;
  if(item.type==="fill" && !state.answered){

    if(el) el.focus();
  }
}

function doResetAll(){

}

render();
