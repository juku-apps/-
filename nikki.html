<script type="module">

import { getDatabase, ref, set, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCCW9eVVluS_i9Uilq43uMUEREh7FoXqc",
  authDomain: "study-schedule-79493.firebaseapp.com",
  databaseURL: "https://study-schedule-79493-default-rtdb.firebaseio.com",
  projectId: "study-schedule-79493",
  storageBucket: "study-schedule-79493.firebasestorage.app",
  messagingSenderId: "126949580601",
  appId: "1:126949580601:web:e8ca4c5d4eed84a56d12e8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// グローバル関数として公開
window._dbRef  = (path) => ref(db, path);
window._dbSet  = (r, val) => set(r, val);
window._dbPush = (r) => push(r);
window._dbOnValue = (r, cb) => onValue(r, cb, { onlyOnce: true });
window._dbGet  = (r) => get(r);

// Firebase準備完了を通知
window.dispatchEvent(new Event('firebaseReady'));
</script>
<script>
// DOMContentLoaded後にinitAppを呼ぶ（firebaseReady後でも対応）
function _tryInitApp() {
  if (window._dbRef && document.readyState !== 'loading') {
    initApp();
  }
}
window.addEventListener('firebaseReady', _tryInitApp);
document.addEventListener('DOMContentLoaded', _tryInitApp);
</script>
<style>
:root {
  --sky: #6BB8F0;
  --sky-light: #E8F4FD;
  --sun: #FFD166;
  --sun-light: #FFF8E7;
  --grass: #6BCB77;
  --grass-light: #EDFAEF;
  --pink: #FF8FAB;
  --pink-light: #FFF0F4;
  --purple: #B48FE0;
  --purple-light: #F5EFFE;
  --bg: #FAFCFF;
  --surface: #FFFFFF;
  --border: #E8EDF4;
  --text: #2D3142;
  --text-sub: #7B85A0;
  --radius: 20px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 16px;
}

/* ヘッダー */
.app-header {
  background: linear-gradient(135deg, var(--sky) 0%, var(--purple) 100%);
  padding: 20px 16px 16px;
  text-align: center;
  color: white;
}

.app-title {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.05em;
  text-shadow: 0 2px 4px rgba(0,0,0,0.15);
  margin-bottom: 4px;
}

.app-subtitle {
  font-size: 13px;
  opacity: 0.85;
}

/* タブ */
.tabs {
  display: flex;
  background: white;
  border-bottom: 2px solid var(--border);
}

.tab {
  flex: 1;
  padding: 12px 4px;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-sub);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
}

.tab.active {
  color: var(--sky);
  border-bottom-color: var(--sky);
}

/* コンテンツ */
.tab-content { display: none; padding: 16px; padding-bottom: 80px; }
.tab-content.active { display: block; }

/* 事象選択 */
.section-title {
  font-size: 18px;
  font-weight: 900;
  text-align: center;
  margin-bottom: 16px;
  line-height: 1.5;
}

.event-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.event-card {
  background: var(--surface);
  border: 3px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}

.event-card:active { transform: scale(0.96); }

.event-card.selected {
  border-color: var(--sky);
  background: var(--sky-light);
}

.event-icon { font-size: 32px; margin-bottom: 6px; display: block; }
.event-label { font-size: 14px; font-weight: 700; }

/* 対話エリア */
.chat-area {
  background: var(--surface);
  border-radius: var(--radius);
  border: 2px solid var(--border);
  overflow: hidden;
  margin-bottom: 14px;
}

.chat-messages {
  padding: 16px;
  min-height: 200px;
  max-height: 400px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.msg.ai { flex-direction: row; }
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  background: var(--sky-light);
}

.msg-bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.6;
  font-weight: 600;
}

.msg.ai .msg-bubble {
  background: var(--sky-light);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

.msg.user .msg-bubble {
  background: var(--sky);
  border-bottom-right-radius: 4px;
  color: white;
}

.msg-bubble.loading {
  background: var(--border);
  color: var(--text-sub);
}

/* 入力エリア */
.chat-input-area {
  border-top: 2px solid var(--border);
  padding: 10px 12px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.chat-input {
  flex: 1;
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 16px;
  font-family: inherit;
  resize: none;
  background: var(--bg);
  color: var(--text);
  min-height: 46px;
  max-height: 120px;
  font-weight: 600;
}

.chat-input:focus { outline: none; border-color: var(--sky); }

.send-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--sky);
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}

.send-btn:active { transform: scale(0.92); }
.send-btn:disabled { background: var(--border); }

/* まとめエリア */
.summary-section {
  background: var(--sun-light);
  border: 3px solid var(--sun);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.summary-title {
  font-size: 14px;
  font-weight: 900;
  color: #B8860B;
  margin-bottom: 10px;
}

.summary-textarea {
  width: 100%;
  border: 2px solid var(--sun);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-size: 16px;
  font-family: inherit;
  font-weight: 600;
  resize: none;
  background: white;
  color: var(--text);
  min-height: 120px;
  line-height: 1.7;
}

.summary-textarea:focus { outline: none; border-color: #B8860B; }

/* ボタン */
.btn-big {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius);
  border: none;
  font-size: 17px;
  font-weight: 900;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.04em;
}

.btn-big:active { transform: scale(0.97); }

.btn-primary {
  background: linear-gradient(135deg, var(--sky), var(--purple));
  color: white;
}

.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border: 2px solid var(--border) !important;
  font-size: 14px;
  padding: 10px;
}

/* 日記一覧 */
.diary-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 2px solid var(--border);
  margin-bottom: 12px;
  overflow: hidden;
}

.diary-card-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 2px solid var(--border);
}

.diary-event-icon { font-size: 24px; }

.diary-date {
  font-size: 13px;
  color: var(--text-sub);
  font-weight: 700;
}

.diary-event-label {
  font-size: 12px;
  background: var(--sky-light);
  color: var(--sky);
  padding: 2px 8px;
  border-radius: 8px;
  font-weight: 700;
}

.diary-body {
  padding: 14px 16px;
  font-size: 15px;
  line-height: 1.8;
  font-weight: 600;
  color: var(--text);
}

.diary-comment-area {
  background: var(--pink-light);
  border-top: 2px solid var(--border);
  padding: 12px 16px;
}

.diary-comment-label {
  font-size: 11px;
  font-weight: 900;
  color: var(--pink);
  margin-bottom: 6px;
}

.diary-comment-text {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.6;
  white-space: pre-wrap;
}

.diary-comment-input {
  width: 100%;
  border: 2px solid var(--pink);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  resize: none;
  background: white;
  color: var(--text);
  min-height: 60px;
}

.diary-comment-input:focus { outline: none; }

.btn-comment-save {
  margin-top: 6px;
  background: var(--pink);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

/* 空状態 */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-sub);
}

.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; line-height: 1.8; font-weight: 600; }

/* ステップ表示 */
.step-indicator {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}

.step-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.2s;
}

.step-dot.active { background: var(--sky); transform: scale(1.3); }
.step-dot.done { background: var(--grass); }

/* トースト */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: white;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 700;
  opacity: 0;
  transition: all 0.2s;
  z-index: 300;
  pointer-events: none;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-title">🌟 きょうのにっき</div>
  <div class="app-subtitle">きょうあったことをはなしてね</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('write')">✏️ かく</div>
  <div class="tab" onclick="switchTab('list')">📖 よむ</div>
</div>

<!-- かくタブ -->
<div id="tab-write" class="tab-content active">

  <!-- ステップ0: 日付確認 -->
  <div id="step0">
    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>
    <div class="section-title">きょうは なんにち？</div>
    <div id="dateButtonArea" style="margin-bottom:20px;text-align:center;"></div>
    <button class="btn-big btn-primary" onclick="confirmDate()" id="dateBtn" disabled style="opacity:0.4;">
      これ！ →
    </button>
  </div>

  <!-- ステップ1: 事象選択 -->
  <div id="step1" style="display:none;">
    <div class="step-indicator">
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
      <div class="step-dot"></div>

    </div>
    <div class="section-title">きょうは どんなことが<br>あったかな？</div>
    <div class="event-grid">
      <div class="event-card" onclick="selectEvent('がっこう', '🏫')">
        <span class="event-icon">🏫</span>
        <div class="event-label">がっこう</div>
      </div>
      <div class="event-card" onclick="selectEvent('ともだち', '👫')">
        <span class="event-icon">👫</span>
        <div class="event-label">ともだち</div>
      </div>
      <div class="event-card" onclick="selectEvent('べんきょう', '📚')">
        <span class="event-icon">📚</span>
        <div class="event-label">べんきょう</div>
      </div>
      <div class="event-card" onclick="selectEvent('あそび', '⚽')">
        <span class="event-icon">⚽</span>
        <div class="event-label">あそび</div>
      </div>
      <div class="event-card" onclick="selectEvent('たべもの', '🍜')">
        <span class="event-icon">🍜</span>
        <div class="event-label">たべもの</div>
      </div>
      <div class="event-card" onclick="selectEvent('そのほか', '✨')">
        <span class="event-icon">✨</span>
        <div class="event-label">そのほか</div>
      </div>
    </div>
    <button class="btn-big btn-primary" onclick="startChat()" id="startBtn" disabled style="opacity:0.4;">
      つぎへ →
    </button>
  </div>

  <!-- ステップ2: 対話 -->
  <div id="step2" style="display:none;">
    <div class="step-indicator">
      <div class="step-dot done"></div>
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
    </div>
    <div class="chat-area">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="こたえをかいてね…" rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
    <button class="btn-big btn-secondary" onclick="requestSummary()" id="summaryBtn" style="display:none;">
      ✨ まとめてもらう
    </button>
  </div>

  <!-- ステップ3: まとめ・保存 -->
  <div id="step3" style="display:none;">
    <div class="step-indicator">
      <div class="step-dot done"></div>
      <div class="step-dot done"></div>
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
    </div>
    <div class="section-title" style="font-size:16px;">AIがまとめてくれたよ！<br>なおしてもいいよ✏️</div>
    <div class="summary-section">
      <div class="summary-title" id="summaryTitle">📝 のにっき</div>
      <textarea class="summary-textarea" id="summaryText" placeholder="まとめをよみこんでいるよ…"></textarea>
    </div>
    <button class="btn-big btn-primary" onclick="saveDiary()" style="margin-bottom:10px;">
      💾 ほぞんする
    </button>
    <button class="btn-big btn-secondary" onclick="resetWrite()">
      もういちど
    </button>
  </div>
</div>

<!-- よむタブ -->
<div id="tab-list" class="tab-content">
  <div id="diaryList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 状態管理 =====
let selectedEvent = null;
let selectedEventIcon = null;
let chatHistory = [];
let turnCount = 0;
const MAX_TURNS = 3;
let selectedDate = null; // 選択した日付

// ===== 日付ボタン生成 =====
function initDateButtons() {
  const today = new Date();
  const area = document.getElementById('dateButtonArea');
  // 今日・昨日・一昨日の3つを表示
  const dates = [0, 1, 2].map(offset => {
    const d = new Date(today);
    d.setDate(today.getDate() - offset);
    return d;
  });
  const days = ['にち', 'げつ', 'か', 'すい', 'もく', 'きん', 'ど'];
  area.innerHTML = dates.map(d => {
    const label = d.getDate() === today.getDate() && d.getMonth() === today.getMonth()
      ? 'きょう' : d.getDate() === today.getDate() - 1 ? 'きのう' : 'おとつい';
    const dateStr = `${d.getMonth()+1}がつ${d.getDate()}にち（${days[d.getDay()]}）`;
    const iso = d.toISOString().split('T')[0];
    return `<div style="margin-bottom:10px;">
      <button onclick="selectDate('${iso}', '${d.getMonth()+1}がつ${d.getDate()}にち')" 
        id="datebtn-${iso}"
        style="width:100%;padding:16px;border-radius:20px;border:3px solid var(--border);
               background:white;font-size:17px;font-weight:900;font-family:inherit;cursor:pointer;
               transition:all 0.15s;">
        ${label}・${dateStr}
      </button>
    </div>`;
  }).join('');
}

function selectDate(iso, label) {
  selectedDate = { iso, label };
  document.querySelectorAll('[id^="datebtn-"]').forEach(btn => {
    btn.style.background = 'white';
    btn.style.borderColor = 'var(--border)';
    btn.style.color = 'var(--text)';
  });
  const btn = document.getElementById('datebtn-' + iso);
  btn.style.background = 'var(--sky)';
  btn.style.borderColor = 'var(--sky)';
  btn.style.color = 'white';
  const dateBtn = document.getElementById('dateBtn');
  dateBtn.disabled = false;
  dateBtn.style.opacity = '1';
}

function confirmDate() {
  if (!selectedDate) return;
  document.getElementById('step0').style.display = 'none';
  document.getElementById('step1').style.display = 'block';
}

// ===== 事象選択 =====
function selectEvent(event, icon) {
  selectedEvent = event;
  selectedEventIcon = icon;
  document.querySelectorAll('.event-card').forEach(c => c.classList.remove('selected'));
  event && document.querySelectorAll('.event-card').forEach(c => {
    if (c.querySelector('.event-label').textContent === event) c.classList.add('selected');
  });
  const btn = document.getElementById('startBtn');
  btn.disabled = false;
  btn.style.opacity = '1';
}

const GAS_URL = 'https://script.google.com/macros/s/AKfycbz18HCdEiaNlNEQyJvXahpfQKBuciIW6vif-ZTSwiesJFdYagOA75gdSLH064Dap_YHkA/exec';

// ===== AI呼び出し =====
async function callAI(system, messages) {
  try {
    const response = await fetch(GAS_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 300,
        system: system,
        messages: messages.length > 0 ? messages : [{ role: 'user', content: 'はじめて' }]
      })
    });
    const data = await response.json();
    return data.content?.[0]?.text || 'ごめんね、もういちどためしてね。';
  } catch (e) {
    return 'ごめんね、エラーがおきたよ。';
  }
}

// ===== 対話開始 =====
async function startChat() {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  chatHistory = [];
  turnCount = 0;

  const system = `あなたは小学1年生の子どもとはなすやさしいともだちです。
こどもが「${selectedEvent}」についてはなしてくれます。
ルール：
- すべてひらがなとカタカナと数字だけ（かんじはつかわない）
- 1かいのへんじは1〜2ぶんだけ
- やさしく、たのしく、こどもがはなしやすいふんいきで
- さいしょのひとことで「${selectedEvent}」についてしつもんしてね`;

  addMessage('ai', '…');
  document.getElementById('chatMessages').lastElementChild.querySelector('.msg-bubble').classList.add('loading');
  const first = await callAI(system, []);
  document.getElementById('chatMessages').lastElementChild.remove();
  addMessage('ai', first);
  chatHistory.push({ role: 'assistant', content: first });
}

// ===== メッセージ送信 =====
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  chatHistory.push({ role: 'user', content: text });
  turnCount++;

  document.getElementById('sendBtn').disabled = true;

  const system = `あなたは小学1年生の子どもとはなすやさしいともだちです。
こどもが「${selectedEvent}」についてはなしてくれています。
ルール：
- すべてひらがなとカタカナと数字だけ（かんじはつかわない）
- 1かいのへんじは1〜2ぶんだけ
- やさしく、たのしく、こどもがはなしやすいふんいきで
- こどものへんじをほめて、もっとはなしたくなるようにする
- かいわのなかで「そのとき、どんなきもちだった？」など、きもちをきく
- ${MAX_TURNS}かいやりとりしたら「まとめてみよう！」とさそってね`;

  addMessage('ai', '…');
  document.getElementById('chatMessages').lastElementChild.querySelector('.msg-bubble').classList.add('loading');
  const reply = await callAI(system, chatHistory);
  document.getElementById('chatMessages').lastElementChild.remove();
  addMessage('ai', reply);
  chatHistory.push({ role: 'assistant', content: reply });

  document.getElementById('sendBtn').disabled = false;

  if (turnCount >= MAX_TURNS) {
    document.getElementById('summaryBtn').style.display = 'block';
  }
}

// ===== まとめ生成 =====
async function requestSummary() {
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'block';
  document.getElementById('summaryText').value = 'まとめをつくっているよ…';
  if (selectedDate) {
    document.getElementById('summaryTitle').textContent = `📝 ${selectedDate.label}のにっき`;
  }

  const system = `このかいわをもとに、しょうがく1ねんせいのこどもがかいたにっきとしてまとめてください。
ルール：
- すべてひらがなとカタカナと数字だけ（かんじなし）
- 「きょう、〜したよ。〜だったよ。」のようなこどもめせんのいちにんしょう
- 3〜4ぶんでまとめる
- きもちもいれる
- あたたかくてやさしいぶんしょうに`;

  const messages = [...chatHistory, { role: 'user', content: 'これまでのかいわをにっきにまとめてください。' }];
  const summary = await callAI(system, messages);
  document.getElementById('summaryText').value = summary;
}

// ===== メッセージ追加 =====
function addMessage(role, text) {
  const area = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    ${role === 'ai' ? '<div class="msg-avatar">🌟</div>' : ''}
    <div class="msg-bubble">${text}</div>
    ${role === 'user' ? '<div class="msg-avatar">😊</div>' : ''}
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// ===== 保存 =====
async function saveDiary() {
  const text = document.getElementById('summaryText').value.trim();
  if (!text) { showToast('にっきをかいてね'); return; }

  const diaryRef = window._dbRef('diary');
  const newEntry = window._dbPush(diaryRef);

  const entry = {
    id: newEntry.key,
    date: selectedDate ? selectedDate.iso : new Date().toISOString().split('T')[0],
    dateLabel: selectedDate ? selectedDate.label : '',
    createdAt: new Date().toISOString(),
    event: selectedEvent,
    eventIcon: selectedEventIcon,
    body: text,
    chat: chatHistory,
    parentComment: '',
  };

  await window._dbSet(newEntry, entry);
  showToast('💾 ほぞんできたよ！');
  resetWrite();
  switchTab('list');
}
// ===== リセット =====
function resetWrite() {
  selectedEvent = null;
  selectedEventIcon = null;
  selectedDate = null;
  chatHistory = [];
  turnCount = 0;
  document.querySelectorAll('.event-card').forEach(c => c.classList.remove('selected'));
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.style.opacity = '0.4';
  const dateBtn = document.getElementById('dateBtn');
  dateBtn.disabled = true;
  dateBtn.style.opacity = '0.4';
  document.getElementById('step0').style.display = 'block';
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'none';
  document.getElementById('summaryBtn').style.display = 'none';
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('summaryText').value = '';
  initDateButtons();
}

// ===== タブ切替 =====
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['write','list'][i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'list') renderList();
}

// ===== 日記一覧 =====
function renderList() {
  const listEl = document.getElementById('diaryList');
  listEl.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>よみこんでいるよ…</p></div>';
  try {
    window._dbOnValue(window._dbRef('diary'), (snap) => {
      if (!snap.exists()) {
        listEl.innerHTML = `<div class="empty-state"><div class="icon">📒</div><p>にっきがまだないよ。<br>「かく」タブからかいてみよう！</p></div>`;
        return;
      }
      const entries = [];
      snap.forEach(child => entries.push(child.val()));
      entries.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));

      listEl.innerHTML = entries.map(e => {
        const d = new Date(e.createdAt || e.date);
        const dateStr = e.dateLabel || `${d.getFullYear()}ねん ${d.getMonth()+1}がつ ${d.getDate()}にち`;
        const hasComment = e.parentComment && e.parentComment.trim();
        return `<div class="diary-card">
          <div class="diary-card-header">
            <span class="diary-event-icon">${e.eventIcon}</span>
            <div>
              <div class="diary-date">${dateStr}</div>
              <span class="diary-event-label">${e.event}</span>
            </div>
          </div>
          <div class="diary-body">${e.body.replace(/\n/g,'<br>')}</div>
          <div class="diary-comment-area">
            <div class="diary-comment-label">💌 おやからのコメント</div>
            ${hasComment
              ? `<div class="diary-comment-text">${e.parentComment}</div>
                 <textarea class="diary-comment-input" id="comment-${e.id}" style="margin-top:8px;">${e.parentComment}</textarea>
                 <button class="btn-comment-save" onclick="saveComment('${e.id}')">こうしん</button>`
              : `<textarea class="diary-comment-input" id="comment-${e.id}" placeholder="コメントをかいてあげよう…"></textarea>
                 <button class="btn-comment-save" onclick="saveComment('${e.id}')">おくる</button>`
            }
          </div>
        </div>`;
      }).join('');
    });
  } catch(e) {
    listEl.innerHTML = `<div class="empty-state"><div class="icon">😢</div><p>よみこみに しっぱいしたよ。<br>もういちど ためしてね。</p></div>`;
  }
}

async function saveComment(id) {
  const text = document.getElementById('comment-' + id).value;
  await window._dbSet(window._dbRef(`diary/${id}/parentComment`), text);
  showToast('💌 コメントをおくったよ！');
  renderList();
}

// ===== トースト =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 初期化 =====
let _appInitialized = false;
function initApp() {
  if (_appInitialized) return;
  _appInitialized = true;
  initDateButtons();
  const input = document.getElementById('chatInput');
  if (input) {
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
    });
  }
}

// Firebase準備完了後に初期化
window.addEventListener('firebaseReady', initApp);
if (window._dbRef) initApp();
</script>
