<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奈良時代テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#3468a6;
  --accent-light:#e8f0fa;
  --ref:#7a5ea8;
  --ref-light:#f1ecf8;
  --good:#2f9e5b;
  --good-light:#e6f6ec;
  --bad:#d1453b;
  --bad-light:#fbe9e8;
  --ink:#22303f;
  --sub:#5c6b7a;
  --line:#dbe3ec;
  --bg:#f5f7fa;
  --card:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Zen Kaku Gothic New",sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}
.header{
  padding:16px 18px 12px;
  background:linear-gradient(135deg,var(--accent),#4d7dbf);
  color:#fff;
  position:sticky;
  top:0;
  z-index:5;
}
.header h1{
  margin:0;
  font-size:18px;
  font-weight:900;
  letter-spacing:.02em;
}
.header .sub{
  margin-top:2px;
  font-size:12px;
  opacity:.9;
}
.content{
  flex:1;
  padding:14px 16px 90px;
}
.home-title{
  font-size:14px;
  font-weight:800;
  color:var(--sub);
  margin:18px 2px 10px;
}
.home-title:first-child{margin-top:2px;}
.stage-card{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 2px 8px rgba(30,50,80,.08);
  padding:16px;
  margin-bottom:14px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .1s;
}
.stage-card:active{transform:scale(.98);}
.stage-card.ref{
  border-color:var(--ref);
  background:linear-gradient(180deg,#fff,var(--ref-light));
}
.stage-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.stage-name{
  font-size:16px;
  font-weight:700;
}
.stage-badge{
  font-size:11px;
  background:var(--accent);
  color:#fff;
  padding:3px 8px;
  border-radius:999px;
  font-weight:700;
  white-space:nowrap;
  margin-left:8px;
}
.stage-card.ref .stage-badge{background:var(--ref);}
.stage-desc{
  font-size:12.5px;
  color:var(--sub);
  margin-top:6px;
  line-height:1.5;
}
.progress-bar{
  height:6px;
  background:var(--line);
  border-radius:99px;
  margin-top:10px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),#4d7dbf);
  border-radius:99px;
  transition:width .3s;
}
.retry-btn{
  margin-top:10px;
  display:inline-block;
  background:var(--bad-light);
  color:var(--bad);
  border:1px solid var(--bad);
  border-radius:8px;
  padding:6px 10px;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}
.footer-note{
  text-align:center;
  font-size:11px;
  color:var(--sub);
  margin-top:22px;
}
.reset-all-btn{
  width:100%;
  margin-top:18px;
  padding:11px;
  border-radius:10px;
  background:none;
  border:1px solid var(--bad);
  color:var(--bad);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
}
.play-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--sub);
  margin-bottom:12px;
}
.qcard{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(30,50,80,.08);
  border:1px solid var(--line);
  margin-bottom:16px;
}
.qcard.info{
  background:linear-gradient(180deg,#fff,var(--ref-light));
  border-color:var(--ref);
}
.qtitle{
  font-size:16px;
  font-weight:800;
  margin-bottom:10px;
  color:var(--ref);
}
.info-body{
  font-size:14px;
  line-height:1.9;
  color:var(--ink);
}
.info-body p{margin:0 0 12px;}
.info-body p:last-child{margin-bottom:0;}
.src-tag{
  margin-top:12px;
  font-size:11.5px;
  color:var(--sub);
}
.lead-badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  color:var(--accent);
  background:var(--accent-light);
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:10px;
}
.qtext{
  font-size:15px;
  font-weight:700;
  line-height:1.7;
  margin-bottom:16px;
}
.choice-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.choice-btn{
  width:100%;
  text-align:left;
  padding:13px 14px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-size:14px;
  font-family:inherit;
  font-weight:600;
  cursor:pointer;
}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct{border-color:var(--good);background:var(--good-light);color:#1c6b3f;}
.choice-btn.wrong{border-color:var(--bad);background:var(--bad-light);color:#9c3128;}
.choice-btn.dim{opacity:.4;}
.fill-input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1.5px solid var(--line);
  font-size:15px;
  font-family:inherit;
  margin-bottom:14px;
}
.fill-input.correct{border-color:var(--good);background:var(--good-light);}
.fill-input.wrong{border-color:var(--bad);background:var(--bad-light);}
.explain-box{
  border-radius:12px;
  padding:14px;
  font-size:13px;
  line-height:1.8;
  margin-bottom:14px;
}
.explain-box.good{background:var(--good-light);color:#1c6b3f;}
.explain-box.bad{background:var(--bad-light);color:#9c3128;}
.mark-icon{font-size:15px;margin-right:6px;}
.btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:15px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),#4d7dbf);color:#fff;}
.btn-ref{background:linear-gradient(135deg,var(--ref),#9678c2);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
.btn-danger-outline{background:var(--bad-light);border:1.5px solid var(--bad);color:var(--bad);}
.result-actions{display:flex;gap:10px;margin-top:4px;}
.result-actions .btn{flex:1;}
.result-box{text-align:center;}
.result-score{
  font-size:44px;
  font-weight:900;
  color:var(--accent);
  margin:8px 0;
}
.wrong-list{margin-top:14px;text-align:left;}
.wrong-list-label{font-size:12px;color:var(--sub);margin-bottom:6px;}
.wrong-item{
  padding:10px 12px;
  border-radius:10px;
  background:var(--bad-light);
  color:#9c3128;
  margin-bottom:8px;
  font-size:13px;
  line-height:1.6;
}
.perfect-msg{color:var(--good);font-weight:800;margin-top:10px;font-size:14px;}
.speak-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
}
.speak-btn{
  border:1.5px solid var(--ref);
  background:#fff;
  color:var(--ref);
  border-radius:999px;
  padding:8px 16px;
  font-size:13px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  white-space:nowrap;
}
.speak-btn.playing{background:var(--ref);color:#fff;}
.speed-control{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--sub);
}
.speed-control input[type=range]{
  width:92px;
  accent-color:var(--ref);
}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== 単元データ：柱の定義 ===================== */
const PILLARS = {
  1: {label:"① 律令政治", full:"律令政治"},
  2: {label:"② 移された都", full:"移された都"},
  3: {label:"③ 聖武天皇と仏教", full:"聖武天皇と仏教"},
  4: {label:"④ 農民の生活と新しい土地政策", full:"農民の生活と新しい土地政策"},
  5: {label:"⑤ 海をわたった人々", full:"海をわたった人々"},
  6: {label:"⑥ 天平文化", full:"天平文化"}
};

/* ===================== ①構造テスト：概要画面 ===================== */
const kihonOverviewScreens = [
  {
    title:"はじめに",
    body:`<p>今回のテーマは「奈良時代」です。710年に奈良の平城京に都が移されてから、794年に平安京に都が移されるまでの約80年間を奈良時代といいます。</p><p>聖武天皇のころには、災害やききん、伝染病、貴族の反乱が相次ぎ、世の中に不安が広がっていました。聖武天皇は、仏教の力で国を治めようと、743年に東大寺の大仏をつくる命令を出しました。</p><p>この回では、律令政治のしくみ、都の移り変わり、聖武天皇と仏教、農民の生活と土地政策、海をわたった人々、天平文化という、6つの視点から奈良時代を学びます。</p>`,
    speak:"今回のテーマは、奈良時代です。710年に奈良の平城京に都が移されてから、794年に平安京に都が移されるまでの約80年間を、奈良時代といいます。聖武天皇のころには、災害やききん、伝染病、貴族の反乱が相次ぎ、世の中に不安が広がっていました。聖武天皇は、仏教の力で国を治めようと、743年に東大寺の大仏をつくる命令を出しました。この回では、律令政治のしくみ、都の移り変わり、聖武天皇と仏教、農民の生活と土地政策、海をわたった人々、天平文化という、6つの視点から奈良時代を学んでいきます。"
  },
  {
    title:"6つの柱",
    body:`<p><b>① 律令政治</b><br>大宝律令の制定、二官八省のしくみ、地方の政治、租・調・庸などの税や兵役について学びます。</p><p><b>② 移された都</b><br>710年に平城京へ都が移されたことと、都と国府を結ぶ道について学びます。</p><p><b>③ 聖武天皇と仏教</b><br>国分寺・国分尼寺、東大寺の大仏、行基や道鏡など、仏教を中心とした政治について学びます。</p><p><b>④ 農民の生活と新しい土地政策</b><br>農民の苦しい生活と、三世一身の法・墾田永年私財法による土地政策の変化を学びます。</p><p><b>⑤ 海をわたった人々</b><br>遣唐使の航路や、阿倍仲麻呂・鑑真など、海をわたった人々について学びます。</p><p><b>⑥ 天平文化</b><br>『古事記』『日本書紀』『万葉集』などの書物や、正倉院の宝物など、天平文化について学びます。</p>`,
    speak:"この回は、大きく6つの柱に分かれています。1つ目は、律令政治です。大宝律令の制定や、二官八省のしくみ、地方の政治、租・調・庸などの税や兵役について学びます。2つ目は、移された都です。710年に平城京へ都が移されたことと、都と国府を結ぶ道について学びます。3つ目は、聖武天皇と仏教です。国分寺・国分尼寺、東大寺の大仏、行基や道鏡など、仏教を中心とした政治について学びます。4つ目は、農民の生活と新しい土地政策です。農民の苦しい生活と、三世一身の法、墾田永年私財法による土地政策の変化を学びます。5つ目は、海をわたった人々です。遣唐使の航路や、阿倍仲麻呂、鑑真など、海をわたった人々について学びます。6つ目は、天平文化です。古事記、日本書紀、万葉集などの書物や、正倉院の宝物など、天平文化について学びます。それでは、順番に見ていきましょう。"
  }
];

/* ===================== ①構造テスト：穴埋め ===================== */
const kihonFillRaw = [
  {pillar:1, q:"701年、唐の律令にならって定められ、天皇を中心とする政治のしくみを完成させた法律を何といいますか。", answer:"大宝律令", explain:"大宝律令によって、大化の改新がめざした天皇を中心とする政治のしくみが完成した。"},
  {pillar:1, q:"律令にもとづいて行われる政治を何といいますか。", answer:"律令政治", explain:"大宝律令の制定後、律令政治が本格的に行われるようになった。"},
  {pillar:1, q:"朝廷が6年ごとに戸籍をつくり、それにもとづいて口分田をあたえたきまりを何といいますか。", answer:"班田収授の法", explain:"6歳以上の男子に2段、女子にはその3分の2の口分田があたえられた。"},
  {pillar:1, q:"収穫の約3％の稲を地方の役所に納める税を何といいますか。", answer:"租", explain:"租は口分田にかける税で、女子も負担した。"},
  {pillar:2, q:"710年、奈良に都が移されたときの天皇は誰ですか。", answer:"元明天皇", explain:"女性の元明天皇のとき、飛鳥の藤原京から奈良の平城京に都が移された。"},
  {pillar:2, q:"710年に奈良に置かれた都を何といいますか。", answer:"平城京", explain:"平城京は、唐の都・長安にならってつくられた都である。"},
  {pillar:2, q:"平城京は、唐の都の何にならってつくられましたか。", answer:"長安", explain:"長安は現在の西安にあたる。"},
  {pillar:2, q:"平城京から平安京に都が移されるまでの約80年間を何といいますか。", answer:"奈良時代", explain:"奈良時代は710年から794年までの約80年間をさす。"},
  {pillar:3, q:"741年、国ごとに国分寺と国分尼寺を建てるよう命じた天皇は誰ですか。", answer:"聖武天皇", explain:"聖武天皇は、世の中の不安を仏教の力でしずめようとした。"},
  {pillar:3, q:"743年、聖武天皇が大仏をつくる命令を出した、総国分寺である寺を何といいますか。", answer:"東大寺", explain:"大仏の完成式典は752年に行われた。"},
  {pillar:3, q:"各地で池や橋・道路をつくり、人々に仏教を説いたが、朝廷から活動を禁じられた僧は誰ですか。", answer:"行基", explain:"のちに大仏づくりの事業に参加し、僧として最高の位をあたえられた。"},
  {pillar:3, q:"寺院の勢力が強くなり、政治に口出しをするようになった僧は誰ですか。", answer:"道鏡", explain:"このため律令政治は次第に乱れていった。"},
  {pillar:4, q:"貧しい農民の生活を「貧窮問答歌」によんだ貴族は誰ですか。", answer:"山上憶良", explain:"「貧窮問答歌」は『万葉集』に収められている。"},
  {pillar:4, q:"「貧窮問答歌」が収められている、奈良時代の和歌集は何ですか。", answer:"万葉集", explain:"『万葉集』は現存する日本最古の和歌集である。"},
  {pillar:4, q:"723年に定められた、新しく開墾した土地を3代まで私有できるきまりを何といいますか。", answer:"三世一身の法", explain:"開墾が期待したほどすすまなかったため、後に墾田永年私財法が出された。"},
  {pillar:4, q:"743年に聖武天皇が定めた、開墾した田を永久に自分のものにしてよいというきまりを何といいますか。", answer:"墾田永年私財法", explain:"このきまりのあと、力のある貴族や寺社が私有地（荘園）を増やしていった。"},
  {pillar:5, q:"630年、第1回の遣唐使として送られた人物は誰ですか。", answer:"犬上御田鍬", explain:"朝廷は唐のすすんだ制度や文化を取り入れるため遣唐使を送った。"},
  {pillar:5, q:"留学生として唐に渡ったが、帰国できず唐の皇帝に一生仕えた人物は誰ですか。", answer:"阿倍仲麻呂", explain:"仲麻呂はふるさとをしのび、三笠の山にのぼった月をよんだ和歌を残した。"},
  {pillar:5, q:"失敗を重ねて失明しながらも、6度目の航海で日本にたどり着いた唐の高僧は誰ですか。", answer:"鑑真", explain:"来日した鑑真は、日本の僧の制度を整えた。"},
  {pillar:5, q:"鑑真が奈良に開いた寺を何といいますか。", answer:"唐招提寺", explain:"鑑真は日本で亡くなった。"},
  {pillar:6, q:"奈良時代で最も文化が栄えた聖武天皇のころの元号にちなんで名づけられた文化を何といいますか。", answer:"天平文化", explain:"遣唐使によって唐の文化がもたらされ、仏教の影響を受けた貴族中心の文化である。"},
  {pillar:6, q:"712年につくられた歴史書を何といいますか。", answer:"古事記", explain:"神話や伝承・記録などをもとにつくられた。"},
  {pillar:6, q:"720年につくられた歴史書を何といいますか。", answer:"日本書紀", explain:"『古事記』の8年後につくられた。"},
  {pillar:6, q:"現存する日本最古の和歌集を何といいますか。", answer:"万葉集", explain:"天皇から一般の人々まで、さまざまな身分の人がよんだ約4500首の和歌が収められている。"}
];

/* ===================== ①構造テスト：まとめ選択 ===================== */
const kihonFinalRaw = [
  {pillar:1, q:"律令政治のしくみとして正しいものはどれですか。", choices:["天皇のもとに二官八省が置かれ、地方は国・郡・里に分けられた","天皇のもとに三権分立のしくみが置かれた","地方には貴族が派遣され、都には豪族が置かれた","律令政治には税のきまりはなかった"], answer:0, explain:"国の政治は天皇のもとに二官八省、地方の政治は国・郡・里に分けられ、国司・郡司・里長が置かれた。"},
  {pillar:2, q:"平城京について正しいものはどれですか。", choices:["唐の都・長安にならってつくられた、碁盤の目のような計画都市である","日本で独自に考案された、円形の都市である","唐からの影響は受けていない","平安京よりも東にある都である"], answer:0, explain:"平城京は唐の都・長安にならってつくられ、南北に走る朱雀大路を中心に道路が碁盤の目のようにつくられた。"},

/* ===================== 共通ビルド関数 ===================== */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function finalize(q){
  const correctText = q.choices[q.answer];
  const order = shuffleArr(q.choices.map((c,i)=>i));
  const newChoices = order.map(i=>q.choices[i]);
  const newAnswer = newChoices.indexOf(correctText);
  const out = Object.assign({}, q, {choices:newChoices, answer:newAnswer});
  return out;
}

function normalizeAnswer(str){
  if(str===undefined || str===null) return "";
  let s = String(str).trim();
  s = s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  s = s.replace(/\s+/g,"");
  s = s.replace(/[『』「」]/g,"");
  return s;
}

function checkFillAnswer(item, userInput){
  const norm = normalizeAnswer(userInput);
  if(norm==="") return false;
  const candidates = [item.answer].concat(item.accept||[]);
  return candidates.some(c => normalizeAnswer(c)===norm);
}

function shuffleArrKeepBlocks(){
  const byPillar = {};
  kihonFillRaw.forEach((r,idx)=>{
    if(!byPillar[r.pillar]) byPillar[r.pillar]=[];
    byPillar[r.pillar].push(idx);
  });
  let out = [];
  [1,2,3,4,5,6].forEach(p=>{
    const idxs = shuffleArr(byPillar[p]||[]);
    idxs.forEach(idx=>{
      const r = kihonFillRaw[idx];
      out.push({
        type:"fill", id:"kihonFill_"+idx, q:r.q, answer:r.answer, accept:r.accept,
        explain:r.explain, lead:PILLARS[r.pillar].label, sub:PILLARS[r.pillar].full, pillar:r.pillar
      });
    });
  });
  return out;
}

function buildKihonFinalItems(){
  return kihonFinalRaw.map((r,idx)=>{
    const fq = finalize({q:r.q, choices:r.choices, answer:r.answer, explain:r.explain});
    return Object.assign({type:"choice", id:"kihonFinal_"+idx, pillar:r.pillar, sub:PILLARS[r.pillar].full}, fq);
  });
}

function buildKihonItems(){
  const overview = kihonOverviewScreens.map((s,idx)=>Object.assign({id:"kihonOv_"+idx, type:"info", wide:true}, s));
  const fills = shuffleArrKeepBlocks();
  const finals = shuffleArr(buildKihonFinalItems());
  return overview.concat(fills, finals);
}

function buildKurojiItems(){
  let out = [];
  kurojiBlocks.forEach((block,bi)=>{
    const shuffledItems = shuffleArr(block.items);
    shuffledItems.forEach((it,ii)=>{
      const fq = finalize(it);
      out.push(Object.assign({
        type:"choice",
        id:"kuroji_"+bi+"_"+ii,
        pillar:block.pillar,
        sub:block.sub
      }, fq));
    });
  });
  return out;
}

function buildMameItems(){
  const shuffled = shuffleArr(mameQuizRaw);
  return shuffled.map((r,idx)=>{
    const fq = finalize(r);
    return Object.assign({type:"choice", id:"mame_"+idx}, fq);
  });
}

function buildSankoItems(){
  return sankoNotes.map((n,idx)=>({
    type:"info", id:"sanko_"+idx, title:n.title, body:n.body, src:n.src, wide:true
  }));
}

/* ===================== 状態管理／localStorage ===================== */
const STORAGE_KEY = "narajidai_missed_v1";

function loadMissedStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveMissedStore(store){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){ /* 保存できない環境は無視 */ }
}

const SPEAK_RATE_KEY = "quizapp_speak_rate_v1";
function loadSpeakRate(){
  try{
    const v = parseFloat(localStorage.getItem(SPEAK_RATE_KEY));
    if(!isNaN(v) && v>=0.7 && v<=1.8) return v;
  }catch(e){}
  return 1.1;
}
function saveSpeakRate(v){
  try{ localStorage.setItem(SPEAK_RATE_KEY, String(v)); }catch(e){}
}

const state = {
  screen:"home",
  stageId:null,
  isRetry:false,
  items:[],
  currentIndex:0,
  scoreTotal:0,
  scoreCorrect:0,
  answerLog:[],
  results:{},
  missedStore: loadMissedStore(),
  answered:false,
  userInput:"",
  userChoiceIdx:null,
  speakRate: loadSpeakRate()
};

function startStage(stageId){
  const stage = STAGES.find(s=>s.id===stageId);
  state.stageId = stageId;
  state.isRetry = false;
  state.items = stage.build();
  state.currentIndex = 0;
  state.scoreTotal = state.items.filter(i=>i.type!=="info").length;
  state.scoreCorrect = 0;
  state.answerLog = [];
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  state.screen = "play";
  render();
}

function startRetry(stageId){
  const missed = state.missedStore[stageId] || {};
  const items = Object.values(missed);
  if(items.length===0) return;
  state.stageId = stageId;
  state.isRetry = true;
  state.items = shuffleArr(items);
  state.currentIndex = 0;
  state.scoreTotal = state.items.length;
  state.scoreCorrect = 0;
  state.answerLog = [];
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  state.screen = "play";
  render();
}

function currentItem(){ return state.items[state.currentIndex]; }

function submitChoice(idx){
  if(state.answered) return;
  const item = currentItem();
  const correct = idx === item.answer;
  state.answered = true;
  state.userChoiceIdx = idx;
  if(correct) state.scoreCorrect++;
  state.answerLog.push({item, wasCorrect:correct});
}

function submitFill(){
  if(state.answered) return;
  const item = currentItem();
  const correct = checkFillAnswer(item, state.userInput);
  state.answered = true;
  if(correct) state.scoreCorrect++;
  state.answerLog.push({item, wasCorrect:correct});
}

function nextItem(){
  stopSpeak();
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  if(state.currentIndex < state.items.length-1){
    state.currentIndex++;
    render();
  }else{
    finishStage();
  }
}

function finishStage(){
  const stage = STAGES.find(s=>s.id===state.stageId);
  state.results[state.stageId] = {
    correct: state.scoreCorrect,
    total: state.scoreTotal,
    at: Date.now()
  };
  if(stage.scored){
    const missed = state.missedStore[state.stageId] || {};
    state.answerLog.forEach(log=>{
      const key = log.item.q;
      if(!log.wasCorrect){
        missed[key] = log.item;
      }else{
        if(missed[key]) delete missed[key];
      }
    });
    state.missedStore[state.stageId] = missed;
    saveMissedStore(state.missedStore);
  }
  state.screen = "result";
  render();
}

function backHome(){
  stopSpeak();
  stopMic();
  state.screen = "home";
  render();
}

/* ===================== 音声読み上げ（Web Speech API：読み上げ） ===================== */
let cachedVoices = [];

function speakSupported(){
  return typeof window!=="undefined" && "speechSynthesis" in window;
}

function refreshVoices(){
  if(speakSupported()) cachedVoices = window.speechSynthesis.getVoices() || [];
}
if(speakSupported()){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function getBestJaVoice(){
  const jaVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ja"));
  if(jaVoices.length===0) return null;
  const preferred = jaVoices.find(v => /google/i.test(v.name))
    || jaVoices.find(v => v.localService===false)
    || jaVoices[0];
  return preferred;
}

function speakText(text, btnId){
  if(!speakSupported()) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = state.speakRate;
  const voice = getBestJaVoice();
  if(voice) u.voice = voice;
  u.onend = ()=>{ setSpeakBtnState(btnId, false); };
  u.onerror = ()=>{ setSpeakBtnState(btnId, false); };
  window.speechSynthesis.speak(u);
  setSpeakBtnState(btnId, true);
}

function stopSpeak(){
  if(speakSupported()) window.speechSynthesis.cancel();
}

function toggleSpeak(text){
  if(!speakSupported()) return;
  if(window.speechSynthesis.speaking){
    stopSpeak();
    setSpeakBtnState("speakBtn", false);
  }else{
    speakText(text, "speakBtn");
  }
}

function updateSpeakRate(v){
  state.speakRate = parseFloat(v);
  saveSpeakRate(state.speakRate);
  const label = document.getElementById("speakRateLabel");
  if(label) label.textContent = state.speakRate.toFixed(1)+"倍";
}

function setSpeakBtnState(btnId, playing){
  const btn = document.getElementById(btnId);
  if(!btn) return;
  btn.classList.toggle("playing", playing);
  btn.innerHTML = playing ? "⏸ 読み上げを止める" : "🔊 音声で聞く";
}

    html += `<div class="qcard">`;
    if(item.lead) html += `<div class="lead-badge">${esc(item.lead)}</div>`;
    html += `<div class="qtext">${esc(item.q)}</div>`;

    }else{

      html += `<button class="btn btn-primary" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次の問題へ" : "結果を見る"}</button>`;
    }
    html += `</div>`;
  } else if(item.type==="choice"){
    html += `<div class="qcard">`;
    if(item.pillar!==undefined && item.pillar!==null) html += `<div class="lead-badge">${esc(pillarBadge(item.pillar))}</div>`;
    html += `<div class="qtext">${esc(item.q)}</div>`;
    html += `<div class="choice-list">`;
    item.choices.forEach((c,idx)=>{

      if(state.answered){
        if(idx===item.answer) cls += " correct";

  app.innerHTML = html;

    if(el) el.focus();
  }

      </div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="${state.isRetry ? `startRetry('${state.stageId}')` : `startStage('${state.stageId}')`}">もう一度</button>
        <button class="btn btn-outline" onclick="backHome()">ホームへ</button>
      </div>
      ${(!state.isRetry && missedCount>0) ? `<button class="btn btn-danger-outline" style="margin-top:10px;" onclick="startRetry('${state.stageId}')">🔁 苦手${missedCount}問を復習する</button>` : ""}
    </div>
  `;
  app.innerHTML = html;
}

function doResetAll(){
  state.missedStore = {};
  saveMissedStore(state.missedStore);
  const btn = document.getElementById("resetAllBtn");
  if(btn){
    btn.textContent = "✅ リセットしました";
    setTimeout(()=>{ renderHome(); }, 1200);
  }
}

render();
</script>
</body>
</html>
