<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>てこ・滑車・輪軸テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#3468a6;
  --accent-light:#e8f0fa;
  --ref:#7a5ea8;
  --ref-light:#f1ecf8;
  --good:#2f9e5b;
  --good-light:#e6f6ec;
  --bad:#d1453b;
  --bad-light:#fbe9e8;
  --ink:#22303f;
  --sub:#5c6b7a;
  --line:#dbe3ec;
  --bg:#f5f7fa;
  --card:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Zen Kaku Gothic New",sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}
.header{
  padding:16px 18px 12px;
  background:linear-gradient(135deg,var(--accent),#4d7dbf);
  color:#fff;
  position:sticky;
  top:0;
  z-index:5;
}
.header h1{
  margin:0;
  font-size:18px;
  font-weight:900;
  letter-spacing:.02em;
}
.header .sub{
  margin-top:2px;
  font-size:12px;
  opacity:.9;
}
.content{
  flex:1;
  padding:14px 16px 90px;
}
.home-title{
  font-size:14px;
  font-weight:800;
  color:var(--sub);
  margin:18px 2px 10px;
}
.home-title:first-child{margin-top:2px;}
.stage-card{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 2px 8px rgba(30,50,80,.08);
  padding:16px;
  margin-bottom:14px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .1s;
}
.stage-card:active{transform:scale(.98);}
.stage-card.ref{
  border-color:var(--ref);
  background:linear-gradient(180deg,#fff,var(--ref-light));
}
.stage-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.stage-name{
  font-size:16px;
  font-weight:700;
}
.stage-badge{
  font-size:11px;
  background:var(--accent);
  color:#fff;
  padding:3px 8px;
  border-radius:999px;
  font-weight:700;
  white-space:nowrap;
  margin-left:8px;
}
.stage-card.ref .stage-badge{background:var(--ref);}
.stage-desc{
  font-size:12.5px;
  color:var(--sub);
  margin-top:6px;
  line-height:1.5;
}
.progress-bar{
  height:6px;
  background:var(--line);
  border-radius:99px;
  margin-top:10px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),#4d7dbf);
  border-radius:99px;
  transition:width .3s;
}
.retry-btn{
  margin-top:10px;
  display:inline-block;
  background:var(--bad-light);
  color:var(--bad);
  border:1px solid var(--bad);
  border-radius:8px;
  padding:6px 10px;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}
.footer-note{
  text-align:center;
  font-size:11px;
  color:var(--sub);
  margin-top:22px;
}
.reset-all-btn{
  width:100%;
  margin-top:18px;
  padding:11px;
  border-radius:10px;
  background:none;
  border:1px solid var(--bad);
  color:var(--bad);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
}
.play-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--sub);
  margin-bottom:12px;
}
.qcard{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(30,50,80,.08);
  border:1px solid var(--line);
  margin-bottom:16px;
}
.qcard.info{
  background:linear-gradient(180deg,#fff,var(--ref-light));
  border-color:var(--ref);
}
.qtitle{
  font-size:16px;
  font-weight:800;
  margin-bottom:10px;
  color:var(--ref);
}
.info-body{
  font-size:14px;
  line-height:1.9;
  color:var(--ink);
}
.info-body p{margin:0 0 12px;}
.info-body p:last-child{margin-bottom:0;}
.src-tag{
  margin-top:12px;
  font-size:11.5px;
  color:var(--sub);
}
.lead-badge{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  color:var(--accent);
  background:var(--accent-light);
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:10px;
}
.qtext{
  font-size:15px;
  font-weight:700;
  line-height:1.7;
  margin-bottom:16px;
}
.choice-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.choice-btn{
  width:100%;
  text-align:left;
  padding:13px 14px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-size:14px;
  font-family:inherit;
  font-weight:600;
  cursor:pointer;
}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct{border-color:var(--good);background:var(--good-light);color:#1c6b3f;}
.choice-btn.wrong{border-color:var(--bad);background:var(--bad-light);color:#9c3128;}
.choice-btn.dim{opacity:.4;}
.fill-input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1.5px solid var(--line);
  font-size:15px;
  font-family:inherit;
  margin-bottom:14px;
}
.fill-input.correct{border-color:var(--good);background:var(--good-light);}
.fill-input.wrong{border-color:var(--bad);background:var(--bad-light);}
.explain-box{
  border-radius:12px;
  padding:14px;
  font-size:13px;
  line-height:1.8;
  margin-bottom:14px;
}
.explain-box.good{background:var(--good-light);color:#1c6b3f;}
.explain-box.bad{background:var(--bad-light);color:#9c3128;}
.mark-icon{font-size:15px;margin-right:6px;}
.btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:15px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),#4d7dbf);color:#fff;}
.btn-ref{background:linear-gradient(135deg,var(--ref),#9678c2);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
.btn-danger-outline{background:var(--bad-light);border:1.5px solid var(--bad);color:var(--bad);}
.result-actions{display:flex;gap:10px;margin-top:4px;}
.result-actions .btn{flex:1;}
.result-box{text-align:center;}
.result-score{
  font-size:44px;
  font-weight:900;
  color:var(--accent);
  margin:8px 0;
}
.wrong-list{margin-top:14px;text-align:left;}
.wrong-list-label{font-size:12px;color:var(--sub);margin-bottom:6px;}
.wrong-item{
  padding:10px 12px;
  border-radius:10px;
  background:var(--bad-light);
  color:#9c3128;
  margin-bottom:8px;
  font-size:13px;
  line-height:1.6;
}
.perfect-msg{color:var(--good);font-weight:800;margin-top:10px;font-size:14px;}
.speak-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
}
.speak-btn{
  border:1.5px solid var(--ref);
  background:#fff;
  color:var(--ref);
  border-radius:999px;
  padding:8px 16px;
  font-size:13px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  white-space:nowrap;
}
.speak-btn.playing{background:var(--ref);color:#fff;}
.speed-control{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--sub);
}
.speed-control input[type=range]{
  width:92px;
  accent-color:var(--ref);
}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== 単元データ：柱の定義 ===================== */
const PILLARS = {
  1: {label:"① てこのつり合い", full:"てこのつり合い"},
  2: {label:"② 滑車", full:"滑車"},
  3: {label:"③ 輪軸", full:"輪軸"}
};

/* ===================== ①構造テスト：概要画面 ===================== */
const kihonOverviewScreens = [
  {
    title:"はじめに",
    body:`<p>今回のテーマは「てこ・滑車・輪軸」です。これらは、小さな力で重い物を持ち上げたり、力の向きを変えたりするための道具で、日常生活のさまざまな場所で利用されています。</p><p>すべてに共通するのは、「かかる力×支点（または半径）からの距離」という考え方です。この回では、①てこのつり合い、②滑車のはたらき、③輪軸のつり合い、という3つの視点から学びます。</p>`,
    speak:"今回のテーマは、てこ・滑車・輪軸です。これらは、小さな力で重い物を持ち上げたり、力の向きを変えたりするための道具で、日常生活のさまざまな場所で利用されています。すべてに共通するのは、かかる力かける支点、または半径からの距離という考え方です。この回では、てこのつり合い、滑車のはたらき、輪軸のつり合いという、3つの視点から学んでいきます。"
  },
  {
    title:"3つの柱",
    body:`<p><b>① てこのつり合い</b><br>「かかる力×支点からの距離」で回そうとするはたらきを求め、左まわりと右まわりのはたらきのつり合いを計算します。</p><p><b>② 滑車</b><br>定滑車・動滑車のちがい、組み合わせ滑車での力と距離の関係、滑車の重さを考える場合の計算方法を学びます。</p><p><b>③ 輪軸</b><br>「かかる力×半径」で回すはたらきを考え、輪軸のつり合いや、回転とひもを引く距離の関係を学びます。</p>`,
    speak:"この回は、大きく3つの柱に分かれています。1つ目は、てこのつり合いです。かかる力かける支点からの距離で、回そうとするはたらきを求め、左まわりと右まわりのはたらきのつり合いを計算します。2つ目は、滑車です。定滑車と動滑車のちがいや、組み合わせ滑車での力と距離の関係、滑車の重さを考える場合の計算方法を学びます。3つ目は、輪軸です。かかる力かける半径で回すはたらきを考え、輪軸のつり合いや、回転とひもを引く距離の関係を学びます。それでは、順番に見ていきましょう。"
  }
];

/* ===================== ①構造テスト：穴埋め ===================== */
const kihonFillRaw = [
  {pillar:1, q:"てこを回そうとするはたらきは「かかる力×○○」で表されます。○○に入る言葉は何ですか。", answer:"支点からの距離", explain:"てこを回そうとするはたらきの大きさは、かかる力×支点からの距離で求められる。"},
  {pillar:1, q:"てこの計算で、棒の重さはどこにかき入れますか。", answer:"重心", explain:"棒の重さを考えるときは、重心にかかる力として書きこむ。"},
  {pillar:1, q:"支点から20cmの位置に30gのおもりをつるしたときの、てこを回そうとするはたらきの大きさはいくつですか。（数字のみ）", answer:"600", explain:"30×20＝600。"},
  {pillar:1, q:"てこで、棒を支えて回転の中心となる、動かない点を何といいますか。", answer:"支点", explain:"支点を中心に、左右のはたらきのつり合いを考える。"},
  {pillar:1, q:"「左まわりのはたらきの合計＝右まわりのはたらきの合計」のように、てこがつり合っていることを表す式を何といいますか。", answer:"つり合いの式", explain:"つり合いの式には、左右のはたらきの式のほか、（上向きの力の合計）＝（下向きの力の合計）を使ってもよい。"},
  {pillar:2, q:"軸の位置が固定され、滑車自身は移動しない滑車を何といいますか。", answer:"定滑車", explain:"定滑車は力の向きを変えられるが、力の大きさとひもを引く距離は変わらない。"},
  {pillar:2, q:"滑車の軸に物をつるし、ひもを引き上げるときに物といっしょに移動する滑車を何といいますか。", answer:"動滑車", explain:"動滑車は支える力を半分にできるが、ひもを引く距離は2倍になる。"},
  {pillar:2, q:"動滑車で120gのおもりを持ち上げるとき、ひもを支える力は何gですか。（数字のみ）", answer:"60", explain:"動滑車ではおもりの重さの半分の力ですむので、120÷2＝60（g）。"},
  {pillar:2, q:"動滑車で物を1m引き上げるには、ひもを何m引き上げる必要がありますか。（数字のみ）", answer:"2", explain:"動滑車では、物が動く距離の2倍だけひもを引く必要がある。"},
  {pillar:2, q:"動滑車が1個で、かかっているひもが3本のとき、120gのおもりを持ち上げるのに手で引く力は何gですか。（数字のみ）", answer:"40", explain:"手で引く力＝おもりの重さ÷動滑車にかかっているひもの数＝120÷3＝40（g）。"},
  {pillar:2, q:"1本のひもを使った組み合わせ滑車で、手で引く力を求める式は「おもりの重さ÷○○」です。○○は何ですか。", answer:"動滑車にかかっているひもの数", explain:"この式で、つり合っているときの手で引く力を求めることができる。"},
  {pillar:2, q:"滑車を利用して力の大きさが1/3倍になったとき、手で引く距離は何倍になりますか。（数字のみ）", answer:"3", explain:"力の大きさと動く距離は反比例の関係にあるので、力が1/3倍なら距離は3倍になる。"},
  {pillar:2, q:"滑車の重さが無視できない場合、おもりの重さに何を加えて考えますか。", answer:"滑車の重さ", explain:"おもりの重さと滑車の重さの和を、おもりの重さとして計算する。"},
  {pillar:2, q:"滑車の重さを考える場合、力の大きさと動く距離の関係は、滑車が軽いときと同じ反比例の関係になりますか、なりませんか。（3字で）", answer:"ならない", explain:"滑車の重さがあると、力の比と距離の比は単純な反比例にならない。まず力の関係を求め、その値をもとに反比例の関係を使って距離を計算する。"},
  {pillar:2, q:"つながっている1本のひもにかかる力は、場所によってどうなっていますか。（2字で）", answer:"同じ", explain:"1本のひもにかかる力は、どこも同じ大きさになる。"},
  {pillar:3, q:"いくつかの輪を1つの軸につけ、1つを回すと全部が同時に同じ向きに回転するようにつくられたものを何といいますか。", answer:"輪軸", explain:"てこと同じように「かかる力×半径」で回すはたらきを考える。"},
  {pillar:3, q:"輪軸を回そうとするはたらきは「かかる力×○○」で表されます。○○は何ですか。", answer:"半径", explain:"輪軸では、支点からの距離にあたるものが半径になる。"},
  {pillar:3, q:"小輪と大輪の半径比が1：2の輪軸で、小輪のおもりを10cm持ち上げるとき、大輪のひもは何cm引く必要がありますか。（数字のみ）", answer:"20", explain:"円周は半径に比例するので、半径が2倍の大輪では引く距離も2倍の20cmになる。"},
  {pillar:3, q:"輪軸で、半径の比がa：bのとき、それぞれにおもりをつるして動かしたときの移動距離の比はどうなりますか。（a、bを使って答える）", answer:"a：b", accept:["a:b","a対b"], explain:"輪軸では、半径とおもりの移動距離が比例する。"},
  {pillar:3, q:"輪軸で、半径の比がa：bのとき、それぞれにつるしてつり合うおもりの重さの比はどうなりますか。（a、bを使って答える）", answer:"b：a", accept:["b:a","b対a"], explain:"力の関係と半径の関係は逆比になるので、おもりの重さの比はb：aになる。"},
  {pillar:3, q:"自転車のペダル1回転あたりに進む距離を最も長くするには、後輪側のギアをどうすればよいですか。（2字で）", answer:"小さく", accept:["小さい"], explain:"後輪側のギアを小さく、ペダル側のギアを大きくすると、ペダル1回転で進む距離が最も長くなる。"}
];

/* ===================== ①構造テスト：まとめ選択 ===================== */
const kihonFinalRaw = [
  {pillar:1, q:"棒の左端から20cmの位置に30gのおもり、右端から30cmの位置に20gのおもりをつるして棒がつり合っています。このときの「左まわりのはたらき」と「右まわりのはたらき」の関係として正しいものはどれですか。", choices:["どちらも600で等しい","左まわりが600、右まわりが500で異なる","左まわりの方が大きい","右まわりの方が大きい"], answer:0, explain:"左まわり＝30×20＝600、右まわり＝20×30＝600で、どちらも600になりつり合う。"},
  {pillar:2, q:"動滑車を使って120gのおもりを持ち上げるとき、力と距離の関係として正しいものはどれですか。", choices:["力は半分ですむが、ひもを引く距離は2倍になる","力も距離も半分になる","力は2倍必要だが、ひもを引く距離は半分になる","力も距離も変わらない"], answer:0, explain:"動滑車では、支える力はおもりの重さの半分ですむが、ひもを引く距離はおもりが動く距離の2倍になる。力で得をして距離で損をする。"},
  {pillar:3, q:"半径4cmと半径6cmの輪軸で、それぞれにおもりをつるしてつり合わせるとき、おもりの重さの比（4cm側：6cm側）はどうなりますか。", choices:["3：2","2：3","1：1","4：6"], answer:0, explain:"半径の比が4：6（＝2：3）のとき、おもりの重さの比はその逆比の3：2になる。"}
];

/* ===================== ②黒太字テスト ===================== */
const kurojiBlocks = [
  {pillar:1, sub:"てこのつり合い", items:[
    {q:"てこを回そうとするはたらきの大きさを求める式は何ですか。", choices:["かかる力×支点からの距離","かかる力＋支点からの距離","かかる力÷支点からの距離","支点からの距離のみ"], answer:0},
    {q:"てこが水平につり合うとき成り立つ関係は何ですか。", choices:["左まわりのはたらきの合計＝右まわりのはたらきの合計","左まわりのはたらきの合計＞右まわりのはたらきの合計","左まわりのはたらきの合計＜右まわりのはたらきの合計","支点からの距離だけで決まる"], answer:0},
    {q:"てこの計算で、棒の重さはどこにかき入れますか。", choices:["重心","支点","作用点","力点"], answer:0},
    {q:"てこにはたらく力を書きこむとき、大きさや位置がわからない力が2つあるとき、どうするとよいですか。", choices:["そのどちらかを支点にする","両方とも無視する","両方とも作用点にする","両方とも力点にする"], answer:0},
    {q:"支点から10cmの位置に50gのおもりをつるしたときの、てこを回そうとするはたらきの大きさはいくつですか。", choices:["500","50","10","60"], answer:0},
    {q:"支点から30cmの位置に20gのおもりをつるしたときの、てこを回そうとするはたらきの大きさはいくつですか。", choices:["600","50","30","20"], answer:0},

/* ===================== 共通ビルド関数 ===================== */
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function finalize(q){
  const correctText = q.choices[q.answer];
  const order = shuffleArr(q.choices.map((c,i)=>i));
  const newChoices = order.map(i=>q.choices[i]);
  const newAnswer = newChoices.indexOf(correctText);
  const out = Object.assign({}, q, {choices:newChoices, answer:newAnswer});
  return out;
}

function normalizeAnswer(str){
  if(str===undefined || str===null) return "";
  let s = String(str).trim();
  s = s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  s = s.replace(/\s+/g,"");
  s = s.replace(/[『』「」]/g,"");
  return s;
}

function checkFillAnswer(item, userInput){
  const norm = normalizeAnswer(userInput);
  if(norm==="") return false;
  const candidates = [item.answer].concat(item.accept||[]);
  return candidates.some(c => normalizeAnswer(c)===norm);
}

function shuffleArrKeepBlocks(){
  const byPillar = {};
  kihonFillRaw.forEach((r,idx)=>{
    if(!byPillar[r.pillar]) byPillar[r.pillar]=[];
    byPillar[r.pillar].push(idx);
  });
  let out = [];
  [1,2,3].forEach(p=>{
    const idxs = shuffleArr(byPillar[p]||[]);
    idxs.forEach(idx=>{
      const r = kihonFillRaw[idx];
      out.push({
        type:"fill", id:"kihonFill_"+idx, q:r.q, answer:r.answer, accept:r.accept,
        explain:r.explain, lead:PILLARS[r.pillar].label, sub:PILLARS[r.pillar].full, pillar:r.pillar
      });
    });
  });
  return out;
}

function buildKihonFinalItems(){
  return kihonFinalRaw.map((r,idx)=>{
    const fq = finalize({q:r.q, choices:r.choices, answer:r.answer, explain:r.explain});
    return Object.assign({type:"choice", id:"kihonFinal_"+idx, pillar:r.pillar, sub:PILLARS[r.pillar].full}, fq);
  });
}

function buildKihonItems(){
  const overview = kihonOverviewScreens.map((s,idx)=>Object.assign({id:"kihonOv_"+idx, type:"info", wide:true}, s));
  const fills = shuffleArrKeepBlocks();
  const finals = shuffleArr(buildKihonFinalItems());
  return overview.concat(fills, finals);
}

function buildKurojiItems(){
  let out = [];
  kurojiBlocks.forEach((block,bi)=>{
    const shuffledItems = shuffleArr(block.items);
    shuffledItems.forEach((it,ii)=>{
      const fq = finalize(it);
      out.push(Object.assign({
        type:"choice",
        id:"kuroji_"+bi+"_"+ii,
        pillar:block.pillar,
        sub:block.sub
      }, fq));
    });
  });
  return out;
}

function buildMameItems(){
  const shuffled = shuffleArr(mameQuizRaw);
  return shuffled.map((r,idx)=>{
    const fq = finalize(r);
    return Object.assign({type:"choice", id:"mame_"+idx}, fq);
  });
}

function buildSankoItems(){
  return sankoNotes.map((n,idx)=>({
    type:"info", id:"sanko_"+idx, title:n.title, body:n.body, src:n.src, wide:true
  }));
}

/* ===================== 状態管理／localStorage ===================== */
const STORAGE_KEY = "tekokassha2_missed_v1";

function loadMissedStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveMissedStore(store){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){ /* 保存できない環境は無視 */ }
}

const SPEAK_RATE_KEY = "quizapp_speak_rate_v1";
function loadSpeakRate(){
  try{
    const v = parseFloat(localStorage.getItem(SPEAK_RATE_KEY));
    if(!isNaN(v) && v>=0.7 && v<=1.8) return v;
  }catch(e){}
  return 1.1;
}
function saveSpeakRate(v){
  try{ localStorage.setItem(SPEAK_RATE_KEY, String(v)); }catch(e){}
}

const state = {
  screen:"home",
  stageId:null,
  isRetry:false,
  items:[],
  currentIndex:0,
  scoreTotal:0,
  scoreCorrect:0,
  answerLog:[],
  results:{},
  missedStore: loadMissedStore(),
  answered:false,
  userInput:"",
  userChoiceIdx:null,
  speakRate: loadSpeakRate()
};

function startStage(stageId){
  const stage = STAGES.find(s=>s.id===stageId);
  state.stageId = stageId;
  state.isRetry = false;
  state.items = stage.build();
  state.currentIndex = 0;
  state.scoreTotal = state.items.filter(i=>i.type!=="info").length;
  state.scoreCorrect = 0;
  state.answerLog = [];
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  state.screen = "play";
  render();
}

function startRetry(stageId){
  const missed = state.missedStore[stageId] || {};
  const items = Object.values(missed);
  if(items.length===0) return;
  state.stageId = stageId;
  state.isRetry = true;
  state.items = shuffleArr(items);
  state.currentIndex = 0;
  state.scoreTotal = state.items.length;
  state.scoreCorrect = 0;
  state.answerLog = [];
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  state.screen = "play";
  render();
}

function currentItem(){ return state.items[state.currentIndex]; }

function submitChoice(idx){
  if(state.answered) return;
  const item = currentItem();
  const correct = idx === item.answer;
  state.answered = true;
  state.userChoiceIdx = idx;
  if(correct) state.scoreCorrect++;
  state.answerLog.push({item, wasCorrect:correct});
}

function submitFill(){
  if(state.answered) return;
  const item = currentItem();
  const correct = checkFillAnswer(item, state.userInput);
  state.answered = true;
  if(correct) state.scoreCorrect++;
  state.answerLog.push({item, wasCorrect:correct});
}

function nextItem(){
  stopSpeak();
  state.answered = false;
  state.userInput = "";
  state.userChoiceIdx = null;
  if(state.currentIndex < state.items.length-1){
    state.currentIndex++;
    render();
  }else{
    finishStage();
  }
}

function finishStage(){
  const stage = STAGES.find(s=>s.id===state.stageId);
  state.results[state.stageId] = {
    correct: state.scoreCorrect,
    total: state.scoreTotal,
    at: Date.now()
  };
  if(stage.scored){
    const missed = state.missedStore[state.stageId] || {};
    state.answerLog.forEach(log=>{
      const key = log.item.q;
      if(!log.wasCorrect){
        missed[key] = log.item;
      }else{
        if(missed[key]) delete missed[key];
      }
    });
    state.missedStore[state.stageId] = missed;
    saveMissedStore(state.missedStore);
  }
  state.screen = "result";
  render();
}

function backHome(){
  stopSpeak();
  stopMic();
  state.screen = "home";
  render();
}

/* ===================== 音声読み上げ（Web Speech API：読み上げ） ===================== */
let cachedVoices = [];

function speakSupported(){
  return typeof window!=="undefined" && "speechSynthesis" in window;
}

function refreshVoices(){
  if(speakSupported()) cachedVoices = window.speechSynthesis.getVoices() || [];
}
if(speakSupported()){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function getBestJaVoice(){
  const jaVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ja"));
  if(jaVoices.length===0) return null;
  const preferred = jaVoices.find(v => /google/i.test(v.name))
    || jaVoices.find(v => v.localService===false)
    || jaVoices[0];
  return preferred;
}

function speakText(text, btnId){
  if(!speakSupported()) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = state.speakRate;
  const voice = getBestJaVoice();
  if(voice) u.voice = voice;
  u.onend = ()=>{ setSpeakBtnState(btnId, false); };
  u.onerror = ()=>{ setSpeakBtnState(btnId, false); };
  window.speechSynthesis.speak(u);
  setSpeakBtnState(btnId, true);
}

function stopSpeak(){
  if(speakSupported()) window.speechSynthesis.cancel();
}

function toggleSpeak(text){
  if(!speakSupported()) return;
  if(window.speechSynthesis.speaking){
    stopSpeak();
    setSpeakBtnState("speakBtn", false);
  }else{
    speakText(text, "speakBtn");
  }
}

function updateSpeakRate(v){
  state.speakRate = parseFloat(v);
  saveSpeakRate(state.speakRate);
  const label = document.getElementById("speakRateLabel");
  if(label) label.textContent = state.speakRate.toFixed(1)+"倍";
}

function setSpeakBtnState(btnId, playing){
  const btn = document.getElementById(btnId);
  if(!btn) return;
  btn.classList.toggle("playing", playing);
  btn.innerHTML = playing ? "⏸ 読み上げを止める" : "🔊 音声で聞く";
}

/* マイク機能は精度の問題により削除済み。他の関数からの呼び出しに備えて no-op で残す */
function stopMic(){}

/* ===================== レンダリング ===================== */
const app = document.getElementById("app");

function render(){
  if(state.screen==="home") renderHome();
  else if(state.screen==="play") renderPlay();
  else if(state.screen==="result") renderResult();
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function pillarBadge(p){
  return (PILLARS[p] && PILLARS[p].label) || "";
}

function renderHome(){
  let html = `
    <div class="header">
      <h1>てこ・滑車・輪軸テスト</h1>
      <div class="sub">予習シリーズ5年下　理科　第2回　てこ・滑車・輪軸</div>
    </div>
    <div class="content">
  `;
  const scoredStages = STAGES.filter(s=>s.scored);
  const refStages = STAGES.filter(s=>!s.scored);

  html += `<div class="home-title">確認テスト</div>`;
  scoredStages.forEach(stage=>{
    const res = state.results[stage.id];
    const missedCount = Object.keys(state.missedStore[stage.id]||{}).length;
    html += `<div class="stage-card" onclick="startStage('${stage.id}')">
      <div class="stage-top">
        <div class="stage-name">${esc(stage.name)}</div>
        <div class="stage-badge">${res ? res.correct+"/"+res.total : "未挑戦"}</div>
      </div>
      <div class="stage-desc">${esc(stage.desc)}</div>
      ${res ? `<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(res.correct/res.total*100)}%"></div></div>` : ""}
      ${missedCount>0 ? `<div class="retry-btn" onclick="event.stopPropagation(); startRetry('${stage.id}')">🔁 苦手${missedCount}問を復習</div>` : ""}
    </div>`;
  });

  html += `<div class="home-title">参考情報（読みもの）</div>`;
  refStages.forEach(stage=>{
    html += `<div class="stage-card ref" onclick="startStage('${stage.id}')">
      <div class="stage-top">
        <div class="stage-name">${esc(stage.name)}</div>
        <div class="stage-badge">読みもの</div>
      </div>
      <div class="stage-desc">${esc(stage.desc)}</div>
    </div>`;
  });

  const totalMissed = STAGES.filter(s=>s.scored).reduce((sum,s)=>sum+Object.keys(state.missedStore[s.id]||{}).length,0);
  html += `<div class="footer-note">単一HTMLファイル・localStorageに端末内で保存されます</div>`;
  if(totalMissed>0){
    html += `<button class="reset-all-btn" id="resetAllBtn" onclick="doResetAll()">🗑️ 苦手リストをすべてリセット</button>`;
  }
  html += `</div>`;
  app.innerHTML = html;
}

function renderPlay(){
  const item = currentItem();
  const stage = STAGES.find(s=>s.id===state.stageId);
  const isInfo = item.type==="info";

  let html = `
    <div class="header">
      <h1>${esc(stage.name)}${state.isRetry?"（復習）":""}</h1>
      <div class="sub">${item.sub ? esc(item.sub) : esc(stage.desc)}</div>
    </div>
    <div class="content">
      <div class="play-topbar">
        <span>問題 ${state.currentIndex+1} / ${state.items.length}</span>
        <span onclick="backHome()" style="text-decoration:underline; cursor:pointer;">中断してホームへ</span>
      </div>
  `;

  if(isInfo){
    html += `<div class="qcard info">
      <div class="qtitle">${esc(item.title)}</div>
      ${item.speak ? `
      <div class="speak-row">
        <button id="speakBtn" class="speak-btn" onclick='toggleSpeak(${JSON.stringify(item.speak)})'>🔊 音声で聞く</button>
        <div class="speed-control">
          <span>速さ</span>
          <input type="range" min="0.7" max="1.8" step="0.1" value="${state.speakRate}" oninput="updateSpeakRate(this.value)">
          <span id="speakRateLabel">${state.speakRate.toFixed(1)}倍</span>
        </div>
      </div>` : ""}
      <div class="info-body ${item.wide?'wide':''}">${item.body}</div>
      ${item.src ? `<div class="src-tag">出典：${esc(item.src)}</div>` : ""}
      <button class="btn btn-ref" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次へ" : "結果を見る"}</button>
    </div>`;
  } else if(item.type==="fill"){
    html += `<div class="qcard">`;
    if(item.lead) html += `<div class="lead-badge">${esc(item.lead)}</div>`;
    html += `<div class="qtext">${esc(item.q)}</div>`;
    const inputClass = state.answered ? (checkFillAnswer(item, state.userInput) ? "correct":"wrong") : "";
    html += `<input type="text" id="fillInput" class="fill-input ${inputClass}" placeholder="答えを入力" value="${esc(state.userInput)}" ${state.answered?"disabled":""} onkeydown="if(event.key==='Enter'){state.userInput=this.value; submitFillUI();}">`;
    if(!state.answered){
      html += `<button class="btn btn-primary" onclick="submitFillUI()">こたえる</button>`;
    }else{
      const correct = checkFillAnswer(item, state.userInput);
      html += `<div class="explain-box ${correct?'good':'bad'}">
        <span class="mark-icon">${correct?"⭕":"❌"}</span><b>正解：${esc(item.answer)}</b><br>${esc(item.explain||"")}
      </div>`;
      html += `<button class="btn btn-primary" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次の問題へ" : "結果を見る"}</button>`;
    }
    html += `</div>`;
  } else if(item.type==="choice"){
    html += `<div class="qcard">`;
    if(item.pillar!==undefined && item.pillar!==null) html += `<div class="lead-badge">${esc(pillarBadge(item.pillar))}</div>`;
    html += `<div class="qtext">${esc(item.q)}</div>`;
    html += `<div class="choice-list">`;
    item.choices.forEach((c,idx)=>{
      let cls = "choice-btn";
      if(state.answered){
        if(idx===item.answer) cls += " correct";
        else if(idx===state.userChoiceIdx) cls += " wrong";
        else cls += " dim";
      }
      html += `<button class="${cls}" ${state.answered?"disabled":""} onclick="submitChoiceUI(${idx})">${esc(c)}</button>`;
    });
    html += `</div>`;
    if(state.answered){
      const correct = state.userChoiceIdx===item.answer;
      html += `<div class="explain-box ${correct?'good':'bad'}">
        <span class="mark-icon">${correct?"⭕":"❌"}</span>${esc(item.explain||"")}
      </div>`;
      html += `<button class="btn btn-primary" onclick="nextItem()">${state.currentIndex < state.items.length-1 ? "次の問題へ" : "結果を見る"}</button>`;
    }
    html += `</div>`;
  }

  html += `</div>`;
  app.innerHTML = html;
  if(item.type==="fill" && !state.answered){
    const el = document.getElementById("fillInput");
    if(el) el.focus();
  }
}

function submitChoiceUI(idx){
  submitChoice(idx);
  renderPlay();
}
function submitFillUI(){
  const el = document.getElementById("fillInput");
  if(el) state.userInput = el.value;
  submitFill();
  renderPlay();
}

function renderResult(){
  const stage = STAGES.find(s=>s.id===state.stageId);
  const wrongItems = state.answerLog.filter(l=>!l.wasCorrect).map(l=>l.item);
  const missedCount = Object.keys(state.missedStore[state.stageId]||{}).length;

  let html = `
    <div class="header">
      <h1>結果</h1>
      <div class="sub">${esc(stage.name)}${state.isRetry?"（復習）":""}</div>
    </div>
    <div class="content">
      <div class="qcard result-box">
        <div>できた問題</div>
        <div class="result-score">${state.scoreCorrect} / ${state.scoreTotal}</div>
        ${wrongItems.length>0 ? `
        <div class="wrong-list">
          <div class="wrong-list-label">まちがえた問題</div>
          ${wrongItems.map(it=>`<div class="wrong-item">${esc(it.q)}</div>`).join("")}
        </div>` : `<div class="perfect-msg">🎉 全問正解！</div>`}
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="${state.isRetry ? `startRetry('${state.stageId}')` : `startStage('${state.stageId}')`}">もう一度</button>
        <button class="btn btn-outline" onclick="backHome()">ホームへ</button>
      </div>
      ${(!state.isRetry && missedCount>0) ? `<button class="btn btn-danger-outline" style="margin-top:10px;" onclick="startRetry('${state.stageId}')">🔁 苦手${missedCount}問を復習する</button>` : ""}
    </div>
  `;
  app.innerHTML = html;
}

function doResetAll(){
  state.missedStore = {};
  saveMissedStore(state.missedStore);
  const btn = document.getElementById("resetAllBtn");
  if(btn){
    btn.textContent = "✅ リセットしました";
    setTimeout(()=>{ renderHome(); }, 1200);
  }
}

render();
</script>
</body>
</html>
